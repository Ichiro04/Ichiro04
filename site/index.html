<style>
/* Layout: drafting-sheet viewer. Left rail = vault tree, centre = note, right = on-this-page. Title block at top like an engineering drawing. */
:root {
  --bg: #f2f4f6;
  --panel: #ffffff;
  --ink: #131c26;
  --muted: #5a6978;
  --rule: #d5dbe2;
  --grid: #e6eaee;
  --accent: #1d5fc4;
  --accent-ink: #ffffff;
  --accent-soft: #e3edfb;
  --ok: #17794a;
  --wip: #a86400;
  --todo: #7b8794;
  --code-bg: #eaeef2;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141b; --panel: #151d26; --ink: #e4e9ef; --muted: #93a1b0; --rule: #28333f; --grid: #1b242e;
    --accent: #6ba3f5; --accent-ink: #0b1118; --accent-soft: #1b2a40;
    --ok: #4cc58a; --wip: #e4a547; --todo: #8794a3; --code-bg: #1b2530; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141b; --panel: #151d26; --ink: #e4e9ef; --muted: #93a1b0; --rule: #28333f; --grid: #1b242e;
  --accent: #6ba3f5; --accent-ink: #0b1118; --accent-soft: #1b2a40;
  --ok: #4cc58a; --wip: #e4a547; --todo: #8794a3; --code-bg: #1b2530; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 5rem; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.65 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  background-attachment: fixed;
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

/* Top bar */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem;
  padding: .6rem 1rem; background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand { font: 700 1.05rem/1 var(--f-display); font-stretch: 112%; letter-spacing: .02em; text-transform: uppercase; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--accent); }
.search { flex: 1; max-width: 34rem; position: relative; }
.search input {
  width: 100%; padding: .5rem .8rem .5rem 2.1rem; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: 400 .95rem var(--f-body);
}
.search svg { position: absolute; left: .65rem; top: 50%; translate: 0 -50%; color: var(--muted); }
.search kbd { position: absolute; right: .6rem; top: 50%; translate: 0 -50%; font: 500 .72rem var(--f-mono); color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 .35rem; }
.icon-btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; width: 2.3rem; height: 2.3rem; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { border-color: var(--accent); }
#menu-btn { display: none; }

/* Shell */
.shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr) 14rem; gap: 0; max-width: 90rem; margin: 0 auto; align-items: start; }
.rail { position: sticky; top: 3.7rem; height: calc(100vh - 3.7rem); overflow-y: auto; padding: 1rem .75rem 2rem 1rem; border-right: 1px solid var(--rule); background: color-mix(in srgb, var(--panel) 85%, transparent); }
.toc { position: sticky; top: 3.7rem; padding: 1.5rem 1rem; font-size: .85rem; max-height: calc(100vh - 3.7rem); overflow-y: auto; }
.toc h4 { font: 500 .72rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; }
.toc a { display: block; color: var(--muted); text-decoration: none; padding: .15rem 0 .15rem .7rem; border-left: 2px solid var(--rule); line-height: 1.4; }
.toc a:hover { color: var(--ink); border-left-color: var(--accent); }
.toc a.l3 { padding-left: 1.4rem; }
main { min-width: 0; padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 4rem; }

/* Tree */
.tree-h { font: 500 .72rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 1.1rem 0 .3rem .4rem; }
.tree-h:first-child { margin-top: 0; }
.tree a { display: block; padding: .28rem .5rem; border-radius: 5px; color: var(--ink); text-decoration: none; font-size: .9rem; line-height: 1.35; }
.tree a:hover { background: var(--accent-soft); }
.tree a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.tree a small { display: block; font: 400 .7rem var(--f-mono); color: var(--muted); }
.tree a[aria-current="page"] small { color: inherit; opacity: .8; }

/* Sheet (note) */
.sheet { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; max-width: 52rem; }
.titleblock { display: grid; grid-template-columns: 1fr auto; border-bottom: 1px solid var(--rule); font: 400 .72rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.titleblock div { padding: .45rem .9rem; min-width: 0; overflow-wrap: anywhere; }
.titleblock div + div { border-left: 1px solid var(--rule); text-align: right; }
.doc { padding: 1.4rem clamp(1rem, 4vw, 2.6rem) 2.4rem; overflow-wrap: break-word; }
.doc > :first-child { margin-top: 0; }
.doc h1 { font: 700 clamp(1.7rem, 4vw, 2.4rem)/1.1 var(--f-display); font-stretch: 108%; letter-spacing: -.01em; margin: 0 0 1rem; text-wrap: balance; }
.doc h2 { font: 650 1.3rem/1.2 var(--f-display); font-stretch: 105%; margin: 2.2rem 0 .6rem; padding-top: .9rem; border-top: 1px solid var(--rule); text-wrap: balance; }
.doc h3 { font: 600 1.05rem/1.3 var(--f-display); margin: 1.6rem 0 .4rem; }
.doc h4 { font: 600 .95rem var(--f-body); margin: 1.3rem 0 .3rem; }
.doc p { margin: .7rem 0; max-width: 68ch; }
.doc ul, .doc ol { margin: .6rem 0; padding-left: 1.4rem; max-width: 68ch; }
.doc li { margin: .2rem 0; }
.doc li.task { list-style: none; margin-left: -1.4rem; }
.doc code { font: 400 .87em var(--f-mono); background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.doc pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 6px; padding: .9rem 1rem; overflow-x: auto; }
.doc pre code { background: none; padding: 0; font-size: .85rem; line-height: 1.55; }
.doc blockquote { margin: 1rem 0; padding: .1rem 1rem; border-left: 3px solid var(--accent); color: var(--muted); }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 1.8rem 0; }
.tbl { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--rule); border-radius: 6px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.tbl th, .tbl td { padding: .5rem .8rem; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl th { font: 500 .75rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; background: var(--bg); color: var(--muted); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.chip { display: inline-block; font: 500 .7rem/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: .22rem .45rem; border-radius: 4px; margin-right: .5rem; border: 1px solid currentColor; vertical-align: .08em; }
.chip.done { color: var(--ok); } .chip.wip { color: var(--wip); } .chip.todo { color: var(--todo); }
.backlinks { max-width: 52rem; margin-top: 1.2rem; font-size: .9rem; color: var(--muted); }
.backlinks a { margin-right: 1rem; }

/* Home */
.home { max-width: 60rem; }
.home h1 { font: 700 clamp(2.2rem, 6vw, 3.6rem)/1 var(--f-display); font-stretch: 115%; text-transform: uppercase; letter-spacing: -.01em; margin: .5rem 0 .6rem; }
.home h1 span { color: var(--accent); }
.lede { max-width: 56ch; color: var(--muted); font-size: 1.08rem; margin: 0 0 1.6rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; margin-bottom: 1.8rem; }
.stat { background: var(--panel); padding: .9rem 1rem; }
.stat b { display: block; font: 700 1.9rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font: 400 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.progress { height: .6rem; display: flex; border-radius: 3px; overflow: hidden; background: var(--rule); margin: .5rem 0 .4rem; }
.progress i { display: block; height: 100%; }
.progress .p-done { background: var(--ok); } .progress .p-wip { background: var(--wip); }
.legend { font: 400 .75rem var(--f-mono); color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; }
.h2 { font: 500 .75rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 2rem 0 .7rem; }
.routes { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .8rem; }
.card { display: block; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: .9rem 1rem; text-decoration: none; color: var(--ink); }
.card:hover { border-color: var(--accent); }
.card b { display: block; font: 600 1rem var(--f-display); margin-bottom: .2rem; }
.card span { font-size: .85rem; color: var(--muted); }
.card small { display: block; margin-top: .5rem; font: 400 .7rem var(--f-mono); color: var(--accent); overflow-wrap: anywhere; }

/* Search results */
.results { max-width: 52rem; }
.hit { display: block; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: .8rem 1rem; margin-bottom: .6rem; text-decoration: none; color: var(--ink); }
.hit:hover { border-color: var(--accent); }
.hit b { font: 600 1.05rem var(--f-display); }
.hit small { display: block; font: 400 .72rem var(--f-mono); color: var(--muted); }
.hit p { margin: .3rem 0 0; font-size: .9rem; color: var(--muted); }
mark { background: var(--accent-soft); color: var(--ink); border-radius: 2px; padding: 0 .1em; }
.foot { margin-top: 2.5rem; font: 400 .72rem var(--f-mono); color: var(--muted); }

@media (max-width: 70rem) { .shell { grid-template-columns: 16rem minmax(0, 1fr); } .toc { display: none; } }
@media (max-width: 48rem) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #menu-btn { display: grid; }
  .brand { font-size: .95rem; }
  .search kbd { display: none; }
  .rail { position: fixed; z-index: 30; top: 3.7rem; left: 0; bottom: 0; width: min(20rem, 88vw); height: auto; background: var(--panel); translate: -100% 0; transition: translate .2s; }
  body.nav-open .rail { translate: 0 0; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }
</style>

<script>
const DATA = {"notes": [{"path": "HUB.md", "title": "HUB: everything in one place", "text": "# HUB: everything in one place\n\nMaster file for the Life Vault. Each section is a \"route\": copy only the section you need into a new chat, or tell the assistant to read this file and work on one route.\n\nLast updated: 2026-10-06\nRepo: Ichiro04/Ichiro04 (branch claude/capabilities-overview-83xgc2)\n\n## Routes (pick one per chat)\n| Route | Use it for | Starter message |\n|---|---|---|\n| A. Vault and companion | Notes, memory, organising the vault | \"Read HUB.md route A, then help me with the vault.\" |\n| B. Study | Roadmap lessons and self-tests | \"Read HUB.md route B and knowledge/roadmap/README.md, then continue my lesson.\" |\n| C. CAD and simulation | SolidWorks, AutoCAD, FEA/CFD work | \"Read HUB.md route C, then help me with CAD or simulation.\" |\n| D. OmniRoute | The AI gateway on my PC | \"Read HUB.md route D, then help me with OmniRoute.\" |\n| E. Career and portfolio | Goals, projects, portfolio | \"Read HUB.md route E, then help me with my portfolio.\" |\n\nFor any chat, first say: \"Also read README.md and agent/INSTRUCTIONS.md.\"\n\n---\n\n## About me (shared by every route)\n- Mechanical engineering, 4th year (graduated, bachelor's degree).\n- Focus: mechanical design and simulations.\n- Goal: be a well-known mechanical engineer.\n- Learning style: systematic.\n- Computer: Windows. Software: SolidWorks, AutoCAD. Simulation software: not decided yet.\n- I am a beginner with terminals and Git: explain steps one at a time, with exact commands.\n- No decorative or generated design in the vault. Plain text only.\n\n## Rules for the assistant (shared)\n- Raw notes are never deleted or rewritten. Add summaries and links beside them.\n- Never guess numbers (material values, standards, factors). Give the source or say it must be looked up.\n- Ask before deleting, moving, installing, sending, or spending.\n- Never store or repeat passwords or secrets. I must never paste a password in chat.\n- Teach: concept, equations, worked example, self-test. Hint before answers on my own design or homework.\n- A simulation result is only a claim until checked against a hand calculation or known case.\n\n---\n\n## Route A: Vault and companion\nGoal: a lifelong memory I own, in plain Markdown, backed up on GitHub, readable by any future AI.\n\nFolders: `inbox/ daily/ courses/ ideas/ projects/ knowledge/ cad/ career/ reference/ templates/ agent/ log/`\nKey files: `README.md`, `agent/INSTRUCTIONS.md`, `agent/PERMISSIONS.md`.\nPermission levels: free (read, write to inbox/daily/ideas/log), ask first (delete, move, run scripts, send, touch CAD files), never (password managers, banking, system folders).\n\nDaily routine: copy `templates/daily.md` to `daily/<date>.md`, capture in `inbox/`, weekly review with `templates/weekly-review.md`.\n\nBuild plan:\n1. Vault (done).\n2. Search and Q&A over the vault.\n3. Voice capture, calendar and Drive links, scheduled weekly reviews.\n4. Always-on Windows agent with voice, then engineering tools.\n\nOpen-source Jarvis projects considered (not installed): ethanplusai/jarvis (macOS, Claude Code voice), eadmin2/jarvis_ai, Likhithsai2580/JARVIS, omnigentx/jarvis, Shaan-alpha/jarvis-py (offline). Review code before running any.\n\nOn my PC: clone is at `$HOME\\Documents\\LifeVault`. Update with `git pull`. Save changes with `git add -A`, `git commit -m \"message\"`, `git push`.\n\n## Route B: Study\nRoadmap: `knowledge/roadmap/README.md` (5 stages, checkboxes: [ ] not started, [~] in progress, [x] can explain and solve).\n\nStage 1 progress:\n- [x] Material properties and selection\n- [~] Statics, Mechanics of materials, Beam deflection and buckling, Stress concentration\n- [ ] Stress transformation and Mohr's circle, Failure theories, Fatigue basics\n\nCurrent lesson: `knowledge/roadmap/lessons/stage1-01-statics.md` (statics, free-body diagrams, equilibrium). Self-test Q1-Q3 are waiting for my answers.\nSuggested order: statics, mechanics of materials, Mohr's circle, failure theories, beam deflection and buckling, stress concentration, fatigue.\nEach topic: learn, write a note in my own words, solve a hand problem, link to a project. Study log: `templates/study-session.md`.\n\n## Route C: CAD and simulation\nFiles: `knowledge/simulation/setup-checklist.md`, `knowledge/design-rules/design-checklist.md`, `knowledge/cad-practice/README.md`, `templates/simulation-log.md`, `templates/design-review.md`, `cad/solidworks/`, `cad/autocad/`.\nPlan: SolidWorks and AutoCAD can be scripted (SolidWorks API, AutoCAD scripting/AutoLISP). Start with small safe tasks like batch-exporting drawings to PDF. Always work on copies. Keep large CAD files outside Git (.gitignore blocks .sldprt, .sldasm, .dwg and similar).\nSimulation habits: define the question, check boundary conditions, run a mesh convergence study, check reactions, avoid trusting stress at singularities, compare to a hand calculation.\n\n## Route D: OmniRoute (open-source AI gateway)\nRepo: github.com/diegosouzapw/OmniRoute (MIT). Installed on my PC: v3.8.51, Node v24.21.0.\n- Install: `npm install -g omniroute`. Start: `omniroute`. Stop: Ctrl+C. Dashboard and API: http://localhost:20128 (API base /v1).\n- Keep it local-only. Put these lines in `C:\\Users\\henry\\.omniroute\\.env`:\n  `OMNIROUTE_SERVER_HOST=127.0.0.1` and `REQUIRE_API_KEY=true`\n- In PowerShell, set a variable for one window with `$env:NAME=\"value\"` (needs `$env:`).\n- Reset dashboard password: stop it, run `omniroute reset-password`, then restart. My earlier password was shown in a screenshot; keep it changed and never share a new one.\n- Diagnose problems: `omniroute doctor`. First start can be slow (it may say it did not respond in 60s while still starting).\n- Cautions: no main accounts or provider keys yet, no vault connection yet, do not enable TLS stealth or MITM/TPROXY features, \"free\" providers may break provider terms or log data. Back up `.env` later (holds the key that encrypts saved provider keys).\n- Why it may matter: later, my own assistant app could use it to switch between models. Not needed for the vault.\n\n## Route E: Career and portfolio\nFolder: `career/portfolio/`. One folder per finished project: problem and constraints, approach and decisions, analysis (calculated, simulated, how checked), result with units, what went wrong, images or drawings (stored outside Git if large).\nAim: 3-5 well-explained projects beat many shallow ones.\nLong-term: a \"life company\" for me, not a social platform, a real companion that holds my memos and helps with tips, ways, creations and ideas.\n\n---\n\n## Open items\n1. Answer statics self-test Q1-Q3.\n2. Decide simulation software (SolidWorks Simulation, ANSYS, Abaqus, COMSOL).\n3. Confirm OmniRoute password is changed and the two security lines are in `.env`.\n4. Fill roadmap Stage 2-5 progress.\n5. Start the first daily note.\n\n## Change log\n- 2026-10-06: vault created, profile added, roadmap and templates added, session notes saved, HUB created.\n"}, {"path": "README.md", "title": "Life Vault", "text": "# Life Vault\n\nA plain-text memory for my engineering studies and career. Everything is Markdown so it can be read by any tool, now or in 20 years.\n\n## Start here\nRead `HUB.md`. It is the single master file with routes for vault, study, CAD and simulation, OmniRoute, and career.\n\n## Rules\n1. Raw notes are never deleted or rewritten by the agent. It may add summaries and links next to them.\n2. Everything lives in files in this repo. No notes are locked inside an app.\n3. No passwords, ID numbers or medical data in here.\n4. Commit often. Git is the undo button and the backup.\n\n## Layout\n| Folder | Purpose |\n|---|---|\n| `inbox/` | Quick capture. Dump anything here, sort it later. |\n| `daily/` | One note per day (`YYYY-MM-DD.md`). |\n| `courses/` | One folder per course: lectures, assignments, exam prep. |\n| `ideas/` | Ideas and inventions, one file each. |\n| `projects/` | One folder per project. Copy `projects/_template`. |\n| `knowledge/` | Long-lived reference: `roadmap/` (study plan), `simulation/`, `design-rules/`, `cad-practice/`, formulas, materials, lessons learned. |\n| `cad/` | Notes and scripts for SolidWorks and AutoCAD. Keep large CAD files outside Git. |\n| `career/` | Goals, skills, internships, contacts, reading list. `portfolio/` holds finished projects. |\n| `reference/` | Standards, datasheets, links. |\n| `templates/` | Note templates. |\n| `agent/` | Instructions and permission rules for the AI companion. |\n| `log/` | Record of actions the agent took. |\n\n## Daily routine\n1. Open `templates/daily.md`, copy it to `daily/<date>.md`.\n2. Capture thoughts in `inbox/` during the day.\n3. Once a week, run the weekly review (`templates/weekly-review.md`).\n4. Study from `knowledge/roadmap/README.md` using `templates/study-session.md`.\n5. Log each simulation with `templates/simulation-log.md` and review designs with `templates/design-review.md`.\n"}, {"path": "agent/INSTRUCTIONS.md", "title": "Companion instructions", "text": "# Companion instructions\n\nYou are my long-term engineering companion. I am a mechanical engineering student using Windows, SolidWorks and AutoCAD. This repo is your memory of me.\n\n## How to behave\n- Read `README.md` and `agent/PERMISSIONS.md` at the start of every session.\n- Answer from my notes first. Say which files you used. If my notes don't cover it, say so before using general knowledge.\n- Be direct. Give reasoning and show calculations with units.\n- Flag uncertainty. Never invent formulas, material values or standards.\n\n## Memory rules\n- New raw input goes to `inbox/`. Never edit or delete my original notes.\n- You may create summaries, tags and links in separate files or in a clearly marked `## Agent notes` section.\n- Link related notes with relative Markdown links.\n- Record every file you create, move or change in `log/YYYY-MM.md`.\n\n## What I want from you\n- Capture and organise my notes.\n- Recall: find what I learned before.\n- Connect ideas across courses and projects.\n- Coach: study plans, exam prep from my own notes, design tips.\n- Brainstorm and critique my designs. Do not generate designs for me. I do the design work.\n\n## Profile (fill in)\n- Year of study: 4th year (Graduated in Bachelor degree)\n- Focus area: Mechanical Design and Simulations\n- Goals: To be a well-known Mechanical engineer\n- How I like to learn: Systematically \n\n## Learning style: systematic\n- Teach in order: concept, then equations, then a worked example, then a self-test question.\n- Build from fundamentals. Check the roadmap in `knowledge/roadmap/README.md` for prerequisites.\n- Show every step and every unit. State assumptions.\n- End each lesson with 2-3 questions for me to answer, and wait for my answers before correcting.\n- Do not give a final answer to my design or homework problem before I have tried it. Hint first.\n- Never present a simulation result as correct without a check against a hand calculation or known case.\n- When I finish a topic, update the roadmap checkbox and suggest the next topic.\n- If a value (material property, standard, factor) is needed, give the source or say it must be looked up. Never guess numbers.\n"}, {"path": "agent/PERMISSIONS.md", "title": "Permissions", "text": "# Permissions\n\n## Free (no need to ask)\n- Read and search any file in this repo.\n- Create and edit files in `inbox/`, `daily/`, `ideas/`, `log/`.\n- Add summaries and links.\n\n## Ask first\n- Deleting, moving or renaming existing files.\n- Editing my notes in `courses/`, `projects/`, `knowledge/`.\n- Running scripts, installing software, changing system settings.\n- Sending messages or emails, or anything outward-facing.\n- Touching SolidWorks or AutoCAD files. Work on copies only.\n\n## Never\n- Access password managers, banking or system folders.\n- Delete originals or rewrite history in Git.\n- Store secrets or personal ID data in this repo.\n"}, {"path": "cad/README.md", "title": "CAD notes", "text": "# CAD notes\n\n- `solidworks/`: macros, API scripts, tips, templates notes.\n- `autocad/`: AutoLISP, scripts, tips, drawing standards.\n\nKeep large `.sldprt`, `.sldasm`, `.dwg` files outside Git (or use Git LFS). Track notes and scripts only.\nTest any automation on copies of files.\n"}, {"path": "career/portfolio/README.md", "title": "Portfolio", "text": "# Portfolio\n\nOne folder per finished project. Keep it honest and specific.\n\nFor each project record:\n1. The problem and constraints.\n2. The approach and the main design decisions.\n3. The analysis: what was calculated, what was simulated, and how it was checked.\n4. The result (numbers with units).\n5. What went wrong and what I learned.\n6. Images or drawings (stored outside Git if large).\n\nA portfolio of 3-5 well explained projects is worth more than many shallow ones.\n"}, {"path": "knowledge/cad-practice/README.md", "title": "CAD practice", "text": "# CAD practice\n\nHabits and lessons for SolidWorks and AutoCAD. One file per topic.\n\n## Rules\n- Fully define every sketch.\n- Name key features and dimensions.\n- Build design intent in: what should change when a dimension changes?\n- Keep a copy of any file before experimenting.\n- Save large CAD files outside Git. Record their location in the project README.\n"}, {"path": "knowledge/design-rules/README.md", "title": "Design rules", "text": "# Design rules\n\nReusable design checks. One file per topic (bolted joints, shafts, welds and so on).\nRecord the source (textbook, standard, supplier) for every rule. Do not store a rule without its source.\n"}, {"path": "knowledge/design-rules/design-checklist.md", "title": "Design checklist", "text": "# Design checklist\n\n## Requirements\n- [ ] Function stated in one sentence\n- [ ] Loads, speeds, temperatures, environment listed\n- [ ] Required life and safety factor decided\n- [ ] Applicable standards identified\n\n## Design\n- [ ] Load path is clear and direct\n- [ ] Stress concentrations reduced (radii, gradual changes)\n- [ ] Material chosen with a reason\n- [ ] Fits and tolerances specified\n- [ ] Assembly and disassembly possible\n- [ ] Maintenance access considered\n\n## Manufacturing\n- [ ] Process chosen (machining, casting, sheet metal, 3D print, welding)\n- [ ] Features suit that process\n- [ ] Standard parts used where possible\n\n## Verification\n- [ ] Hand calculation for each critical part\n- [ ] Simulation checked against the hand calculation\n- [ ] Failure modes listed\n\n## Documentation\n- [ ] Drawing complete and checked\n- [ ] Calculation sheet saved in the project folder\n- [ ] Decisions recorded in the project README\n"}, {"path": "knowledge/lessons-learned/README.md", "title": "Lessons learned", "text": "# Lessons learned\n\nOne file per lesson. Use the form: what happened, why, what to do next time.\n"}, {"path": "knowledge/roadmap/README.md", "title": "Learning roadmap: Mechanical Design and Simulation", "text": "# Learning roadmap: Mechanical Design and Simulation\n\nWork through the stages in order. Each stage ends with a self-test. Do not move on until you can explain the stage in your own words and solve a problem by hand.\n\nMark each topic: `[ ]` not started, `[~]` in progress, `[x]` can explain and solve.\n\n## Stage 1: Fundamentals (hand calculation first)\n- [~] Statics: free-body diagrams, equilibrium, reactions\n- [~] Mechanics of materials: stress, strain, axial, torsion, bending, shear\n- [ ] Stress transformation, Mohr's circle, principal stresses\n- [ ] Failure theories: von Mises, Tresca, max normal stress\n- [~] Beam deflection, buckling\n- [~] Stress concentration\n- [ ] Fatigue basics: S-N curves, endurance limit, mean stress\n- [x] Material properties and selection basics\n- Self-test: size a shaft or bracket by hand, with units and a safety factor.\n\n## Stage 2: Machine design\n- [ ] Fasteners and bolted joints\n- [ ] Welds\n- [ ] Shafts, keys, couplings\n- [ ] Bearings\n- [ ] Gears\n- [ ] Springs\n- [ ] Tolerances, fits, GD&T\n- [ ] Manufacturing processes and design for manufacture\n- Self-test: design a small assembly with a calculation sheet for each critical part.\n\n## Stage 3: CAD discipline (SolidWorks, AutoCAD)\n- [ ] Sketch rules: fully defined sketches, sensible constraints\n- [ ] Feature order and design intent\n- [ ] Assemblies and mates\n- [ ] Configurations and design tables\n- [ ] Drawings: views, dimensions, tolerances, notes\n- [ ] AutoCAD 2D drafting standards\n- Self-test: a part that survives a dimension change without rebuild errors.\n\n## Stage 4: Simulation theory\n- [ ] Finite element method: elements, nodes, shape functions, stiffness idea\n- [ ] Linear static analysis\n- [ ] Boundary conditions and loads: what is physically realistic\n- [ ] Mesh quality, convergence, mesh refinement study\n- [ ] Contacts and connections\n- [ ] Singularities and how to read stress hot spots\n- [ ] Modal (natural frequency) analysis\n- [ ] Thermal and thermal-stress analysis\n- [ ] Buckling analysis\n- [ ] Nonlinear basics: material, geometric, contact\n- [ ] CFD basics: governing equations, meshing, turbulence models, y+\n- Self-test: validate a simulation against a hand calculation and explain any difference.\n\n## Stage 5: Verification and practice\n- [ ] Verification vs validation\n- [ ] Sanity checks for every result\n- [ ] Writing a clear analysis report\n- [ ] Design review habit\n- [ ] Building a portfolio piece from a finished project\n\n## Rule for every topic\n1. Learn it from a textbook or course.\n2. Write a short note in your own words in `knowledge/`.\n3. Solve a hand problem. Record it.\n4. Link the note to any project that used it.\n"}, {"path": "knowledge/roadmap/lessons/stage1-01-statics.md", "title": "Statics: free-body diagrams and equilibrium", "text": "# Statics: free-body diagrams and equilibrium\n\nRoadmap: Stage 1, topic 1. Status: in progress.\n\n## Concept\nStatics asks: if a body is not moving, what forces must act on it? A body at rest (or constant velocity) is in equilibrium: forces and moments balance.\n\nFree-body diagram (FBD):\n1. Isolate the body.\n2. Draw it alone.\n3. Replace everything removed with the forces and moments it applied.\n4. Add axes and dimensions.\n\nMost statics mistakes are FBD mistakes, not algebra mistakes.\n\n## Equations (2D)\n- Sum Fx = 0\n- Sum Fy = 0\n- Sum M = 0 (about any point)\n\nThree independent equations, so at most 3 unknowns by statics alone.\n\nMoment = force x perpendicular distance (N.m). Take moments about a point where unknown forces pass through, so they drop out.\n\n## Support reactions\n| Support | Reactions | Unknowns |\n|---|---|---|\n| Roller | one force, perpendicular to surface | 1 |\n| Pin | two force components (x, y) | 2 |\n| Fixed | two force components and a moment | 3 |\n\n## Worked example\nSimply supported beam, 4 m long. Pin at A (left), roller at B (right). Downward 10 kN load 1 m from A.\n\n1. Sum Fx = 0 gives Ax = 0.\n2. Moments about A (counter-clockwise positive): By(4) - 10(1) = 0, so By = 2.5 kN up.\n3. Sum Fy = 0: Ay + By - 10 = 0, so Ay = 7.5 kN up.\n4. Check with moments about B: -Ay(4) + 10(3) = 0, so Ay = 7.5 kN. OK.\n\nSanity check: load is closer to A, so A carries more.\n\n## Common mistakes\n- Forgetting a reaction at a support.\n- Mixing up signs. Pick a positive direction and keep it.\n- Using distance along the beam instead of the perpendicular distance.\n- Skipping units.\n\n## Self-test (my answers go below; do not look anything up first)\nQ1. Simply supported beam, 6 m long, pin at A (left), roller at B (right), downward 12 kN load 2 m from A. Find Ay, Ax, By with equations and units.\nQ2. Why at most 3 unknowns in a 2D statics problem? What does it mean if the FBD has 4 unknown reactions?\nQ3. Why does a pin give 2 reaction components while a roller gives 1?\n\n## My answers\n(write here)\n\n## Result\nNot yet answered.\n"}, {"path": "knowledge/simulation/README.md", "title": "Simulation knowledge", "text": "# Simulation knowledge\n\nNotes on FEA and CFD: setup, lessons, checklists. One file per topic.\n\nSuggested files to create as you learn:\n- `mesh-convergence.md`\n- `boundary-conditions.md`\n- `contacts.md`\n- `modal-analysis.md`\n- `thermal.md`\n- `cfd-basics.md`\n- `common-mistakes.md`\n\n## Core principle\nA simulation result is only a claim until it is checked. Always compare to a hand calculation, a known case or a test.\n"}, {"path": "knowledge/simulation/setup-checklist.md", "title": "Simulation setup checklist", "text": "# Simulation setup checklist\n\nFill in before running. Copy to the project folder.\n\n## Goal\n- What question is the simulation answering?\n- What result would change a design decision?\n\n## Geometry\n- [ ] Simplified: removed small fillets, holes and threads that do not matter for this question\n- [ ] Symmetry used where valid\n\n## Material\n- [ ] Properties from a documented source (record the source)\n- [ ] Linear or nonlinear behaviour decided and justified\n- [ ] Units consistent\n\n## Loads\n- [ ] Every load has a physical source\n- [ ] Direction, magnitude and application area checked\n- [ ] Load case combinations listed\n\n## Boundary conditions\n- [ ] Not over-constrained (no fake stiffness)\n- [ ] Not under-constrained (no rigid-body motion)\n- [ ] Reactions checked against applied loads\n\n## Contacts and connections\n- [ ] Contact types chosen on purpose\n- [ ] Bolts and pins modelled at the right level of detail\n\n## Mesh\n- [ ] Finer mesh where stress changes quickly\n- [ ] Mesh quality metrics checked\n- [ ] Convergence study done on the result that matters\n\n## Results review\n- [ ] Reactions equal applied loads\n- [ ] Deformation shape looks physically sensible\n- [ ] Peak stress not at a singularity (point load, sharp corner, constraint edge)\n- [ ] Compared with a hand calculation\n- [ ] Safety factor computed against the correct failure criterion\n"}, {"path": "log/sessions/2026-10-06-setup-session.md", "title": "Session notes: 2026-10-06 (setup session)", "text": "# Session notes: 2026-10-06 (setup session)\n\nPurpose: save the key decisions and state from the first long chat, so nothing depends on the chat history.\n\n## Goal\nA lifelong engineering companion for me (mechanical engineering, 4th year graduated, focus on mechanical design and simulations). It keeps my memos and notes, teaches systematically, and helps with ideas, tips and creations. It is a private memory, not a social platform.\n\n## Decisions\n- Memory = plain Markdown files in this Git repo. I own it. Any AI can read it later.\n- Start with the Claude desktop app plus this vault. Build a custom Windows agent later, once I know what I need.\n- Computer-control access comes in layers: free, ask first, never (see `agent/PERMISSIONS.md`).\n- No generated or decorative design in the vault. Plain text only.\n- Software I use: Windows, SolidWorks, AutoCAD. Simulation software: to be decided.\n\n## What exists in the vault\n- `README.md` rules and folder map\n- `agent/INSTRUCTIONS.md` and `agent/PERMISSIONS.md`\n- `templates/` daily, weekly review, lecture, idea, simulation log, design review, study session\n- `knowledge/roadmap/README.md` five-stage learning roadmap\n- `knowledge/simulation/`, `knowledge/design-rules/`, `knowledge/cad-practice/`\n- `career/portfolio/`\n\n## Roadmap progress (Stage 1)\n- Material properties and selection: can explain and solve\n- In progress: statics, mechanics of materials, beam deflection and buckling, stress concentration\n- Not started: stress transformation and Mohr's circle, failure theories, fatigue\n\n## Current lesson\nStatics lesson saved at `knowledge/roadmap/lessons/stage1-01-statics.md`. Self-test questions are waiting for my answers.\n\n## OmniRoute (open-source AI gateway) installed on my PC\n- Installed with: `npm install -g omniroute` (version 3.8.51, Node v24.21.0).\n- Runs at http://localhost:20128. Start with `omniroute`, stop with Ctrl+C.\n- Security settings to keep (put in `C:\\Users\\henry\\.omniroute\\.env`):\n  - `OMNIROUTE_SERVER_HOST=127.0.0.1`\n  - `REQUIRE_API_KEY=true`\n- PowerShell sets variables for one window with `$env:NAME=\"value\"`.\n- Reset the dashboard password with `omniroute reset-password`, then restart.\n- Rules for now: no main accounts or provider keys added, vault not connected to it.\n- Never store passwords in this repo or paste them in chat. My earlier password was exposed in a screenshot and must stay changed.\n- Back up `C:\\Users\\henry\\.omniroute\\.env` later (it holds the key that encrypts saved provider keys).\n\n## Open items\n1. Answer the statics self-test (Q1-Q3).\n2. Decide simulation software (SolidWorks Simulation, ANSYS, Abaqus, COMSOL).\n3. Make sure the OmniRoute password has been changed again.\n4. Later: search tool over the vault, SolidWorks/AutoCAD scripts, voice layer.\n\n## How to continue in a new chat\nTell the assistant: \"Read README.md, agent/INSTRUCTIONS.md and log/sessions/2026-10-06-setup-session.md, then continue from Open items.\"\n"}, {"path": "projects/_template/README.md", "title": "Project name", "text": "# Project name\n\nStatus:\nStart date:\nGoal:\n\n## Requirements\n- \n\n## Design decisions\n| Date | Decision | Reason |\n|---|---|---|\n\n## Calculations\n- \n\n## Test results\n- \n\n## What worked / what failed\n- \n\n## Files\n- CAD files are stored at: (path outside Git)\n"}, {"path": "templates/daily.md", "title": "YYYY-MM-DD", "text": "# YYYY-MM-DD\n\n## Plan\n- \n\n## Done\n- \n\n## Learned\n- \n\n## Ideas\n- \n\n## Problems / questions\n- \n"}, {"path": "templates/design-review.md", "title": "Design review: part / assembly name", "text": "# Design review: part / assembly name\n\nDate:\nReviewer: me\n\n## Purpose\n- \n\n## What I checked\n- [ ] Requirements met\n- [ ] Load path\n- [ ] Stress and deflection\n- [ ] Fatigue where it applies\n- [ ] Tolerances and fits\n- [ ] Manufacturing method\n- [ ] Assembly and maintenance\n\n## Problems found\n| Problem | Severity | Fix |\n|---|---|---|\n\n## Decision\nApproved / Approved with changes / Rejected\n\n## Notes\n- \n"}, {"path": "templates/idea.md", "title": "Idea title", "text": "# Idea title\n\nDate:\nStatus: raw / exploring / tested / dropped\n\n## The idea\n- \n\n## Why it might work\n- \n\n## Risks / unknowns\n- \n\n## Next step\n- \n"}, {"path": "templates/lecture-note.md", "title": "Course: Topic (YYYY-MM-DD)", "text": "# Course: Topic (YYYY-MM-DD)\n\n## Key points\n- \n\n## Formulas\n- \n\n## Worked example\n- \n\n## Questions\n- \n\n## Links\n- \n"}, {"path": "templates/simulation-log.md", "title": "Simulation log: project / run name", "text": "# Simulation log: project / run name\n\nDate:\nSoftware and version:\nAnalysis type: static / modal / thermal / buckling / nonlinear / CFD\n\n## Question\n- \n\n## Model\n- Geometry simplifications:\n- Material and source:\n- Loads:\n- Boundary conditions:\n- Contacts:\n\n## Mesh\n- Element type and size:\n- Refinement areas:\n- Convergence result:\n\n## Results\n- Key values (with units):\n- Deformation shape:\n- Reaction check:\n\n## Check against hand calculation\n- Hand result:\n- Simulation result:\n- Difference and reason:\n\n## Conclusion\n- \n\n## What I would do differently\n- \n"}, {"path": "templates/study-session.md", "title": "Study session: topic", "text": "# Study session: topic\n\nDate:\nRoadmap stage:\n\n## Goal\n- \n\n## Notes in my own words\n- \n\n## Hand problem\n- Problem:\n- Solution with units:\n\n## Self-test\n- Can I explain it without notes? yes / partly / no\n- What was unclear?\n\n## Next\n- \n"}, {"path": "templates/weekly-review.md", "title": "Weekly review: YYYY-Www", "text": "# Weekly review: YYYY-Www\n\n## What I did\n- \n\n## What I learned\n- \n\n## What went wrong, and why\n- \n\n## Open questions\n- \n\n## Next week\n- \n"}], "rev": "017aaa4"};
const NOTES = DATA.notes;
const BY_PATH = Object.fromEntries(NOTES.map(n => [n.path, n]));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/* ---------- Markdown ---------- */
function resolve(from, href) {
  const parts = from.split("/").slice(0, -1);
  for (const seg of href.split("/")) {
    if (seg === "..") parts.pop(); else if (seg !== "." && seg !== "") parts.push(seg);
  }
  return parts.join("/");
}
function inline(s, from) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => {
    href = href.replace(/&amp;/g, "&");
    if (/^https?:/.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
    const [file, frag] = href.split("#");
    const target = file ? resolve(from, file) : from;
    if (BY_PATH[target]) return `<a href="#/${encodeURI(target)}">${text}</a>`;
    return `<span title="Not in vault: ${esc(href)}">${text}</span>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:]|$)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}
function parseList(lines, i, from) {
  const indentOf = l => l.match(/^ */)[0].length;
  const base = indentOf(lines[i]);
  const ordered = /^\s*\d+[.)]\s/.test(lines[i]);
  let out = `<${ordered ? "ol" : "ul"}>`;
  while (i < lines.length) {
    const l = lines[i], ind = indentOf(l);
    const m = l.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/);
    if (!m || ind < base) break;
    if (ind > base) { const [html, ni] = parseList(lines, i, from); out = out.replace(/<\/li>$/, html + "</li>"); i = ni; continue; }
    let body = m[1], cls = "";
    const t = body.match(/^\[([ x~X])\]\s+(.*)$/);
    if (t) {
      const k = t[1] === " " ? ["todo", "Not started"] : t[1] === "~" ? ["wip", "In progress"] : ["done", "Done"];
      body = `<span class="chip ${k[0]}">${k[1]}</span>` + inline(t[2], from); cls = ' class="task"';
    } else body = inline(body, from);
    out += `<li${cls}>${body}</li>`; i++;
  }
  return [out + `</${ordered ? "ol" : "ul"}>`, i];
}
function render(md, from) {
  const lines = md.replace(/\r\n/g, "\n").split("\n"), out = [], heads = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      const n = h[1].length, id = "h" + heads.length;
      heads.push({ n, id, text: h[2].replace(/[`*]/g, "") });
      out.push(`<h${n} id="${id}">${inline(h[2], from)}</h${n}>`); i++; continue;
    }
    if (/^\s*([-*_])\1{2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c, from)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c, from)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "), from)}</blockquote>`); continue;
    }
    if (/^\s*(?:[-*+]|\d+[.)])\s+/.test(l)) { const [html, ni] = parseList(lines, i, from); out.push(html); i = ni; continue; }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>\s?|\s*(?:[-*+]|\d+[.)])\s+|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "), from)}</p>`);
  }
  return { html: out.join("\n"), heads };
}

/* ---------- Derived data ---------- */
const FOLDER_LABEL = { "": "Root", agent: "Agent", cad: "CAD", career: "Career", courses: "Courses", daily: "Daily", ideas: "Ideas", inbox: "Inbox", knowledge: "Knowledge", log: "Log", projects: "Projects", reference: "Reference", templates: "Templates" };
const folderOf = p => p.includes("/") ? p.split("/")[0] : "";
const backlinks = {};
for (const n of NOTES) {
  for (const m of n.text.matchAll(/\[[^\]]+\]\(([^)\s#]+)(?:#[^)]*)?\)/g)) {
    if (/^https?:/.test(m[1])) continue;
    const t = resolve(n.path, m[1]);
    if (BY_PATH[t] && t !== n.path) (backlinks[t] ||= new Set()).add(n.path);
  }
}
const tally = { done: 0, wip: 0, todo: 0 };
for (const n of NOTES) for (const m of n.text.matchAll(/^\s*[-*]\s+\[([ x~X])\]/gm)) tally[m[1] === " " ? "todo" : m[1] === "~" ? "wip" : "done"]++;

/* ---------- Views ---------- */
function buildTree(current) {
  const groups = {};
  for (const n of NOTES) (groups[folderOf(n.path)] ||= []).push(n);
  const order = ["", ...Object.keys(FOLDER_LABEL).filter(k => k && groups[k])];
  let html = `<a href="#/" ${current === "" ? 'aria-current="page"' : ""}>Home</a>`;
  for (const g of order) {
    if (!groups[g]) continue;
    html += `<div class="tree-h">${FOLDER_LABEL[g] || g}</div>`;
    for (const n of groups[g]) html += `<a href="#/${encodeURI(n.path)}" ${n.path === current ? 'aria-current="page"' : ""}>${esc(n.title)}<small>${esc(n.path)}</small></a>`;
  }
  $("#tree").innerHTML = html;
}
function home() {
  const total = tally.done + tally.wip + tally.todo || 1;
  const routes = NOTES.filter(n => ["HUB.md", "README.md", "knowledge/roadmap/README.md", "agent/INSTRUCTIONS.md", "career/portfolio/README.md", "knowledge/simulation/setup-checklist.md"].includes(n.path));
  const blurb = { "HUB.md": "Master file. Routes for vault, study, CAD, OmniRoute, career.", "README.md": "Rules and folder layout of the vault.", "knowledge/roadmap/README.md": "Five-stage study plan for mechanical design.", "agent/INSTRUCTIONS.md": "How the AI companion works with the vault.", "career/portfolio/README.md": "Finished projects and portfolio plan.", "knowledge/simulation/setup-checklist.md": "Checks before trusting a simulation result." };
  $("#main").innerHTML = `<div class="home">
    <div class="titleblock sheet" style="margin-bottom:1.4rem"><div>Sheet 1 of 1 · Vault index</div><div>Rev ${esc(DATA.rev)}</div></div>
    <h1>Life<span>Vault</span></h1>
    <p class="lede">A plain-text memory for mechanical design and simulation studies. Every page here is rendered from a Markdown file in the repository.</p>
    <div class="stats">
      <div class="stat"><b>${NOTES.length}</b><span>Notes</span></div>
      <div class="stat"><b>${new Set(NOTES.map(n => folderOf(n.path))).size}</b><span>Folders</span></div>
      <div class="stat"><b>${Math.round(NOTES.reduce((a, n) => a + n.text.split(/\s+/).length, 0) / 100) / 10}k</b><span>Words</span></div>
      <div class="stat"><b>${tally.done}/${total}</b><span>Checklist items done</span></div>
    </div>
    <div class="h2">Study progress (all checklists)</div>
    <div class="progress" role="img" aria-label="${tally.done} done, ${tally.wip} in progress, ${tally.todo} not started"><i class="p-done" style="width:${tally.done / total * 100}%"></i><i class="p-wip" style="width:${tally.wip / total * 100}%"></i></div>
    <div class="legend"><span>${tally.done} done</span><span>${tally.wip} in progress</span><span>${tally.todo} not started</span></div>
    <div class="h2">Start here</div>
    <div class="routes">${routes.map(n => `<a class="card" href="#/${encodeURI(n.path)}"><b>${esc(n.title)}</b><span>${blurb[n.path] || ""}</span><small>${esc(n.path)}</small></a>`).join("")}</div>
    <div class="foot">Rebuild after editing notes: python3 site/build.py</div>
  </div>`;
  $("#toc").innerHTML = "";
}
function note(path) {
  const n = BY_PATH[path];
  const { html, heads } = render(n.text, n.path);
  const bl = [...(backlinks[path] || [])].map(p => `<a href="#/${encodeURI(p)}">${esc(BY_PATH[p].title)}</a>`).join("");
  const crumbs = n.path.split("/").join(" / ");
  $("#main").innerHTML = `<article class="sheet"><div class="titleblock"><div>${esc(crumbs)}</div><div>${n.text.split(/\s+/).length} words</div></div><div class="doc">${html}</div></article>${bl ? `<div class="backlinks">Linked from: ${bl}</div>` : ""}`;
  const items = heads.filter(h => h.n === 2 || h.n === 3);
  $("#toc").innerHTML = items.length ? `<h4>On this page</h4>` + items.map(h => `<a class="l${h.n}" href="#/${encodeURI(path)}" data-id="${h.id}">${esc(h.text)}</a>`).join("") : "";
}
function results(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = NOTES.map(n => {
    const t = n.title.toLowerCase(), p = n.path.toLowerCase(), x = n.text.toLowerCase();
    let score = 0;
    for (const w of terms) {
      const c = x.split(w).length - 1;
      if (!c && !t.includes(w) && !p.includes(w)) return null;
      score += (t.includes(w) ? 10 : 0) + (p.includes(w) ? 3 : 0) + Math.min(c, 10);
    }
    const at = x.indexOf(terms[0]);
    let snip = at < 0 ? n.text.slice(0, 140) : n.text.slice(Math.max(0, at - 60), at + 120);
    snip = esc(snip.replace(/\s+/g, " "));
    for (const w of terms) snip = snip.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
    return { n, score, snip };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  $("#main").innerHTML = `<div class="results"><div class="h2">${hits.length} result${hits.length === 1 ? "" : "s"} for "${esc(q)}"</div>${hits.map(h => `<a class="hit" href="#/${encodeURI(h.n.path)}"><b>${esc(h.n.title)}</b><small>${esc(h.n.path)}</small><p>${h.snip}</p></a>`).join("") || "<p>No notes match. Try fewer words.</p>"}</div>`;
  $("#toc").innerHTML = "";
}

/* ---------- Routing ---------- */
function route() {
  document.body.classList.remove("nav-open");
  const path = decodeURI(location.hash.replace(/^#\/?/, ""));
  if (path && BY_PATH[path]) { buildTree(path); note(path); document.title = BY_PATH[path].title + " · Life Vault"; }
  else { buildTree(""); home(); document.title = "Life Vault"; }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
$("#toc").addEventListener("click", e => {
  const a = e.target.closest("a[data-id]"); if (!a) return;
  e.preventDefault(); document.getElementById(a.dataset.id)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
$("#q").addEventListener("input", e => { const q = e.target.value.trim(); if (q) results(q); else route(); });
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape") { $("#q").value = ""; $("#q").blur(); route(); }
});
$("#menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
$("#theme-btn").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("vault-theme", next); } catch (e) {}
});
try { const t = localStorage.getItem("vault-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
route();
</script>
</body>
</html>
