<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Vault</title>
<style>
/* Plain layout: tree on the left, note in the middle, outline on the right. System fonts, no decoration. */
:root { --bg:#ffffff; --fg:#111111; --muted:#555555; --rule:#cccccc; --link:#0b3d91; --sel:#e8e8e8; --code:#f2f2f2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111111; --fg:#eeeeee; --muted:#aaaaaa; --rule:#444444; --link:#8ab4f8; --sel:#2a2a2a; --code:#1c1c1c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#111111; --fg:#eeeeee; --muted:#aaaaaa; --rule:#444444; --link:#8ab4f8; --sel:#2a2a2a; --code:#1c1c1c; color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-padding-top: 4rem; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem; padding: .5rem 1rem; background: var(--bg); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 700; color: var(--fg); text-decoration: none; white-space: nowrap; }
.search { flex: 1; max-width: 32rem; }
.search input { width: 100%; padding: .4rem .6rem; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); font: inherit; }
.icon-btn { border: 1px solid var(--rule); background: var(--bg); padding: .35rem .7rem; cursor: pointer; }
#menu-btn { display: none; }
.shell { display: grid; grid-template-columns: 16rem minmax(0, 1fr) 13rem; max-width: 88rem; margin: 0 auto; align-items: start; }
.rail { position: sticky; top: 3.1rem; height: calc(100vh - 3.1rem); overflow-y: auto; padding: 1rem; border-right: 1px solid var(--rule); background: var(--bg); }
.toc { position: sticky; top: 3.1rem; padding: 1rem; font-size: .9rem; max-height: calc(100vh - 3.1rem); overflow-y: auto; }
.toc h4 { margin: 0 0 .4rem; font-size: .9rem; }
.toc a { display: block; padding: .1rem 0; color: var(--link); }
.toc a.l3 { padding-left: 1rem; }
main { min-width: 0; padding: 1.2rem clamp(1rem, 3vw, 2.5rem) 4rem; }
.tree-h { font-weight: 700; margin: 1rem 0 .2rem; }
.tree a { display: block; padding: .15rem .4rem; color: var(--fg); text-decoration: none; font-size: .92rem; line-height: 1.35; }
.tree a:hover { text-decoration: underline; }
.tree a[aria-current="page"] { background: var(--sel); font-weight: 600; }
.tree a small { display: block; color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
.crumbs { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; overflow-wrap: anywhere; }
.doc { max-width: 46rem; overflow-wrap: break-word; }
.doc h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 1rem; }
.doc h2 { font-size: 1.35rem; margin: 2rem 0 .5rem; }
.doc h3 { font-size: 1.1rem; margin: 1.5rem 0 .4rem; }
.doc h4 { font-size: 1rem; margin: 1.2rem 0 .3rem; }
.doc li.task { list-style: none; margin-left: -1.4rem; }
.doc code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; background: var(--code); padding: .1em .3em; }
.doc pre { background: var(--code); padding: .8rem 1rem; overflow-x: auto; }
.doc pre code { background: none; padding: 0; }
.doc blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--rule); color: var(--muted); }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 1.5rem 0; }
.tbl { overflow-x: auto; margin: 1rem 0; }
.tbl table { border-collapse: collapse; }
.tbl th, .tbl td { padding: .4rem .7rem; text-align: left; border: 1px solid var(--rule); vertical-align: top; }
.chip { font-family: ui-monospace, Consolas, monospace; margin-right: .4rem; }
.backlinks { max-width: 46rem; margin-top: 2rem; font-size: .9rem; color: var(--muted); }
.backlinks a { margin-right: 1rem; }
.home { max-width: 46rem; }
.home h1 { font-size: 1.8rem; margin: 0 0 .5rem; }
.stats { padding-left: 1.2rem; }
.hit { display: block; padding: .6rem 0; border-bottom: 1px solid var(--rule); color: var(--fg); text-decoration: none; }
.hit b { color: var(--link); text-decoration: underline; }
.hit small { display: block; color: var(--muted); }
.hit p { margin: .2rem 0 0; font-size: .92rem; color: var(--muted); }
.results { max-width: 46rem; }
mark { background: #ffe58a; color: #111; }
.tool-form { display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; margin: .8rem 0; align-items: end; }
.tool-field { display: flex; flex-direction: column; gap: .2rem; font-size: .9rem; min-width: 0; }
.tool-field input, .tool-field select { padding: .35rem .5rem; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); font: inherit; max-width: 100%; }
.tool-field input[type="checkbox"] { width: auto; }
.tool-out canvas { display: block; margin: .6rem 0; }
.foot { margin-top: 2rem; color: var(--muted); font-size: .85rem; }
@media (max-width: 70rem) { .shell { grid-template-columns: 15rem minmax(0, 1fr); } .toc { display: none; } }
@media (max-width: 48rem) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #menu-btn { display: block; }
  .rail { position: fixed; z-index: 30; top: 3.1rem; left: 0; bottom: 0; width: min(20rem, 88vw); height: auto; translate: -100% 0; }
  body.nav-open .rail { translate: 0 0; }
}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="menu-btn" aria-label="Toggle navigation">Menu</button>
  <a class="brand" href="#/">Life Vault</a>
  <div class="search">
    <input id="q" type="search" placeholder="Search every note" autocomplete="off" aria-label="Search every note">
  </div>
  <button class="icon-btn" id="theme-btn">Theme</button>
</header>
<div class="shell">
  <nav class="rail tree" id="tree" aria-label="Vault notes"></nav>
  <main id="main"></main>
  <aside class="toc" id="toc" aria-label="On this page"></aside>
</div>

<script>
/* Engineering tools for the vault viewer. No dependencies. Plain styling.
   Every formula is shown on its page. Input values are examples: replace them with your own,
   and take material values from a datasheet (the vault rule is never to guess numbers). */

/* ---------- Pure maths (tested in Node, see site/test-tools.js) ---------- */
const MATH = {
  beam(kind, L, load, a, EI) {
    // L in m, load in N (point) or N/m (UDL), a in m, EI in N.m^2. Returns reactions, Mmax, deflection and V/M functions.
    let V, M, defl, R = {}, Mmax;
    if (kind === "ss-point") {
      const b = L - a, RA = load * b / L, RB = load * a / L;
      V = x => (x < a ? RA : RA - load);
      M = x => (x < a ? RA * x : RA * x - load * (x - a));
      const s = Math.min(a, b); // shorter distance; maximum deflection lies in the longer segment
      defl = load * s * Math.pow(L * L - s * s, 1.5) / (9 * Math.sqrt(3) * EI * L);
      R = { RA, RB }; Mmax = load * a * b / L;
    } else if (kind === "ss-udl") {
      const RA = load * L / 2;
      V = x => RA - load * x; M = x => RA * x - load * x * x / 2;
      defl = 5 * load * Math.pow(L, 4) / (384 * EI); R = { RA, RB: RA }; Mmax = load * L * L / 8;
    } else if (kind === "cant-point") {
      V = () => load; M = x => -load * (L - x);
      defl = load * Math.pow(L, 3) / (3 * EI); R = { RA: load, MA: load * L }; Mmax = load * L;
    } else {
      V = x => load * (L - x); M = x => -load * (L - x) * (L - x) / 2;
      defl = load * Math.pow(L, 4) / (8 * EI); R = { RA: load * L, MA: load * L * L / 2 }; Mmax = load * L * L / 2;
    }
    return { V, M, defl, R, Mmax };
  },
  mohr(sx, sy, txy) {
    const c = (sx + sy) / 2, R = Math.hypot((sx - sy) / 2, txy);
    const s1 = c + R, s2 = c - R;
    const th = 0.5 * Math.atan2(2 * txy, sx - sy); // principal angle from x axis, rad
    const vm = Math.sqrt(s1 * s1 - s1 * s2 + s2 * s2); // plane stress von Mises
    return { c, R, s1, s2, th, tmax: R, vm };
  },
  euler(E, I, L, K) { return Math.PI * Math.PI * E * I / Math.pow(K * L, 2); },
  spring(G, d, D, N, F) {
    const k = G * Math.pow(d, 4) / (8 * Math.pow(D, 3) * N), C = D / d;
    const Kw = (4 * C - 1) / (4 * C - 4) + 0.615 / C;
    return { k, C, Kw, tau: Kw * 8 * F * D / (Math.PI * Math.pow(d, 3)), defl: F / k };
  },
  section(type, p) {
    let A, I, c;
    if (type === "rect") { A = p.b * p.h; I = p.b * Math.pow(p.h, 3) / 12; c = p.h / 2; }
    else if (type === "circle") { A = Math.PI * p.d * p.d / 4; I = Math.PI * Math.pow(p.d, 4) / 64; c = p.d / 2; }
    else if (type === "tube") { A = Math.PI * (p.d * p.d - p.di * p.di) / 4; I = Math.PI * (Math.pow(p.d, 4) - Math.pow(p.di, 4)) / 64; c = p.d / 2; }
    else if (type === "hrect") { A = p.b * p.h - p.bi * p.hi; I = (p.b * Math.pow(p.h, 3) - p.bi * Math.pow(p.hi, 3)) / 12; c = p.h / 2; }
    else { A = 2 * p.b * p.tf + (p.h - 2 * p.tf) * p.tw; I = (p.b * Math.pow(p.h, 3) - (p.b - p.tw) * Math.pow(p.h - 2 * p.tf, 3)) / 12; c = p.h / 2; }
    return { A, I, c, S: I / c, r: Math.sqrt(I / A) };
  },
  gear(N1, N2, m, n1, T1, eta) {
    const ratio = N2 / N1;
    return { ratio, n2: n1 / ratio, T2: T1 * ratio * eta, center: m * (N1 + N2) / 2, d1: m * N1, d2: m * N2 };
  }
};

/* Exact conversion factors to SI base. */
const UNITS = {
  Length: { base: "m", u: { m: 1, mm: 0.001, cm: 0.01, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 } },
  Force: { base: "N", u: { N: 1, kN: 1000, MN: 1e6, lbf: 4.4482216152605, kgf: 9.80665, kip: 4448.2216152605 } },
  "Pressure and stress": { base: "Pa", u: { Pa: 1, kPa: 1e3, MPa: 1e6, GPa: 1e9, bar: 1e5, atm: 101325, psi: 6894.757293168, ksi: 6894757.293168 } },
  Torque: { base: "N.m", u: { "N.m": 1, "N.mm": 0.001, "kN.m": 1000, "lbf.ft": 1.3558179483314004, "lbf.in": 0.1129848290276167, "kgf.m": 9.80665 } },
  Mass: { base: "kg", u: { kg: 1, g: 0.001, t: 1000, lb: 0.45359237, oz: 0.028349523125 } },
  Area: { base: "m2", u: { "m2": 1, "mm2": 1e-6, "cm2": 1e-4, "in2": 0.00064516, "ft2": 0.09290304 } },
  Energy: { base: "J", u: { J: 1, kJ: 1000, "N.m": 1, Wh: 3600, kWh: 3.6e6, "ft.lbf": 1.3558179483314004, BTU: 1055.05585262 } },
  Power: { base: "W", u: { W: 1, kW: 1000, hp: 745.6998715822702, "ft.lbf/s": 1.3558179483314004 } },
  "Speed": { base: "rad/s", u: { "rad/s": 1, rpm: Math.PI / 30, "Hz": 2 * Math.PI } }
};

/* ---------- Small UI helpers ---------- */
const $t = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); e.innerHTML = html; return e; };
const fmt = (v, d = 4) => (typeof v !== "number" ? v : !isFinite(v) ? "n/a" : Math.abs(v) >= 1e6 || (Math.abs(v) < 1e-3 && v !== 0) ? v.toExponential(3) : String(+v.toPrecision(d)));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function form(root, fields, compute, outputs) {
  const box = $t("div", { class: "tool-form" });
  const inputs = {};
  for (const f of fields) {
    const row = $t("label", { class: "tool-field" });
    row.append(document.createTextNode(f.label + (f.unit ? " (" + f.unit + ")" : "") + " "));
    let el;
    if (f.options) { el = $t("select"); el.innerHTML = f.options.map(o => `<option value="${o[0]}">${o[1]}</option>`).join(""); el.value = f.value; }
    else { el = $t("input", { type: "number", step: "any", value: f.value }); }
    el.id = "f-" + f.id; inputs[f.id] = el; row.append(el); box.append(row);
  }
  const out = $t("div", { class: "tool-out", "aria-live": "polite" });
  root.append(box, out);
  const run = () => {
    const v = {}; for (const f of fields) v[f.id] = f.options ? inputs[f.id].value : parseFloat(inputs[f.id].value);
    let res; try { res = compute(v); } catch (e) { res = null; }
    if (!res) { out.innerHTML = "<p>Enter valid numbers.</p>"; return; }
    out.innerHTML = '<div class="tbl"><table><thead><tr><th>Result</th><th>Value</th><th>Unit</th></tr></thead><tbody>' +
      res.rows.map(r => `<tr><td>${r[0]}</td><td>${fmt(r[1])}</td><td>${r[2] || ""}</td></tr>`).join("") + "</tbody></table></div>";
    if (res.draw) res.draw(out);
  };
  box.addEventListener("input", run); run();
}
function canvasPlot(parent, w, h) { const c = $t("canvas", { width: w, height: h }); c.style.maxWidth = "100%"; c.style.height = "auto"; c.style.border = "1px solid " + css("--rule"); parent.append(c); return c.getContext("2d"); }
function chart(ctx, W, H, xs, ys, title) {
  const fg = css("--fg"), mu = css("--muted");
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, W, H);
  const pad = 36, lo = Math.min(0, ...ys), hi = Math.max(0, ...ys), span = (hi - lo) || 1;
  const X = x => pad + (x - xs[0]) / (xs[xs.length - 1] - xs[0]) * (W - 2 * pad), Y = y => H - pad - (y - lo) / span * (H - 2 * pad);
  ctx.strokeStyle = mu; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad, Y(0)); ctx.lineTo(W - pad, Y(0)); ctx.stroke();
  ctx.strokeStyle = fg; ctx.lineWidth = 2; ctx.beginPath(); xs.forEach((x, i) => i ? ctx.lineTo(X(x), Y(ys[i])) : ctx.moveTo(X(x), Y(ys[i]))); ctx.stroke();
  ctx.fillStyle = fg; ctx.font = "13px system-ui"; ctx.fillText(title, pad, 16);
  ctx.fillStyle = mu; ctx.fillText(fmt(hi, 3), 2, Y(hi) + 4); ctx.fillText(fmt(lo, 3), 2, Y(lo) + 4);
}

/* ---------- Tools ---------- */
const TOOLS = {};

TOOLS.beam = {
  title: "Beam: reactions, shear, moment, deflection",
  render(root) {
    root.append($t("p", {}, "Statically determinate beams. Matches the worked example in the statics lesson: 4 m beam, 10 kN load 1 m from A gives Ay = 7.5 kN and By = 2.5 kN. Get I from the Section tool (convert to cm<sup>4</sup>). Check any result against a hand calculation before using it."));
    form(root, [
      { id: "kind", label: "Case", value: "ss-point", options: [["ss-point", "Simply supported, point load"], ["ss-udl", "Simply supported, uniform load"], ["cant-point", "Cantilever, end point load"], ["cant-udl", "Cantilever, uniform load"]] },
      { id: "L", label: "Length L", unit: "m", value: 4 },
      { id: "P", label: "Load: point P (kN) or uniform w (kN/m)", value: 10 },
      { id: "a", label: "Point load distance a from A (point case only)", unit: "m", value: 1 },
      { id: "E", label: "Elastic modulus E (example value, use your datasheet)", unit: "GPa", value: 200 },
      { id: "I", label: "Second moment of area I", unit: "cm4", value: 8000 }
    ], v => {
      if (!(v.L > 0) || !(v.E > 0) || !(v.I > 0)) return null;
      const point = v.kind.endsWith("point"), a = point && v.kind === "ss-point" ? v.a : v.L;
      if (v.kind === "ss-point" && !(a > 0 && a < v.L)) return null;
      const EI = v.E * v.I * 10, load = v.P * 1000, r = MATH.beam(v.kind, v.L, load, a, EI);
      const rows = [["Reaction at A (vertical)", r.R.RA / 1000, "kN"]];
      if (r.R.RB !== undefined) rows.push(["Reaction at B (vertical)", r.R.RB / 1000, "kN"]);
      if (r.R.MA !== undefined) rows.push(["Fixed-end moment", r.R.MA / 1000, "kN.m"]);
      rows.push(["Maximum bending moment", r.Mmax / 1000, "kN.m"], ["Maximum deflection", r.defl * 1000, "mm"]);
      rows.push(["Formula", "", { "ss-point": "d = P s (L^2 - s^2)^1.5 / (9 sqrt(3) E I L), s = shorter distance", "ss-udl": "d = 5 w L^4 / (384 E I)", "cant-point": "d = P L^3 / (3 E I)", "cant-udl": "d = w L^4 / (8 E I)" }[v.kind]]);
      return { rows, draw(out) {
        const xs = Array.from({ length: 241 }, (_, i) => v.L * i / 240);
        const W = 640, H = 170, c1 = canvasPlot(out, W, H), c2 = canvasPlot(out, W, H);
        chart(c1, W, H, xs, xs.map(x => r.V(x) / 1000), "Shear force V (kN)");
        chart(c2, W, H, xs, xs.map(x => r.M(x) / 1000), "Bending moment M (kN.m)");
      } };
    });
  }
};

TOOLS.section = {
  title: "Section properties",
  render(root) {
    root.append($t("p", {}, "Area, second moment of area about the horizontal centroidal axis, section modulus S = I / c, radius of gyration r = sqrt(I / A). Dimensions in mm."));
    const sel = $t("select", { id: "sec-type" }, `<option value="rect">Solid rectangle</option><option value="circle">Solid circle</option><option value="tube">Hollow circle (tube)</option><option value="hrect">Hollow rectangle</option><option value="ibeam">I-section (symmetric)</option>`);
    const holder = $t("div"), shapeLab = $t("label", { class: "tool-field" }, "Shape ");
    shapeLab.append(sel); root.append(shapeLab, holder);
    const defs = { rect: [["b", "Width b", 50], ["h", "Height h", 100]], circle: [["d", "Diameter d", 50]], tube: [["d", "Outer diameter", 60], ["di", "Inner diameter", 50]], hrect: [["b", "Outer width B", 60], ["h", "Outer height H", 100], ["bi", "Inner width b", 50], ["hi", "Inner height h", 90]], ibeam: [["h", "Total height h", 200], ["b", "Flange width b", 100], ["tf", "Flange thickness tf", 10], ["tw", "Web thickness tw", 6]] };
    const build = () => { holder.innerHTML = ""; const t = sel.value;
      form(holder, defs[t].map(d => ({ id: d[0], label: d[1], unit: "mm", value: d[2] })), v => {
        for (const k in v) if (!(v[k] > 0)) return null;
        if ((t === "tube" && v.di >= v.d) || (t === "hrect" && (v.bi >= v.b || v.hi >= v.h)) || (t === "ibeam" && (2 * v.tf >= v.h || v.tw >= v.b))) return null;
        const r = MATH.section(t, v);
        return { rows: [["Area A", r.A, "mm2"], ["Second moment I", r.I, "mm4"], ["Second moment I", r.I / 1e4, "cm4"], ["Distance to extreme fibre c", r.c, "mm"], ["Section modulus S = I/c", r.S, "mm3"], ["Radius of gyration r", r.r, "mm"]] };
      }); };
    sel.addEventListener("change", build); build();
  }
};

TOOLS.mohr = {
  title: "Stress transformation and Mohr's circle",
  render(root) {
    root.append($t("p", {}, "Plane stress. Tension positive. The plot shows the circle with tau plotted upward for positive tau on the x face. Principal angle is measured from the x axis: tan(2 theta) = 2 tau / (sx - sy). Von Mises (plane stress) = sqrt(s1^2 - s1 s2 + s2^2). Compare with yield strength from your material datasheet."));
    form(root, [
      { id: "sx", label: "Normal stress sx", unit: "MPa", value: 80 },
      { id: "sy", label: "Normal stress sy", unit: "MPa", value: -20 },
      { id: "t", label: "Shear stress txy", unit: "MPa", value: 30 },
      { id: "Sy", label: "Yield strength (optional, for factor of safety)", unit: "MPa", value: 250 }
    ], v => {
      const m = MATH.mohr(v.sx, v.sy, v.t);
      const rows = [["Centre of circle", m.c, "MPa"], ["Radius = max in-plane shear", m.R, "MPa"], ["Principal stress s1", m.s1, "MPa"], ["Principal stress s2", m.s2, "MPa"], ["Principal angle", m.th * 180 / Math.PI, "deg"], ["Von Mises stress", m.vm, "MPa"]];
      if (v.Sy > 0) rows.push(["Factor of safety (von Mises, yield)", v.Sy / m.vm, ""]);
      return { rows, draw(out) {
        const W = 420, H = 300, ctx = canvasPlot(out, W, H), fg = css("--fg"), mu = css("--muted");
        ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, W, H);
        const sc = Math.min(W / 2 - 50, H / 2 - 30) / (m.R || 1) * 0.9, ox = W / 2 - m.c * sc, oy = H / 2;
        const X = s => ox + s * sc, Y = t => oy - t * sc;
        ctx.strokeStyle = mu; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(10, oy); ctx.lineTo(W - 10, oy); ctx.moveTo(X(0), 10); ctx.lineTo(X(0), H - 10); ctx.stroke();
        ctx.strokeStyle = fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(m.c), oy, m.R * sc, 0, 2 * Math.PI); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(X(v.sx), Y(v.t)); ctx.lineTo(X(v.sy), Y(-v.t)); ctx.stroke();
        ctx.fillStyle = fg; ctx.font = "12px system-ui";
        for (const [lab, s, t] of [["x", v.sx, v.t], ["y", v.sy, -v.t], ["s1", m.s1, 0], ["s2", m.s2, 0]]) { ctx.beginPath(); ctx.arc(X(s), Y(t), 3.5, 0, 7); ctx.fill(); ctx.fillText(lab, X(s) + 6, Y(t) - 6); }
        ctx.fillStyle = mu; ctx.fillText("sigma", W - 46, oy - 6); ctx.fillText("tau", X(0) + 6, 20);
      } };
    });
  }
};

TOOLS.buckling = {
  title: "Euler column buckling",

/* ---------- 3D shapes ---------- */
const GEO = (() => {
  const P = Math.PI, T = [];
  const tri = (a, b, c) => T.push([a, b, c]);
  const quad = (a, b, c, d) => { tri(a, b, c); tri(a, c, d); };
  const area2 = p => p.reduce((s, q, i) => { const r = p[(i + 1) % p.length]; return s + q[0] * r[1] - r[0] * q[1]; }, 0);
  function ears(poly) { // ear clipping for a simple counter-clockwise polygon; returns index triples
    const idx = poly.map((_, i) => i), out = []; let guard = 0;
    const cross = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const inside = (p, a, b, c) => cross(a, b, p) >= 0 && cross(b, c, p) >= 0 && cross(c, a, p) >= 0;
    while (idx.length > 3 && guard++ < 5000) {
      let cut = false;
      for (let i = 0; i < idx.length; i++) {
        const i0 = idx[(i + idx.length - 1) % idx.length], i1 = idx[i], i2 = idx[(i + 1) % idx.length];
        const a = poly[i0], b = poly[i1], c = poly[i2];
        if (cross(a, b, c) <= 1e-12) continue;
        if (idx.some(j => j !== i0 && j !== i1 && j !== i2 && inside(poly[j], a, b, c))) continue;
        out.push([i0, i1, i2]); idx.splice(i, 1); cut = true; break;
      }
      if (!cut) break;
    }
    if (idx.length === 3) out.push([idx[0], idx[1], idx[2]]);
    return out;
  }
  function extrude(poly, depth) { // along z, centred
    if (area2(poly) < 0) poly = poly.slice().reverse();
    const z0 = -depth / 2, z1 = depth / 2, n = poly.length;
    for (let i = 0; i < n; i++) { const a = poly[i], b = poly[(i + 1) % n]; quad([a[0], a[1], z0], [b[0], b[1], z0], [b[0], b[1], z1], [a[0], a[1], z1]); }
    for (const [i, j, k] of ears(poly)) { tri([...poly[i], z1], [...poly[j], z1], [...poly[k], z1]); tri([...poly[i], z0], [...poly[k], z0], [...poly[j], z0]); }
    return Math.abs(area2(poly)) / 2 * depth;
  }
  const ring = (r, n, y) => Array.from({ length: n }, (_, i) => [r * Math.cos(2 * P * i / n), y, r * Math.sin(2 * P * i / n)]);
  function lathe(profile, n) { // profile: [[r,y],...] open polyline revolved about y
    for (let k = 0; k < profile.length - 1; k++) { const A = ring(profile[k][0], n, profile[k][1]), B = ring(profile[k + 1][0], n, profile[k + 1][1]);
      for (let i = 0; i < n; i++) { const j = (i + 1) % n; quad(A[i], A[j], B[j], B[i]); } }
  }
  return {
    box(p) { const [w, h, d] = [p.w / 2, p.h / 2, p.d / 2]; const s = [[-w, -h, -d], [w, -h, -d], [w, h, -d], [-w, h, -d], [-w, -h, d], [w, -h, d], [w, h, d], [-w, h, d]];
      for (const f of [[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [3, 2, 6, 7], [0, 3, 7, 4], [1, 2, 6, 5]]) quad(...f.map(i => s[i])); return p.w * p.h * p.d; },
    cylinder(p) { lathe([[0, -p.h / 2], [p.r, -p.h / 2], [p.r, p.h / 2], [0, p.h / 2]], 56); return P * p.r * p.r * p.h; },
    tube(p) { lathe([[p.ri, -p.h / 2], [p.ro, -p.h / 2], [p.ro, p.h / 2], [p.ri, p.h / 2], [p.ri, -p.h / 2]], 56); return P * (p.ro * p.ro - p.ri * p.ri) * p.h; },
    cone(p) { lathe([[0, -p.h / 2], [p.r, -p.h / 2], [0, p.h / 2]], 56); return P * p.r * p.r * p.h / 3; },
    sphere(p) { const pr = Array.from({ length: 25 }, (_, i) => { const a = -P / 2 + P * i / 24; return [p.r * Math.cos(a), p.r * Math.sin(a)]; }); lathe(pr, 48); return 4 / 3 * P * Math.pow(p.r, 3); },
    torus(p) { const M = 40, N = 20; const pt = (i, j) => { const u = 2 * P * i / M, v = 2 * P * j / N; return [(p.R + p.r * Math.cos(v)) * Math.cos(u), p.r * Math.sin(v), (p.R + p.r * Math.cos(v)) * Math.sin(u)]; };
      for (let i = 0; i < M; i++) for (let j = 0; j < N; j++) quad(pt(i, j), pt(i + 1, j), pt(i + 1, j + 1), pt(i, j + 1)); return 2 * P * P * p.R * p.r * p.r; },
    ibeam(p) { const h = p.h / 2, b = p.b / 2, w = p.tw / 2, f = p.h / 2 - p.tf; return extrude([[-b, -h], [b, -h], [b, -f], [w, -f], [w, f], [b, f], [b, h], [-b, h], [-b, f], [-w, f], [-w, -f], [-b, -f]], p.L); },
    lbracket(p) { return extrude([[0, 0], [p.a, 0], [p.a, p.t], [p.t, p.t], [p.t, p.b], [0, p.b]].map(q => [q[0] - p.a / 2, q[1] - p.b / 2]), p.L); },
    gear(p) { const r = p.m * p.N / 2, ro = r + p.m, rr = r - 1.25 * p.m, pts = [], pitch = 2 * P / p.N;
      for (let i = 0; i < p.N; i++) { const a = i * pitch; for (const [da, rad] of [[0.00, rr], [0.18, rr], [0.30, ro], [0.52, ro], [0.64, rr]]) pts.push([rad * Math.cos(a + da * pitch), rad * Math.sin(a + da * pitch)]); }
      return extrude(pts, p.t); },
    spring(p) { const seg = 24, steps = Math.round(p.N * seg), rr = p.d / 2, ring6 = 10; const centre = i => { const a = 2 * P * i / seg; return [p.D / 2 * Math.cos(a), p.pitch * i / seg - p.pitch * p.N / 2, p.D / 2 * Math.sin(a)]; };
      const sect = i => { const c = centre(i), a = 2 * P * i / seg, rad = [Math.cos(a), 0, Math.sin(a)]; return Array.from({ length: ring6 }, (_, k) => { const t = 2 * P * k / ring6; return [c[0] + rr * (Math.cos(t) * rad[0]), c[1] + rr * Math.sin(t), c[2] + rr * (Math.cos(t) * rad[2])]; }); };
      let prev = sect(0); for (let i = 1; i <= steps; i++) { const cur = sect(i); for (let k = 0; k < ring6; k++) quad(prev[k], prev[(k + 1) % ring6], cur[(k + 1) % ring6], cur[k]); prev = cur; }
      const turn = Math.sqrt(Math.pow(P * p.D, 2) + p.pitch * p.pitch); return P * rr * rr * turn * p.N; },
    bolt(p) { const hex = Array.from({ length: 6 }, (_, i) => [p.s / Math.sqrt(3) * Math.cos(P / 3 * i), p.s / Math.sqrt(3) * Math.sin(P / 3 * i)]);
      const before = T.length; extrude(hex, p.k); const head = T.splice(before); for (const t of head) T.push(t.map(q => [q[0], q[2] + p.k / 2, q[1]]));
      lathe([[0, 0], [p.d / 2, 0], [p.d / 2, -p.L], [0, -p.L]], 40);
      return 3 * Math.sqrt(3) / 2 * Math.pow(p.s / Math.sqrt(3), 2) * p.k + P * p.d * p.d / 4 * p.L; },
    poly(p) { return extrude(p.pts, p.depth); },
    take() { const out = T.splice(0); return out; }
  };
})();

  gear: { name: "Spur gear", f: "gear", p: [["N", "Teeth", 18], ["m", "Module", 3], ["t", "Face width", 12]], info: "Pitch diameter = m N, outside diameter = m (N + 2). Simplified trapezoid teeth, not an involute profile. Volume is of the toothed outline." },
  spring: { name: "Compression spring", f: "spring", p: [["d", "Wire diameter", 3], ["D", "Mean coil diameter", 24], ["N", "Coils", 6], ["pitch", "Pitch", 9]], info: "V = wire area x wire length (approximate)" },
  bolt: { name: "Hex bolt", f: "bolt", p: [["d", "Shank diameter", 10], ["L", "Shank length", 40], ["s", "Width across flats", 17], ["k", "Head height", 6.4]], info: "Head plus shank. Look up thread and head dimensions in the standard (for example ISO 4014) before drawing." }

TOOLS.shapes = {
  title: "3D shapes",
  render(root) {
    root.append($t("p", {}, "Parametric solids. Drag to rotate, scroll or use the zoom buttons to zoom, tick Wireframe for edges. Dimensions in mm. Volume is computed from the dimensions; enter a density from your material datasheet to get mass."));
    const bar = $t("div", { class: "tool-form" });
    const sel = $t("select", { id: "shape-sel" }, Object.keys(SHAPES).map(k => `<option value="${k}">${SHAPES[k].name}</option>`).join(""));
    const lab = $t("label", { class: "tool-field" }, "Shape "); lab.append(sel); bar.append(lab);
    const wf = $t("input", { type: "checkbox", id: "shape-wf" }), wl = $t("label", { class: "tool-field" }); wl.append(wf, document.createTextNode(" Wireframe")); bar.append(wl);
    const zi = $t("button", { type: "button", class: "icon-btn" }, "Zoom in"), zo = $t("button", { type: "button", class: "icon-btn" }, "Zoom out"), rs = $t("button", { type: "button", class: "icon-btn" }, "Reset view");
    bar.append(zi, zo, rs); root.append(bar);
    const cv = $t("canvas", { width: 720, height: 460, "aria-label": "3D view of the selected shape" }); cv.style.cssText = "max-width:100%;height:auto;border:1px solid var(--rule);touch-action:none;cursor:grab;display:block;margin:.8rem 0";
    root.append(cv);
    const params = $t("div", { class: "tool-form" }), out = $t("div", { class: "tool-out" }); root.append(params, out);
    const ctx = cv.getContext("2d"); let tris = [], ry = 0.7, rx = -0.5, zoom = 1, vol = 0, ext = 1, S, vals = {}, den = 7850;
    const rebuild = () => {
      for (const k in vals) vals[k] = parseFloat(document.getElementById("p-" + k).value);
      const bad = Object.values(vals).some(x => !(x > 0)) || (S.f === "tube" && vals.ri >= vals.ro) || (S.f === "ibeam" && (2 * vals.tf >= vals.h || vals.tw >= vals.b)) || (S.f === "gear" && vals.N < 6) || (S.f === "bolt" && vals.s < vals.d);
      if (bad) { out.innerHTML = "<p>Enter valid dimensions (all positive, inner smaller than outer, at least 6 teeth).</p>"; return; }
      GEO.take(); vol = GEO[S.f](vals); tris = GEO.take();
      let m = 0; for (const t of tris) for (const q of t) m = Math.max(m, Math.abs(q[0]), Math.abs(q[1]), Math.abs(q[2])); ext = m || 1;
      const d = parseFloat(document.getElementById("p-density")?.value) || 0;
      out.innerHTML = `<div class="tbl"><table><thead><tr><th>Result</th><th>Value</th><th>Unit</th></tr></thead><tbody><tr><td>Volume</td><td>${fmt(vol)}</td><td>mm3</td></tr><tr><td>Volume</td><td>${fmt(vol / 1000)}</td><td>cm3</td></tr><tr><td>Mass at density above</td><td>${fmt(vol * 1e-9 * d)}</td><td>kg</td></tr></tbody></table></div><p>${S.info}</p>`;
      draw();
    };
    const setup = () => {
      S = SHAPES[sel.value]; vals = {}; params.innerHTML = "";
      for (const [k, l, v] of S.p) { vals[k] = v; const r = $t("label", { class: "tool-field" }, l + " (" + (k === "N" && S.f === "gear" || (k === "N" && S.f === "spring") ? "count" : "mm") + ") "); r.append($t("input", { type: "number", step: "any", id: "p-" + k, value: v })); params.append(r); }
      const dr = $t("label", { class: "tool-field" }, "Density for mass (kg/m3, example value, use your datasheet) "); dr.append($t("input", { type: "number", step: "any", id: "p-density", value: den })); params.append(dr);
      rebuild();
    };
    function draw() {
      const W = cv.width, H = cv.height, sc = Math.min(W, H) / (2.6 * ext) * zoom, cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx), cam = 5 * ext;
      const proj = q => { let x = q[0] * cy + q[2] * sy, z = -q[0] * sy + q[2] * cy, y = q[1] * cx - z * sx; z = q[1] * sx + z * cx; const k = cam / (cam + z); return [W / 2 + x * sc * k, H / 2 - y * sc * k, z]; };
      const L = [0.35, 0.65, 0.55], ln = Math.hypot(...L), light = L.map(x => x / ln);
      const rot = q => { let x = q[0] * cy + q[2] * sy, z = -q[0] * sy + q[2] * cy, y = q[1] * cx - z * sx; z = q[1] * sx + z * cx; return [x, y, z]; };
      const list = tris.map(t => { const a = rot(t[0]), b = rot(t[1]), c = rot(t[2]); const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
        let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]; const nl = Math.hypot(...n) || 1; n = n.map(x => x / nl);
        return { p: [proj(t[0]), proj(t[1]), proj(t[2])], z: (a[2] + b[2] + c[2]) / 3, s: Math.abs(n[0] * light[0] + n[1] * light[1] + n[2] * light[2]) }; }).sort((a, b) => b.z - a.z);

      ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, W, H);
      const wire = wf.checked;
      for (const t of list) {
        const g = Math.round((dark ? 60 : 90) + t.s * (dark ? 150 : 140)), col = `rgb(${g},${g},${g})`;
        ctx.beginPath(); ctx.moveTo(t.p[0][0], t.p[0][1]); ctx.lineTo(t.p[1][0], t.p[1][1]); ctx.lineTo(t.p[2][0], t.p[2][1]); ctx.closePath();
        if (!wire) { ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 0.6; ctx.stroke(); }
        else { ctx.strokeStyle = css("--fg"); ctx.lineWidth = 0.5; ctx.stroke(); }
      }
    }
    let drag = null;
    cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
    cv.addEventListener("pointermove", e => { if (!drag) return; ry += (e.clientX - drag[0]) * 0.01; rx = Math.max(-1.5, Math.min(1.5, rx + (e.clientY - drag[1]) * 0.01)); drag = [e.clientX, e.clientY]; draw(); });
    cv.addEventListener("pointerup", () => { drag = null; cv.style.cursor = "grab"; });
    cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.3, Math.min(4, zoom * (e.deltaY < 0 ? 1.1 : 0.9))); draw(); }, { passive: false });
    zi.onclick = () => { zoom = Math.min(4, zoom * 1.2); draw(); }; zo.onclick = () => { zoom = Math.max(0.3, zoom / 1.2); draw(); }; rs.onclick = () => { ry = 0.7; rx = -0.5; zoom = 1; draw(); };
    wf.addEventListener("change", draw); sel.addEventListener("change", setup);
    params.addEventListener("input", e => { if (e.target.id === "p-density") den = parseFloat(e.target.value) || 0; rebuild(); });
    setup();
  }
};

    root.append(dims);
    const bar = $t("div", { class: "tool-form" });
    const ex = $t("input", { type: "range", min: 0, max: 100, value: 0, id: "car-explode" }), exl = $t("label", { class: "tool-field" }, "Exploded view "); exl.append(ex);
    const wf = $t("input", { type: "checkbox", id: "car-wf" }), wl = $t("label", { class: "tool-field" }); wl.append(wf, document.createTextNode(" Wireframe"));

      add("Brake disc, " + w, "Brakes", cyl(rim * 0.9, 32), { at: [xp, R, s * (tz - tw * 0.3)], orient: "z", dir: [0, 0, s * 1.2], tone: 0.0 });
      add("Brake caliper, " + w, "Brakes", bx(rim * 0.5, rim * 0.5, 70), { at: [xp, R + rim * 0.75, s * (tz - tw * 0.3)], dir: [0, 0.6, s * 1.0], tone: 0.3 });

const DATA = {"notes": [{"path": "HUB.md", "title": "HUB: everything in one place", "text": "# HUB: everything in one place\n\nMaster file for the Life Vault. Each section is a \"route\": copy only the section you need into a new chat, or tell the assistant to read this file and work on one route.\n\nLast updated: 2026-10-06\nRepo: Ichiro04/Ichiro04 (branch claude/capabilities-overview-83xgc2)\n\n## Routes (pick one per chat)\n| Route | Use it for | Starter message |\n|---|---|---|\n| A. Vault and companion | Notes, memory, organising the vault | \"Read HUB.md route A, then help me with the vault.\" |\n| B. Study | Roadmap lessons and self-tests | \"Read HUB.md route B and knowledge/roadmap/README.md, then continue my lesson.\" |\n| C. CAD and simulation | SolidWorks, AutoCAD, FEA/CFD work | \"Read HUB.md route C, then help me with CAD or simulation.\" |\n| D. OmniRoute | The AI gateway on my PC | \"Read HUB.md route D, then help me with OmniRoute.\" |\n| E. Career and portfolio | Goals, projects, portfolio | \"Read HUB.md route E, then help me with my portfolio.\" |\n\nFor any chat, first say: \"Also read README.md and agent/INSTRUCTIONS.md.\"\n\n---\n\n## About me (shared by every route)\n- Mechanical engineering, 4th year (graduated, bachelor's degree).\n- Focus: mechanical design and simulations.\n- Goal: be a well-known mechanical engineer.\n- Learning style: systematic.\n- Computer: Windows. Software: SolidWorks, AutoCAD. Simulation software: not decided yet.\n- I am a beginner with terminals and Git: explain steps one at a time, with exact commands.\n- No decorative or generated design in the vault. Plain text only.\n\n## Rules for the assistant (shared)\n- Raw notes are never deleted or rewritten. Add summaries and links beside them.\n- Never guess numbers (material values, standards, factors). Give the source or say it must be looked up.\n- Ask before deleting, moving, installing, sending, or spending.\n- Never store or repeat passwords or secrets. I must never paste a password in chat.\n- Teach: concept, equations, worked example, self-test. Hint before answers on my own design or homework.\n- A simulation result is only a claim until checked against a hand calculation or known case.\n\n---\n\n## Route A: Vault and companion\nGoal: a lifelong memory I own, in plain Markdown, backed up on GitHub, readable by any future AI.\n\nFolders: `inbox/ daily/ courses/ ideas/ projects/ knowledge/ cad/ career/ reference/ templates/ agent/ log/`\nKey files: `README.md`, `agent/INSTRUCTIONS.md`, `agent/PERMISSIONS.md`.\nPermission levels: free (read, write to inbox/daily/ideas/log), ask first (delete, move, run scripts, send, touch CAD files), never (password managers, banking, system folders).\n\nDaily routine: copy `templates/daily.md` to `daily/<date>.md`, capture in `inbox/`, weekly review with `templates/weekly-review.md`.\n\nBuild plan:\n1. Vault (done).\n2. Search and Q&A over the vault.\n3. Voice capture, calendar and Drive links, scheduled weekly reviews.\n4. Always-on Windows agent with voice, then engineering tools.\n\nOpen-source Jarvis projects considered (not installed): ethanplusai/jarvis (macOS, Claude Code voice), eadmin2/jarvis_ai, Likhithsai2580/JARVIS, omnigentx/jarvis, Shaan-alpha/jarvis-py (offline). Review code before running any.\n\nOn my PC: clone is at `$HOME\\Documents\\LifeVault`. Update with `git pull`. Save changes with `git add -A`, `git commit -m \"message\"`, `git push`.\n\n## Route B: Study\nRoadmap: `knowledge/roadmap/README.md` (5 stages, checkboxes: [ ] not started, [~] in progress, [x] can explain and solve).\n\nStage 1 progress:\n- [x] Material properties and selection\n- [~] Statics, Mechanics of materials, Beam deflection and buckling, Stress concentration\n- [ ] Stress transformation and Mohr's circle, Failure theories, Fatigue basics\n\nCurrent lesson: `knowledge/roadmap/lessons/stage1-01-statics.md` (statics, free-body diagrams, equilibrium). Self-test Q1-Q3 are waiting for my answers.\nSuggested order: statics, mechanics of materials, Mohr's circle, failure theories, beam deflection and buckling, stress concentration, fatigue.\nEach topic: learn, write a note in my own words, solve a hand problem, link to a project. Study log: `templates/study-session.md`.\n\n## Route C: CAD and simulation\nFiles: `knowledge/simulation/setup-checklist.md`, `knowledge/design-rules/design-checklist.md`, `knowledge/cad-practice/README.md`, `templates/simulation-log.md`, `templates/design-review.md`, `cad/solidworks/`, `cad/autocad/`.\nPlan: SolidWorks and AutoCAD can be scripted (SolidWorks API, AutoCAD scripting/AutoLISP). Start with small safe tasks like batch-exporting drawings to PDF. Always work on copies. Keep large CAD files outside Git (.gitignore blocks .sldprt, .sldasm, .dwg and similar).\nSimulation habits: define the question, check boundary conditions, run a mesh convergence study, check reactions, avoid trusting stress at singularities, compare to a hand calculation.\n\n## Route D: OmniRoute (open-source AI gateway)\nRepo: github.com/diegosouzapw/OmniRoute (MIT). Installed on my PC: v3.8.51, Node v24.21.0.\n- Install: `npm install -g omniroute`. Start: `omniroute`. Stop: Ctrl+C. Dashboard and API: http://localhost:20128 (API base /v1).\n- Keep it local-only. Put these lines in `C:\\Users\\henry\\.omniroute\\.env`:\n  `OMNIROUTE_SERVER_HOST=127.0.0.1` and `REQUIRE_API_KEY=true`\n- In PowerShell, set a variable for one window with `$env:NAME=\"value\"` (needs `$env:`).\n- Reset dashboard password: stop it, run `omniroute reset-password`, then restart. My earlier password was shown in a screenshot; keep it changed and never share a new one.\n- Diagnose problems: `omniroute doctor`. First start can be slow (it may say it did not respond in 60s while still starting).\n- Cautions: no main accounts or provider keys yet, no vault connection yet, do not enable TLS stealth or MITM/TPROXY features, \"free\" providers may break provider terms or log data. Back up `.env` later (holds the key that encrypts saved provider keys).\n- Why it may matter: later, my own assistant app could use it to switch between models. Not needed for the vault.\n\n## Route E: Career and portfolio\nFolder: `career/portfolio/`. One folder per finished project: problem and constraints, approach and decisions, analysis (calculated, simulated, how checked), result with units, what went wrong, images or drawings (stored outside Git if large).\nAim: 3-5 well-explained projects beat many shallow ones.\nLong-term: a \"life company\" for me, not a social platform, a real companion that holds my memos and helps with tips, ways, creations and ideas.\n\n---\n\n## Open items\n1. Answer statics self-test Q1-Q3.\n2. Decide simulation software (SolidWorks Simulation, ANSYS, Abaqus, COMSOL).\n3. Confirm OmniRoute password is changed and the two security lines are in `.env`.\n4. Fill roadmap Stage 2-5 progress.\n5. Start the first daily note.\n\n## Change log\n- 2026-10-06: vault created, profile added, roadmap and templates added, session notes saved, HUB created.\n"}, {"path": "README.md", "title": "Life Vault", "text": "# Life Vault\n\nA plain-text memory for my engineering studies and career. Everything is Markdown so it can be read by any tool, now or in 20 years.\n\n## Start here\nRead `HUB.md`. It is the single master file with routes for vault, study, CAD and simulation, OmniRoute, and career.\n\n## Rules\n1. Raw notes are never deleted or rewritten by the agent. It may add summaries and links next to them.\n2. Everything lives in files in this repo. No notes are locked inside an app.\n3. No passwords, ID numbers or medical data in here.\n4. Commit often. Git is the undo button and the backup.\n\n## Layout\n| Folder | Purpose |\n|---|---|\n| `inbox/` | Quick capture. Dump anything here, sort it later. |\n| `daily/` | One note per day (`YYYY-MM-DD.md`). |\n| `courses/` | One folder per course: lectures, assignments, exam prep. |\n| `ideas/` | Ideas and inventions, one file each. |\n| `projects/` | One folder per project. Copy `projects/_template`. |\n| `knowledge/` | Long-lived reference: `roadmap/` (study plan), `simulation/`, `design-rules/`, `cad-practice/`, formulas, materials, lessons learned. |\n| `cad/` | Notes and scripts for SolidWorks and AutoCAD. Keep large CAD files outside Git. |\n| `career/` | Goals, skills, internships, contacts, reading list. `portfolio/` holds finished projects. |\n| `reference/` | Standards, datasheets, links. |\n| `templates/` | Note templates. |\n| `agent/` | Instructions and permission rules for the AI companion. |\n| `log/` | Record of actions the agent took. |\n\n## Daily routine\n1. Open `templates/daily.md`, copy it to `daily/<date>.md`.\n2. Capture thoughts in `inbox/` during the day.\n3. Once a week, run the weekly review (`templates/weekly-review.md`).\n4. Study from `knowledge/roadmap/README.md` using `templates/study-session.md`.\n5. Log each simulation with `templates/simulation-log.md` and review designs with `templates/design-review.md`.\n"}, {"path": "agent/INSTRUCTIONS.md", "title": "Companion instructions", "text": "# Companion instructions\n\nYou are my long-term engineering companion. I am a mechanical engineering student using Windows, SolidWorks and AutoCAD. This repo is your memory of me.\n\n## How to behave\n- Read `README.md` and `agent/PERMISSIONS.md` at the start of every session.\n- Answer from my notes first. Say which files you used. If my notes don't cover it, say so before using general knowledge.\n- Be direct. Give reasoning and show calculations with units.\n- Flag uncertainty. Never invent formulas, material values or standards.\n\n## Memory rules\n- New raw input goes to `inbox/`. Never edit or delete my original notes.\n- You may create summaries, tags and links in separate files or in a clearly marked `## Agent notes` section.\n- Link related notes with relative Markdown links.\n- Record every file you create, move or change in `log/YYYY-MM.md`.\n\n## What I want from you\n- Capture and organise my notes.\n- Recall: find what I learned before.\n- Connect ideas across courses and projects.\n- Coach: study plans, exam prep from my own notes, design tips.\n- Brainstorm and critique my designs. Do not generate designs for me. I do the design work.\n\n## Profile (fill in)\n- Year of study: 4th year (Graduated in Bachelor degree)\n- Focus area: Mechanical Design and Simulations\n- Goals: To be a well-known Mechanical engineer\n- How I like to learn: Systematically \n\n## Learning style: systematic\n- Teach in order: concept, then equations, then a worked example, then a self-test question.\n- Build from fundamentals. Check the roadmap in `knowledge/roadmap/README.md` for prerequisites.\n- Show every step and every unit. State assumptions.\n- End each lesson with 2-3 questions for me to answer, and wait for my answers before correcting.\n- Do not give a final answer to my design or homework problem before I have tried it. Hint first.\n- Never present a simulation result as correct without a check against a hand calculation or known case.\n- When I finish a topic, update the roadmap checkbox and suggest the next topic.\n- If a value (material property, standard, factor) is needed, give the source or say it must be looked up. Never guess numbers.\n"}, {"path": "agent/PERMISSIONS.md", "title": "Permissions", "text": "# Permissions\n\n## Free (no need to ask)\n- Read and search any file in this repo.\n- Create and edit files in `inbox/`, `daily/`, `ideas/`, `log/`.\n- Add summaries and links.\n\n## Ask first\n- Deleting, moving or renaming existing files.\n- Editing my notes in `courses/`, `projects/`, `knowledge/`.\n- Running scripts, installing software, changing system settings.\n- Sending messages or emails, or anything outward-facing.\n- Touching SolidWorks or AutoCAD files. Work on copies only.\n\n## Never\n- Access password managers, banking or system folders.\n- Delete originals or rewrite history in Git.\n- Store secrets or personal ID data in this repo.\n"}, {"path": "cad/README.md", "title": "CAD notes", "text": "# CAD notes\n\n- `solidworks/`: macros, API scripts, tips, templates notes.\n- `autocad/`: AutoLISP, scripts, tips, drawing standards.\n\nKeep large `.sldprt`, `.sldasm`, `.dwg` files outside Git (or use Git LFS). Track notes and scripts only.\nTest any automation on copies of files.\n"}, {"path": "career/portfolio/README.md", "title": "Portfolio", "text": "# Portfolio\n\nOne folder per finished project. Keep it honest and specific.\n\nFor each project record:\n1. The problem and constraints.\n2. The approach and the main design decisions.\n3. The analysis: what was calculated, what was simulated, and how it was checked.\n4. The result (numbers with units).\n5. What went wrong and what I learned.\n6. Images or drawings (stored outside Git if large).\n\nA portfolio of 3-5 well explained projects is worth more than many shallow ones.\n"}, {"path": "knowledge/cad-practice/README.md", "title": "CAD practice", "text": "# CAD practice\n\nHabits and lessons for SolidWorks and AutoCAD. One file per topic.\n\n## Rules\n- Fully define every sketch.\n- Name key features and dimensions.\n- Build design intent in: what should change when a dimension changes?\n- Keep a copy of any file before experimenting.\n- Save large CAD files outside Git. Record their location in the project README.\n"}, {"path": "knowledge/design-rules/README.md", "title": "Design rules", "text": "# Design rules\n\nReusable design checks. One file per topic (bolted joints, shafts, welds and so on).\nRecord the source (textbook, standard, supplier) for every rule. Do not store a rule without its source.\n"}, {"path": "knowledge/design-rules/design-checklist.md", "title": "Design checklist", "text": "# Design checklist\n\n## Requirements\n- [ ] Function stated in one sentence\n- [ ] Loads, speeds, temperatures, environment listed\n- [ ] Required life and safety factor decided\n- [ ] Applicable standards identified\n\n## Design\n- [ ] Load path is clear and direct\n- [ ] Stress concentrations reduced (radii, gradual changes)\n- [ ] Material chosen with a reason\n- [ ] Fits and tolerances specified\n- [ ] Assembly and disassembly possible\n- [ ] Maintenance access considered\n\n## Manufacturing\n- [ ] Process chosen (machining, casting, sheet metal, 3D print, welding)\n- [ ] Features suit that process\n- [ ] Standard parts used where possible\n\n## Verification\n- [ ] Hand calculation for each critical part\n- [ ] Simulation checked against the hand calculation\n- [ ] Failure modes listed\n\n## Documentation\n- [ ] Drawing complete and checked\n- [ ] Calculation sheet saved in the project folder\n- [ ] Decisions recorded in the project README\n"}, {"path": "knowledge/lessons-learned/README.md", "title": "Lessons learned", "text": "# Lessons learned\n\nOne file per lesson. Use the form: what happened, why, what to do next time.\n"}, {"path": "knowledge/roadmap/README.md", "title": "Learning roadmap: Mechanical Design and Simulation", "text": "# Learning roadmap: Mechanical Design and Simulation\n\nWork through the stages in order. Each stage ends with a self-test. Do not move on until you can explain the stage in your own words and solve a problem by hand.\n\nMark each topic: `[ ]` not started, `[~]` in progress, `[x]` can explain and solve.\n\n## Stage 1: Fundamentals (hand calculation first)\n- [~] Statics: free-body diagrams, equilibrium, reactions\n- [~] Mechanics of materials: stress, strain, axial, torsion, bending, shear\n- [ ] Stress transformation, Mohr's circle, principal stresses\n- [ ] Failure theories: von Mises, Tresca, max normal stress\n- [~] Beam deflection, buckling\n- [~] Stress concentration\n- [ ] Fatigue basics: S-N curves, endurance limit, mean stress\n- [x] Material properties and selection basics\n- Self-test: size a shaft or bracket by hand, with units and a safety factor.\n\n## Stage 2: Machine design\n- [ ] Fasteners and bolted joints\n- [ ] Welds\n- [ ] Shafts, keys, couplings\n- [ ] Bearings\n- [ ] Gears\n- [ ] Springs\n- [ ] Tolerances, fits, GD&T\n- [ ] Manufacturing processes and design for manufacture\n- Self-test: design a small assembly with a calculation sheet for each critical part.\n\n## Stage 3: CAD discipline (SolidWorks, AutoCAD)\n- [ ] Sketch rules: fully defined sketches, sensible constraints\n- [ ] Feature order and design intent\n- [ ] Assemblies and mates\n- [ ] Configurations and design tables\n- [ ] Drawings: views, dimensions, tolerances, notes\n- [ ] AutoCAD 2D drafting standards\n- Self-test: a part that survives a dimension change without rebuild errors.\n\n## Stage 4: Simulation theory\n- [ ] Finite element method: elements, nodes, shape functions, stiffness idea\n- [ ] Linear static analysis\n- [ ] Boundary conditions and loads: what is physically realistic\n- [ ] Mesh quality, convergence, mesh refinement study\n- [ ] Contacts and connections\n- [ ] Singularities and how to read stress hot spots\n- [ ] Modal (natural frequency) analysis\n- [ ] Thermal and thermal-stress analysis\n- [ ] Buckling analysis\n- [ ] Nonlinear basics: material, geometric, contact\n- [ ] CFD basics: governing equations, meshing, turbulence models, y+\n- Self-test: validate a simulation against a hand calculation and explain any difference.\n\n## Stage 5: Verification and practice\n- [ ] Verification vs validation\n- [ ] Sanity checks for every result\n- [ ] Writing a clear analysis report\n- [ ] Design review habit\n- [ ] Building a portfolio piece from a finished project\n\n## Rule for every topic\n1. Learn it from a textbook or course.\n2. Write a short note in your own words in `knowledge/`.\n3. Solve a hand problem. Record it.\n4. Link the note to any project that used it.\n"}, {"path": "knowledge/roadmap/lessons/stage1-01-statics.md", "title": "Statics: free-body diagrams and equilibrium", "text": "# Statics: free-body diagrams and equilibrium\n\nRoadmap: Stage 1, topic 1. Status: in progress.\n\n## Concept\nStatics asks: if a body is not moving, what forces must act on it? A body at rest (or constant velocity) is in equilibrium: forces and moments balance.\n\nFree-body diagram (FBD):\n1. Isolate the body.\n2. Draw it alone.\n3. Replace everything removed with the forces and moments it applied.\n4. Add axes and dimensions.\n\nMost statics mistakes are FBD mistakes, not algebra mistakes.\n\n## Equations (2D)\n- Sum Fx = 0\n- Sum Fy = 0\n- Sum M = 0 (about any point)\n\nThree independent equations, so at most 3 unknowns by statics alone.\n\nMoment = force x perpendicular distance (N.m). Take moments about a point where unknown forces pass through, so they drop out.\n\n## Support reactions\n| Support | Reactions | Unknowns |\n|---|---|---|\n| Roller | one force, perpendicular to surface | 1 |\n| Pin | two force components (x, y) | 2 |\n| Fixed | two force components and a moment | 3 |\n\n## Worked example\nSimply supported beam, 4 m long. Pin at A (left), roller at B (right). Downward 10 kN load 1 m from A.\n\n1. Sum Fx = 0 gives Ax = 0.\n2. Moments about A (counter-clockwise positive): By(4) - 10(1) = 0, so By = 2.5 kN up.\n3. Sum Fy = 0: Ay + By - 10 = 0, so Ay = 7.5 kN up.\n4. Check with moments about B: -Ay(4) + 10(3) = 0, so Ay = 7.5 kN. OK.\n\nSanity check: load is closer to A, so A carries more.\n\n## Common mistakes\n- Forgetting a reaction at a support.\n- Mixing up signs. Pick a positive direction and keep it.\n- Using distance along the beam instead of the perpendicular distance.\n- Skipping units.\n\n## Self-test (my answers go below; do not look anything up first)\nQ1. Simply supported beam, 6 m long, pin at A (left), roller at B (right), downward 12 kN load 2 m from A. Find Ay, Ax, By with equations and units.\nQ2. Why at most 3 unknowns in a 2D statics problem? What does it mean if the FBD has 4 unknown reactions?\nQ3. Why does a pin give 2 reaction components while a roller gives 1?\n\n## My answers\n(write here)\n\n## Result\nNot yet answered.\n"}, {"path": "knowledge/simulation/README.md", "title": "Simulation knowledge", "text": "# Simulation knowledge\n\nNotes on FEA and CFD: setup, lessons, checklists. One file per topic.\n\nSuggested files to create as you learn:\n- `mesh-convergence.md`\n- `boundary-conditions.md`\n- `contacts.md`\n- `modal-analysis.md`\n- `thermal.md`\n- `cfd-basics.md`\n- `common-mistakes.md`\n\n## Core principle\nA simulation result is only a claim until it is checked. Always compare to a hand calculation, a known case or a test.\n"}, {"path": "knowledge/simulation/setup-checklist.md", "title": "Simulation setup checklist", "text": "# Simulation setup checklist\n\nFill in before running. Copy to the project folder.\n\n## Goal\n- What question is the simulation answering?\n- What result would change a design decision?\n\n## Geometry\n- [ ] Simplified: removed small fillets, holes and threads that do not matter for this question\n- [ ] Symmetry used where valid\n\n## Material\n- [ ] Properties from a documented source (record the source)\n- [ ] Linear or nonlinear behaviour decided and justified\n- [ ] Units consistent\n\n## Loads\n- [ ] Every load has a physical source\n- [ ] Direction, magnitude and application area checked\n- [ ] Load case combinations listed\n\n## Boundary conditions\n- [ ] Not over-constrained (no fake stiffness)\n- [ ] Not under-constrained (no rigid-body motion)\n- [ ] Reactions checked against applied loads\n\n## Contacts and connections\n- [ ] Contact types chosen on purpose\n- [ ] Bolts and pins modelled at the right level of detail\n\n## Mesh\n- [ ] Finer mesh where stress changes quickly\n- [ ] Mesh quality metrics checked\n- [ ] Convergence study done on the result that matters\n\n## Results review\n- [ ] Reactions equal applied loads\n- [ ] Deformation shape looks physically sensible\n- [ ] Peak stress not at a singularity (point load, sharp corner, constraint edge)\n- [ ] Compared with a hand calculation\n- [ ] Safety factor computed against the correct failure criterion\n"}, {"path": "log/sessions/2026-10-06-setup-session.md", "title": "Session notes: 2026-10-06 (setup session)", "text": "# Session notes: 2026-10-06 (setup session)\n\nPurpose: save the key decisions and state from the first long chat, so nothing depends on the chat history.\n\n## Goal\nA lifelong engineering companion for me (mechanical engineering, 4th year graduated, focus on mechanical design and simulations). It keeps my memos and notes, teaches systematically, and helps with ideas, tips and creations. It is a private memory, not a social platform.\n\n## Decisions\n- Memory = plain Markdown files in this Git repo. I own it. Any AI can read it later.\n- Start with the Claude desktop app plus this vault. Build a custom Windows agent later, once I know what I need.\n- Computer-control access comes in layers: free, ask first, never (see `agent/PERMISSIONS.md`).\n- No generated or decorative design in the vault. Plain text only.\n- Software I use: Windows, SolidWorks, AutoCAD. Simulation software: to be decided.\n\n## What exists in the vault\n- `README.md` rules and folder map\n- `agent/INSTRUCTIONS.md` and `agent/PERMISSIONS.md`\n- `templates/` daily, weekly review, lecture, idea, simulation log, design review, study session\n- `knowledge/roadmap/README.md` five-stage learning roadmap\n- `knowledge/simulation/`, `knowledge/design-rules/`, `knowledge/cad-practice/`\n- `career/portfolio/`\n\n## Roadmap progress (Stage 1)\n- Material properties and selection: can explain and solve\n- In progress: statics, mechanics of materials, beam deflection and buckling, stress concentration\n- Not started: stress transformation and Mohr's circle, failure theories, fatigue\n\n## Current lesson\nStatics lesson saved at `knowledge/roadmap/lessons/stage1-01-statics.md`. Self-test questions are waiting for my answers.\n\n## OmniRoute (open-source AI gateway) installed on my PC\n- Installed with: `npm install -g omniroute` (version 3.8.51, Node v24.21.0).\n- Runs at http://localhost:20128. Start with `omniroute`, stop with Ctrl+C.\n- Security settings to keep (put in `C:\\Users\\henry\\.omniroute\\.env`):\n  - `OMNIROUTE_SERVER_HOST=127.0.0.1`\n  - `REQUIRE_API_KEY=true`\n- PowerShell sets variables for one window with `$env:NAME=\"value\"`.\n- Reset the dashboard password with `omniroute reset-password`, then restart.\n- Rules for now: no main accounts or provider keys added, vault not connected to it.\n- Never store passwords in this repo or paste them in chat. My earlier password was exposed in a screenshot and must stay changed.\n- Back up `C:\\Users\\henry\\.omniroute\\.env` later (it holds the key that encrypts saved provider keys).\n\n## Open items\n1. Answer the statics self-test (Q1-Q3).\n2. Decide simulation software (SolidWorks Simulation, ANSYS, Abaqus, COMSOL).\n3. Make sure the OmniRoute password has been changed again.\n4. Later: search tool over the vault, SolidWorks/AutoCAD scripts, voice layer.\n\n## How to continue in a new chat\nTell the assistant: \"Read README.md, agent/INSTRUCTIONS.md and log/sessions/2026-10-06-setup-session.md, then continue from Open items.\"\n"}, {"path": "projects/_template/README.md", "title": "Project name", "text": "# Project name\n\nStatus:\nStart date:\nGoal:\n\n## Requirements\n- \n\n## Design decisions\n| Date | Decision | Reason |\n|---|---|---|\n\n## Calculations\n- \n\n## Test results\n- \n\n## What worked / what failed\n- \n\n## Files\n- CAD files are stored at: (path outside Git)\n"}, {"path": "templates/daily.md", "title": "YYYY-MM-DD", "text": "# YYYY-MM-DD\n\n## Plan\n- \n\n## Done\n- \n\n## Learned\n- \n\n## Ideas\n- \n\n## Problems / questions\n- \n"}, {"path": "templates/design-review.md", "title": "Design review: part / assembly name", "text": "# Design review: part / assembly name\n\nDate:\nReviewer: me\n\n## Purpose\n- \n\n## What I checked\n- [ ] Requirements met\n- [ ] Load path\n- [ ] Stress and deflection\n- [ ] Fatigue where it applies\n- [ ] Tolerance const NOTES = DATA.notes;
const BY_PATH = Object.fromEntries(NOTES.map(n => [n.path, n]));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/* ---------- Markdown ---------- */
function resolve(from, href) {
  const parts = from.split("/").slice(0, -1);
  for (const seg of href.split("/")) {
    if (seg === "..") parts.pop(); else if (seg !== "." && seg !== "") parts.push(seg);
  }
  return parts.join("/");
}
function inline(s, from) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => {
    href = href.replace(/&amp;/g, "&");
    if (/^https?:/.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
    const [file, frag] = href.split("#");
    const target = file ? resolve(from, file) : from;
    if (BY_PATH[target]) return `<a href="#/${encodeURI(target)}">${text}</a>`;
    return `<span title="Not in vault: ${esc(href)}">${text}</span>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:]|$)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}
function parseList(lines, i, from) {
  const indentOf = l => l.match(/^ */)[0].length;
  const base = indentOf(lines[i]);
  const ordered = /^\s*\d+[.)]\s/.test(lines[i]);
  let out = `<${ordered ? "ol" : "ul"}>`;
  while (i < lines.length) {
    const l = lines[i], ind = indentOf(l);
    const m = l.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/);
    if (!m || ind < base) break;
    if (ind > base) { const [html, ni] = parseList(lines, i, from); out = out.replace(/<\/li>$/, html + "</li>"); i = ni; continue; }
    let body = m[1], cls = "";
    const t = body.match(/^\[([ x~X])\]\s+(.*)$/);
    if (t) {
      const k = t[1] === " " ? "[ ]" : t[1] === "~" ? "[~]" : "[x]";
      body = `<span class="chip">${k}</span>` + inline(t[2], from); cls = ' class="task"';
    } else body = inline(body, from);
    out += `<li${cls}>${body}</li>`; i++;
  }
  return [out + `</${ordered ? "ol" : "ul"}>`, i];
}
function render(md, from) {
  const lines = md.replace(/\r\n/g, "\n").split("\n"), out = [], heads = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      const n = h[1].length, id = "h" + heads.length;
      heads.push({ n, id, text: h[2].replace(/[`*]/g, "") });
      out.push(`<h${n} id="${id}">${inline(h[2], from)}</h${n}>`); i++; continue;
    }
    if (/^\s*([-*_])\1{2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c, from)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c, from)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "), from)}</blockquote>`); continue;
    }
    if (/^\s*(?:[-*+]|\d+[.)])\s+/.test(l)) { const [html, ni] = parseList(lines, i, from); out.push(html); i = ni; continue; }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>\s?|\s*(?:[-*+]|\d+[.)])\s+|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "), from)}</p>`);
  }

}

function results(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
