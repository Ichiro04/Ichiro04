"Servo FoS\",\"–\"]],\n  calc(p,m){\n    const g=9.81e-3, KGCM=98.0665;\n    const A=p.w*p.hgt-Math.max(0,p.w-2*p.t)*Math.max(0,p.hgt-2*p.t), lam=A*m.rho/1000;\n    const m1=lam*p.L1, m2=lam*p.L2, tip=p.mg+p.mp, R=p.L1+p.L2;\n    const TsStat=g*(m1*p.L1/2 + p.me*p.L1 + m2*(p.L1+p.L2/2) + tip*R);\n    const J=(m1*Math.pow(p.L1/2,2) + p.me*p.L1*p.L1 + m2*Math.pow(p.L1+p.L2/2,2) + tip*R*R)*1e-9;\n    const TsDyn=J*p.acc*1000, Ts=TsStat+TsDyn, Te=g*(m2*p.L2/2 + tip*p.L2);\n    const effS=p.rs>1?0.9:1, effE=p.re>1?0.9:1;\n    const allowS=p.stall*p.rs*effS/p.fos, allowE=p.stall*p.re*effE/p.fos;\n    const uS=(Ts/KGCM)/allowS, uE=(Te/KGCM)/allowE;\n    const I=(p.w*Math.pow(p.hgt,3)-Math.max(0,p.w-2*p.t)*Math.pow(Math.max(0,p.hgt-2*p.t),3))/12, EI=m.E*1000*I;\n    const P1=g*(p.me+m2+tip), q=g*lam, P2=g*tip;\n    const d1=P1*Math.pow(p.L1,3)/(3*EI)+Te*p.L1*p.L1/(2*EI)+q*Math.pow(p.L1,4)/(8*EI);\n    const th1=P1*p.L1*p.L1/(2*EI)+Te*p.L1/EI+q*Math.pow(p.L1,3)/(6*EI);\n    const d2=P2*Math.pow(p.L2,3)/(3*EI)+q*Math.pow(p.L2,4)/(8*EI);\n    const sag=d1+th1*p.L2+d2;\n    const rad=Math.PI/180, eBl=(p.bl/p.rs)*rad*R + (p.bl/p.re)*rad*p.L2, err=sag+eBl;\n    const tipWo=g*(m1*p.L1/2 + p.me*p.L1 + m2*(p.L1+p.L2/2) + p.mg*R) + (m1*Math.pow(p.L1/2,2)+p.me*p.L1*p.L1+m2*Math.pow(p.L1+p.L2/2,2)+p.mg*R*R)*1e-9*p.acc*1000;\n    const perGram=g*R + R*R*1e-9*p.acc*1000, mpMax=Math.max(0,(allowS*KGCM - tipWo)/perGram);\n    const checks=[\n      {name:\"Reach\", val:`${fmt(R,0)} mm`, lim:`≥ ${p.reach} mm`, ok: R>=p.reach-1e-9, u:p.reach/R},\n      {name:\"Shoulder torque\", val:`${fmt(Ts/KGCM,2)} kg·cm`, lim:`≤ ${fmt(allowS,2)} kg·cm`, ok: uS\u003c=1+1e-9, u:uS},\n      {name:\"Elbow torque\", val:`${fmt(Te/KGCM,2)} kg·cm`, lim:`≤ ${fmt(allowE,2)} kg·cm`, ok: uE\u003c=1+1e-9, u:uE},\n      {name:\"Tip error (sag + backlash)\", val:`${fmt(err,2)} mm`, lim:`≤ ${p.prec} mm`, ok: err\u003c=p.prec+1e-9, u:err/p.prec},\n      {name:\"Max payload at full reach\", val:`${fmt(mpMax,0)} g`, lim:\"info\", ok:null},\n      {name:\"Arm mass (links)\", val:`${fmt(m1+m2,0)} g`, lim:\"info\", ok:null}\n    ];\n    const work=`Link section A = w·h − (w−2t)(h−2t) = ${fmt(A,0)} mm², mass/length λ = A·ρ = ${fmt(lam,3)} g/mm\nm₁ = ${fmt(m1,1)} g, m₂ = ${fmt(m2,1)} g, tip mass = gripper + payload = ${fmt(tip,0)} g, R = ${fmt(R,0)} mm\nShoulder (arm horizontal, worst case):\n  Ts,static = g·[m₁·L₁/2 + m_elbow·L₁ + m₂(L₁+L₂/2) + m_tip·R] = ${fmt(TsStat,0)} N·mm\n  J = Σ m·r² = ${fmt(J,5)} kg·m²,  Ts,dyn = J·α = ${fmt(TsDyn,0)} N·mm\n  Ts = ${fmt(Ts,0)} N·mm = ${fmt(Ts/KGCM,2)} kg·cm   (1 kg·cm = 98.07 N·mm)\n  Allowed = stall × ratio × η / FoS = ${p.stall} × ${p.rs} × ${effS} / ${p.fos} = ${fmt(allowS,2)} kg·cm\nElbow: Te = g·[m₂·L₂/2 + m_tip·L₂] = ${fmt(Te,0)} N·mm = ${fmt(Te/KGCM,2)} kg·cm, allowed ${fmt(allowE,2)}\nLink bending (PLA, E = ${m.E} GPa): I = ${fmt(I,0)} mm⁴\n  link 1 tip δ₁ = P₁L₁³/3EI + M·L₁²/2EI + qL₁⁴/8EI = ${fmt(d1,3)} mm, slope θ₁ = ${fmt(th1,5)} rad\n  gripper sag = δ₁ + θ₁·L₂ + δ₂ = ${fmt(sag,3)} mm\nBacklash: (${p.bl}°/${p.rs})·R + (${p.bl}°/${p.re})·L₂ in radians = ${fmt(eBl,2)} mm\nMax payload: (allowed torque − torque without payload) / (g·R + R²·α) = ${fmt(mpMax,0)} g`;\n    return {checks, work, uS, uE, err, sag, eBl, m1, m2, tip, lam, R, pass: checks.filter(c=>c.ok!==null).every(c=>c.ok), key:`L ${p.L1}/${p.L2} · grip ${p.mg} g · ${p.rs}:1 · bl ${p.bl}° · Ts ${fmt(uS*100,0)}% · err ${fmt(err,2)} mm`};\n  },\n  improve(p,m){\n    const r=this.calc(p,m), q={...p}, R=p.L1+p.L2;\n    if(R\u003cp.reach){ const L=Math.ceil(p.reach/2/5)*5; q.L1=L; q.L2=L; return {q, why:`\u003cb>Can't reach the part.\u003c/b> L₁ + L₂ must be at least ${p.reach} mm, so set both links to \u003cb>${L} mm\u003c/b>.`}; }\n    if(R>p.reach+5){ const L=Math.ceil(p.reach/2/5)*5; q.L1=L; q.L2=L; return {q, why:`\u003cb>Too much reach.\u003c/b> Shoulder torque grows with the distance to every mass, so reach you don't need costs torque all the time. Trim both links to \u003cb>${L} mm\u003c/b> (total ${2*L} mm for a ${p.reach} mm requirement).`}; }\n    if(r.uS>1 && p.mg>50){ q.mg=50; return {q, why:`\u003cb>Shoulder overloaded (${fmt(r.uS*100,0)}% of allowed).\u003c/b> The gripper sits at the longest lever arm, so every gram there costs the most torque. Lighten the gripper and wrist from ${p.mg} g to \u003cb>50 g\u003c/b> with hollow printed fingers and a micro servo.`}; }\n    if(r.uS>1){ for(const k of [2,3,4]){ const t=this.calc({...p,rs:k},m); if(t.uS\u003c=1){ q.rs=k; return {q, why:`\u003cb>Shoulder still overloaded.\u003c/b> Add a \u003cb>${k}:1\u003c/b> belt or gear reduction at the shoulder. Torque goes up by ratio × efficiency (${k} × 0.9) and speed goes down by ${k}. It also divides the servo's backlash at the output by ${k}.`}; } } q.stall=p.stall*1.5; return {q, why:`Reduction alone is not enough. Fit a stronger servo: stall \u003cb>${fmt(q.stall,1)} kg·cm\u003c/b>.`}; }\n    if(r.uE>1){ for(const k of [2,3,4]){ const t=this.calc({...p,re:k},m); if(t.uE\u003c=1){ q.re=k; return {q, why:`\u003cb>Elbow overloaded.\u003c/b> Add a \u003cb>${k}:1\u003c/b> reduction at the elbow.`}; } } }\n    if(r.err>p.prec){\n      if(r.eBl>r.sag && p.bl>0.2){ q.bl=0.2; return {q, why:`\u003cb>Not accurate enough: ${fmt(r.err,2)} mm.\u003c/b> Bending is only ${fmt(r.sag,2)} mm; backlash causes ${fmt(r.eBl,2)} mm. Use servos with less play, or preload each joint with a spring so the gears always sit on one flank. Backlash drops to \u003cb>0.2°\u003c/b>.`}; }\n      const h=[35,40,45,50].find(x=>x>p.hgt && this.calc({...p,hgt:x},m).err\u003c=p.prec); if(h){ q.hgt=h; return {q, why:`\u003cb>Links bend too much.\u003c/b> I grows with h³, so make the link section \u003cb>${h} mm\u003c/b> deep.`}; }\n    }\n    return {q:null, why:\"No further improvement: reach, both joint torques and tip accuracy all pass. Check the max payload figure before you change the job.\"};\n  }\n }\n};\nconst TB = { sc:\"beam\", state:{}, scene:null, group:null, gearSpin:null, railT:null };\nfunction scState(id){\n  if(!TB.state[id]){ const d={...SC[id].defaults}; TB.state[id]={revs:[{label:\"A\", p:d, why:\"Starting design\"}], cur:0, edited:false}; }\n  return TB.state[id];\n}\nfunction curP(){ const st=scState(TB.sc); return st.revs[st.cur].p; }\nconst SC_LEVEL={beam:1, rail:1, gear:2, arm:3};\nfunction renderTests(){\n  if(!unlocked(SC_LEVEL[TB.sc])){\n    $(\"#testPanel\").innerHTML = lockCard(SC_LEVEL[TB.sc], SC[TB.sc].name+\" case\");\n    if(V.ok){ disposeGroup(TB.group); V.tickers=V.tickers.filter(f=>!f.tb); }\n    setHud(\"\"); setLegend(false); return;\n  }\n  const sc=SC[TB.sc], st=scState(TB.sc), p=st.revs[st.cur].p, m=matById(p.mat), r=sc.calc(p,m);\n  if(r.pass) markTask(TB.sc+\"-pass\");\n  const matOpts = allMaterials().map(x=>`\u003coption value=\"${esc(x.id)}\"${x.id===p.mat?\" selected\":\"\"}>${esc(x.name)}\u003c/option>`).join(\"\");\n  const fields = sc.fields.map(([k,lab,u])=>`\u003cdiv class=\"field\">\u003clabel for=\"in-${k}\">${esc(lab)}\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"in-${k}\" data-k=\"${k}\" type=\"number\" step=\"any\" value=\"${p[k]}\">\u003cspan class=\"unit\">${esc(u)}\u003c/span>\u003c/div>\u003c/div>`).join(\"\");\n  const rows = r.checks.map(c=>`\u003ctr>\u003ctd>${esc(c.name)}\u003c/td>\u003ctd class=\"num mono\">${esc(c.val)}\u003c/td>\u003ctd class=\"mono\" style=\"color:var(--muted)\">${esc(c.lim)}\u003c/td>\u003ctd>${c.ok===null?'\u003cspan class=\"chip info\">INFO\u003c/span>':c.ok?'\u003cspan class=\"chip pass\">PASS\u003c/span>':'\u003cspan class=\"chip fail\">FAIL\u003c/span>'}\u003c/td>\u003c/tr>`).join(\"\");\n  const revRows = st.revs.map((rv,i)=>{ const rr=sc.calc(rv.p,matById(rv.p.mat)); return `\u003ctr${i===st.cur?' style=\"background:var(--accent-soft)\"':''}>\u003ctd class=\"mono\">${rv.label}${i===st.cur&&st.edited?\"*\":\"\"}\u003c/td>\u003ctd style=\"font-size:.82rem\">${rv.why.replace(/\u003c[^>]+>/g,\"\").slice(0,90)}${rv.why.length>90?\"…\":\"\"}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:.76rem\">${esc(rr.key)}\u003c/td>\u003ctd>${rr.pass?'\u003cspan class=\"chip pass\">PASS\u003c/span>':'\u003cspan class=\"chip fail\">FAIL\u003c/span>'}\u003c/td>\u003c/tr>`; }).join(\"\");\n  const firstFail = r.checks.find(c=>c.ok===false);\n  $(\"#testPanel\").innerHTML = `\n   \u003cdiv class=\"panel stack\">\u003ch3>${esc(sc.name)}\u003c/h3>\u003cp style=\"font-size:.9rem\">${esc(sc.story)}\u003c/p>\u003c/div>\n   \u003cdiv class=\"verdict ${r.pass?\"pass\":\"fail\"}\">\u003cspan class=\"big\">Rev ${st.revs[st.cur].label}${st.edited?\"*\":\"\"}\u003c/span>\u003cspan>${r.pass?\"PASS: meets every check\":\"FAIL: \"+esc(firstFail?firstFail.name:\"\")}\u003c/span>\u003c/div>\n   \u003cdiv class=\"panel stack\">\n     \u003cdiv class=\"stepper\">\u003cbutton class=\"btn primary\" id=\"tbImprove\" type=\"button\">Improve one step\u003c/button>\u003cbutton class=\"btn\" id=\"tbReset\" type=\"button\">Reset to Rev A\u003c/button>\u003cbutton class=\"btn\" id=\"tbSave\" type=\"button\">Save revision\u003c/button>\u003c/div>\n     \u003cdiv class=\"change\" id=\"tbWhy\">${st.revs[st.cur].why}\u003c/div>\n   \u003c/div>\n   \u003cdiv class=\"panel\">\u003cdiv class=\"tablewrap\">\u003ctable>\u003ctr>\u003cth>Check\u003c/th>\u003cth class=\"num\">Value\u003c/th>\u003cth>Limit\u003c/th>\u003cth>\u003c/th>\u003c/tr>${rows}\u003c/table>\u003c/div>\n     \u003cdetails class=\"working\" style=\"margin-top:8px\">\u003csummary>Show the working\u003c/summary>\u003cpre>${esc(r.work)}\u003c/pre>\u003c/details>\u003c/div>\n   ${unlocked(3) ? `\u003cdiv class=\"panel stack sweepwrap\">\u003ch3>Design sweep: ${esc(sc.sweep.label)}\u003c/h3>\n     \u003cp style=\"font-size:.86rem;color:var(--muted)\">Each line is one check as a fraction of its limit. Below 1.0 passes. The shaded band is where every check passes, and the dashed line is your current design.\u003c/p>\n     \u003cdiv class=\"stepper\">\u003cbutton class=\"btn\" type=\"button\" id=\"sweepBtn\">Run sweep\u003c/button>\u003cspan class=\"mono\" id=\"sweepNote\" style=\"font-size:.8rem\">\u003c/span>\u003c/div>\n     \u003ccanvas id=\"sweepCanvas\" hidden>\u003c/canvas>\u003cdiv class=\"legendrow\" id=\"sweepLegend\">\u003c/div>\u003c/div>` : `\u003cdiv class=\"panel lock\">\u003cspan class=\"chip warn\">Unlocks at Advanced\u003c/span>\u003cp style=\"font-size:.88rem\">Design sweep: see every check across a range of ${esc(sc.sweep.label.toLowerCase())} in one chart.\u003c/p>\u003c/div>`}\n   \u003cdiv class=\"panel stack\">\u003ch3>Inputs\u003c/h3>\u003cdiv class=\"fields\">${fields}\u003cdiv class=\"field wide\">\u003clabel for=\"in-mat\">Material\u003c/label>\u003cdiv class=\"inp\">\u003cselect id=\"in-mat\">${matOpts}\u003c/select>\u003c/div>\u003c/div>\u003c/div>\n     \u003cp class=\"src\">E ${fmt(m.E,1)} GPa · σy ${fmt(m.sy,0)} MPa · ρ ${fmt(m.rho,2)} g/cm³ · α ${fmt(m.alpha,1)} µm/m·°C\u003c/p>\u003c/div>\n   \u003cdiv class=\"panel\">\u003ch3 style=\"margin-bottom:6px\">Revision history\u003c/h3>\u003cdiv class=\"tablewrap\">\u003ctable>\u003ctr>\u003cth>Rev\u003c/th>\u003cth>Change\u003c/th>\u003cth>Result\u003c/th>\u003cth>\u003c/th>\u003c/tr>${revRows}\u003c/table>\u003c/div>\u003c/div>`;\n  $(\"#testPanel\").querySelectorAll(\"input[data-k]\").forEach(inp=>inp.addEventListener(\"change\",e=>{\n    const v=parseFloat(e.target.value); if(!isFinite(v)||v\u003c=0&&![\"Ti\",\"Tmin\",\"Tmax\"].includes(e.target.dataset.k)){ toast(\"Enter a positive number\"); renderTests(); return; }\n    editParam(e.target.dataset.k, v);\n  }));\n  $(\"#in-mat\").addEventListener(\"change\",e=>editParam(\"mat\",e.target.value));\n  $(\"#tbImprove\").addEventListener(\"click\", improveStep);\n  $(\"#tbReset\").addEventListener(\"click\", ()=>{ delete TB.state[TB.sc]; renderTests(); buildTest(); });\n  $(\"#tbSave\").addEventListener(\"click\", saveRun);\n  if(TB.sc===\"rail\") renderRailSlider(p);\n  if(TB.sc===\"arm\") renderArmSliders(p,m,r);\n  const sb=$(\"#sweepBtn\"); if(sb) sb.addEventListener(\"click\", ()=>{ runSweep(); markTask(\"sweep-used\"); });\n  buildTest();\n}\nconst SWEEP_COLORS=[\"#2f6fd6\",\"#d9822b\",\"#159a8c\",\"#8a4fd0\",\"#c2417a\"];\nfunction runSweep(){\n  const sc=SC[TB.sc], p=curP(), m=matById(p.mat), sw=sc.sweep, cv=$(\"#sweepCanvas\"); if(!cv) return;\n  const xs=[]; for(let x=sw.min; x\u003c=sw.max+1e-9; x+=sw.step) xs.push(+x.toFixed(4));\n  const names=sc.calc(p,m).checks.filter(c=>typeof c.u===\"number\").map(c=>c.name);\n  const series=names.map(()=>[]), passX=[];\n  xs.forEach(x=>{ const r=sc.calc({...p,[sw.key]:x},m); const cs=r.checks.filter(c=>typeof c.u===\"number\"); cs.forEach((c,i)=>series[i].push(c.u)); if(cs.every(c=>c.u\u003c=1+1e-9)) passX.push(x); });\n  cv.hidden=false;\n  const dpr=Math.min(2,window.devicePixelRatio||1), W=cv.clientWidth||600, H=240; cv.width=W*dpr; cv.height=H*dpr;\n  const g=cv.getContext(\"2d\"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);\n  const cs=getComputedStyle(document.documentElement), muted=cs.getPropertyValue(\"--muted\").trim()||\"#666\", line=cs.getPropertyValue(\"--line\").trim()||\"#ccc\", ink=cs.getPropertyValue(\"--ink\").trim()||\"#111\", passC=cs.getPropertyValue(\"--pass\").trim()||\"#1d7344\";\n  const L=40,R=12,T=10,B=34, x0=sw.min, x1=sw.max, Y=2;\n  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R), YY=v=>T+(1-Math.min(Y,Math.max(0,v))/Y)*(H-T-B);\n  g.globalAlpha=0.14; g.fillStyle=passC; passX.forEach(x=>{ g.fillRect(X(x)-((W-L-R)/xs.length)/2, T, (W-L-R)/xs.length+0.5, H-T-B); }); g.globalAlpha=1;\n  g.font=\"11px 'IBM Plex Mono', monospace\"; g.fillStyle=muted; g.strokeStyle=line; g.lineWidth=1;\n  [0,0.5,1,1.5,2].forEach(v=>{ g.beginPath(); g.moveTo(L,YY(v)); g.lineTo(W-R,YY(v)); g.stroke(); g.fillText(v.toFixed(1),6,YY(v)+4); });\n  g.strokeStyle=ink; g.lineWidth=1.5; g.beginPath(); g.moveTo(L,YY(1)); g.lineTo(W-R,YY(1)); g.stroke(); g.fillStyle=ink; g.fillText(\"limit\",W-R-36,YY(1)-4);\n  g.fillStyle=muted; for(let i=0;i\u003c=4;i++){ const v=x0+(x1-x0)*i/4; const t=fmt(v,2); g.fillText(t, Math.min(W-R-g.measureText(t).width, Math.max(L, X(v)-g.measureText(t).width/2)), H-B+16); }\n  g.fillText(sw.label, L, H-4);\n  series.forEach((sr,i)=>{ g.strokeStyle=SWEEP_COLORS[i%SWEEP_COLORS.length]; g.lineWidth=2; g.beginPath(); sr.forEach((v,k)=>{ const px=X(xs[k]), py=YY(v); k?g.lineTo(px,py):g.moveTo(px,py); }); g.stroke(); });\n  const cx=X(Math.min(x1,Math.max(x0,p[sw.key]))); g.setLineDash([5,4]); g.strokeStyle=ink; g.lineWidth=1; g.beginPath(); g.moveTo(cx,T); g.lineTo(cx,H-B); g.stroke(); g.setLineDash([]);\n  $(\"#sweepLegend\").innerHTML=names.map((n,i)=>`\u003cspan>\u003ci style=\"background:${SWEEP_COLORS[i%SWEEP_COLORS.length]}\">\u003c/i>${esc(n)}\u003c/span>`).join(\"\");\n  $(\"#sweepNote\").textContent = passX.length ? `Every check passes from ${fmt(passX[0],2)} to ${fmt(passX[passX.length-1],2)}${passX.length\u003cxs.length && (passX[passX.length-1]-passX[0])/sw.step+1>passX.length?\" (with gaps)\":\"\"}` : \"No value in this range passes every check: change another input first\";\n}\nfunction editParam(k,v){\n  const st=scState(TB.sc); const rv=st.revs[st.cur];\n  if(st.cur!==st.revs.length-1){ st.revs=st.revs.slice(0,st.cur+1); }\n  rv.p={...rv.p,[k]:v}; st.edited=true; rv.why = rv.why.includes(\"(edited by you)\")?rv.why:rv.why+\" (edited by you)\";\n  renderTests();\n}\nfunction improveStep(){\n  const sc=SC[TB.sc], st=scState(TB.sc), p=st.revs[st.cur].p, m=matById(p.mat);\n  const res=sc.improve(p,m);\n  if(!res.q){ $(\"#tbWhy\").innerHTML=res.why; toast(\"No further change needed\"); return false; }\n  st.revs=st.revs.slice(0,st.cur+1);\n  const label=String.fromCharCode(65+st.revs.length);\n  st.revs.push({label, p:res.q, why:res.why}); st.cur=st.revs.length-1; st.edited=false;\n  renderTests(); return true;\n}\nasync function saveRun(){\n  const sc=SC[TB.sc], st=scState(TB.sc), rv=st.revs[st.cur], m=matById(rv.p.mat), r=sc.calc(rv.p,m);\n  const rec={scenario:sc.name, rev:rv.label+(st.edited?\"*\":\"\"), inputs:rv.p, material:m.name, result:r.key, verdict:r.pass?\"PASS\":\"FAIL\", created:new Date().toISOString()};\n  await addRecord(\"runs\", rec, \"runs\");\n  toast(`Rev ${rec.rev} saved to Data`);\n}\nfunction buildTest(){\n  if(!V.ok) return;\n  disposeGroup(TB.group); V.tickers = V.tickers.filter(f=>!f.tb);\n  const p=curP(), m=matById(p.mat), r=SC[TB.sc].calc(p,m);\n  if(TB.sc===\"beam\") buildBeam(p,m,r); else if(TB.sc===\"gear\") buildGear(p,m,r); else if(TB.sc===\"arm\") buildArm(p,m,r); else buildRail(p,m,r);\n  applyDisplay(TB.group);\n}\nfunction buildBeam(p,m,r){\n  const L=p.L, b=p.b, h=p.h;\n  const wall = new THREE.Mesh(new THREE.BoxGeometry(20, 260, 220), new THREE.MeshStandardMaterial({color:0xa9a39a, roughness:.9}));\n  wall.position.set(-10, 0, 0); TB.group.add(wall);\n  const plate = new THREE.Mesh(new THREE.BoxGeometry(6, 70, Math.max(b+30,50)), steelMat()); plate.position.set(3,0,0); TB.group.add(withEdges(plate));\n  const nx=48, g=new THREE.BoxGeometry(L, h, b, nx, 4, 2); g.translate(L/2,0,0);\n  const pos=g.attributes.position, cols=new Float32Array(pos.count*3);\n  const wTip=r.d; const scale = wTip>0 ? Math.max(1, Math.min(200, Math.round(0.06*L/wTip))) : 1;\n  for(let i=0;i\u003cpos.count;i++){\n    const x=pos.getX(i), y=pos.getY(i);\n    const M=p.F*(L-x), s=Math.abs(M*y/r.I);\n    const c=rampColor(s/m.sy); cols[i*3]=c[0]; cols[i*3+1]=c[1]; cols[i*3+2]=c[2];\n    const w = p.F*x*x*(3*L-x)/(6*r.E*r.I);\n    pos.setY(i, y - w*scale);\n  }\n  g.setAttribute(\"color\", new THREE.BufferAttribute(cols,3)); g.computeVertexNormals();\n  const beam = new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, metalness:.1, roughness:.6, side:THREE.DoubleSide}));\n  beam.position.x=6; TB.group.add(withEdges(beam,0x22282e));\n  const tipY = -r.d*scale;\n  const blk = new THREE.Mesh(new THREE.BoxGeometry(60,40,60), new THREE.MeshStandardMaterial({color:0x4b5560, metalness:.4, roughness:.5}));\n  blk.position.set(6+L-30, tipY+h/2+20, 0); TB.group.add(withEdges(blk));\n  const kg = textSprite(`${fmt(p.F/9.81,0)} kg · ${p.F} N`,{scale:0.18}); kg.position.set(6+L-30, tipY+h/2+62, 0); TB.group.add(kg);\n  const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,-1,0), new THREE.Vector3(6+L, tipY+110, 0), 85, 0xb0261c, 18, 10); TB.group.add(arrow);\n  setLegend(true, `${fmt(m.sy,0)} MPa`, `${fmt(m.sy*.7,0)}`, `${fmt(m.sy*.4,0)}`, \"0\");\n  setHud(`von Mises ≈ bending σ\u003cbr>σmax ${fmt(r.sig,0)} MPa · δ ${fmt(r.d,2)} mm\u003cbr>Deflection shown ×${scale}`);\n}\nfunction gearGeom(z, mod, b, bore){\n  const rp=mod*z/2, ra=rp+mod, rf=rp-1.25*mod, pa=2*Math.PI/z;\n  const s=new THREE.Shape();\n  for(let i=0;i\u003cz;i++){\n    const c=i*pa, pts=[[rf,c-0.30*pa],[ra,c-0.13*pa],[ra,c+0.13*pa],[rf,c+0.30*pa],[rf,c+0.70*pa]];\n    pts.forEach(([r,t],j)=>{ const x=r*Math.cos(t), y=r*Math.sin(t); if(i===0&&j===0) s.moveTo(x,y); else s.lineTo(x,y); });\n  }\n  const h=new THREE.Path(); h.absarc(0,0,bore,0,Math.PI*2,true); s.holes.push(h);\n  const g=new THREE.ExtrudeGeometry(s,{depth:b, bevelEnabled:false, curveSegments:16}); g.translate(0,0,-b/2); return g;\n}\nfunction buildGear(p,m,r){\n  const z1=Math.max(6,Math.round(p.z1)), z2=Math.max(6,Math.round(p.z2));\n  const u=Math.min(1.2, r.util); const c=rampColor(u*0.9);\n  const pin=new THREE.Mesh(gearGeom(z1,p.m,p.b,Math.max(3,p.m*z1*0.15)), new THREE.MeshStandardMaterial({color:new THREE.Color(c[0],c[1],c[2]), metalness:.35, roughness:.45}));\n  const gear=new THREE.Mesh(gearGeom(z2,p.m,p.b,Math.max(4,p.m*z2*0.1)), steelMat(0xb7c0c9));\n  withEdges(pin); withEdges(gear);\n  const g1=new THREE.Group(), g2=new THREE.Group(); g1.add(pin); g2.add(gear); g2.position.x=r.a;\n  TB.group.add(g1); TB.group.add(g2);\n  const shaftL=p.b*3+40;\n  [[0,p.m*z1*0.15],[r.a,p.m*z2*0.1]].forEach(([x,rad])=>{ const s=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,shaftL,24), steelMat(0x8e979f)); s.rotation.x=Math.PI/2; s.position.set(x,0,-shaftL/2+p.b); TB.group.add(s); });\n  const motorR=Math.max(40,p.m*z1*0.9);\n  const motor=new THREE.Mesh(new THREE.CylinderGeometry(motorR,motorR,motorR*2.2,32), new THREE.MeshStandardMaterial({color:0x35618f, metalness:.3, roughness:.55}));\n  motor.rotation.x=Math.PI/2; motor.position.set(0,0,-shaftL+p.b-motorR*1.1); TB.group.add(withEdges(motor));\n  const ml=textSprite(`${p.P} kW · ${p.n1} rpm`,{scale:0.2}); ml.position.set(0,motorR+30,-shaftL+p.b-motorR); TB.group.add(ml);\n  const ol=textSprite(`${fmt(r.n2,0)} rpm out`,{scale:0.2}); ol.position.set(r.a, p.m*z2/2+p.m+30, 0); TB.group.add(ol);\n  const phase = Math.PI - Math.PI/z2;\n  let th=0; const w1 = 1.2*(p.n1/1450);\n  const tick = (dt)=>{ if(!reduced || DEMO.on) th += w1*dt*(DEMO.on||!reduced?1:0); g1.rotation.z = th; g2.rotation.z = phase - th*z1/z2; };\n  tick.tb=true; V.tickers.push(tick); tick(0);\n  setLegend(true, \"FoS \u003c req\", \"\", \"\", \"safe\");\n  setHud(`${z1}T → ${z2}T · m ${p.m} · a ${fmt(r.a,1)} mm\u003cbr>Pinion coloured by tooth stress use\u003cbr>FoS ${fmt(r.fos,2)} (need ${p.fos})`);\n}\nfunction buildRail(p,m,r){\n  const prof=new THREE.Shape(); [[-75,0],[75,0],[75,12],[8.25,30],[8.25,135],[36,140],[36,172],[-36,172],[-36,140],[-8.25,135],[-8.25,30],[-75,12]].forEach(([x,y],i)=> i?prof.lineTo(x,y):prof.moveTo(x,y));\n  const RL=1100, ex=10;\n  const railGeo=()=>{ const g=new THREE.ExtrudeGeometry(prof,{depth:RL,bevelEnabled:false}); g.rotateY(Math.PI/2); return g; };\n  const matL=new THREE.MeshStandardMaterial({color:0x9aa3ab, metalness:.45, roughness:.45}), matR=matL.clone();\n  const left=withEdges(new THREE.Mesh(railGeo(),matL)), right=withEdges(new THREE.Mesh(railGeo(),matR));\n  TB.group.add(left); TB.group.add(right);\n  for(let i=-3;i\u003c=3;i++){ const s=new THREE.Mesh(new THREE.BoxGeometry(250,200,700), new THREE.MeshStandardMaterial({color:0x8d8a83, roughness:.95})); s.position.set(i*600,-100,0); s.userData.noWire=true; TB.group.add(s); }\n  const fp=new THREE.Mesh(new THREE.BoxGeometry(600,90,14), steelMat(0x6f7881)); fp.position.set(0,82,-16); TB.group.add(withEdges(fp));\n  const tl=textSprite(\"\",{scale:0.5}); TB.group.add(tl);\n  const cold=new THREE.Color(0x3d7ad6), neutral=new THREE.Color(0x9aa3ab), hot=new THREE.Color(0xd9532b);\n  const update=(T)=>{\n    const gap = p.g - r.a*r.Lmm*(T-p.Ti); const vis=Math.max(0,gap)*ex;\n    left.position.x = -vis/2 - RL; right.position.x = vis/2;\n    const col = T>=p.Ti ? neutral.clone().lerp(hot, Math.min(1,(T-p.Ti)/Math.max(1,p.Tmax-p.Ti))) : neutral.clone().lerp(cold, Math.min(1,(p.Ti-T)/Math.max(1,p.Ti-p.Tmin)));\n    if(gap\u003c0) col.copy(new THREE.Color(0xb0261c));\n    matL.color.copy(col); matR.color.copy(col);\n    const sig = gap\u003c0 ? m.E*1000*(-gap)/r.Lmm : 0;\n    TB.group.remove(TB.group.userData.lab); const lab=textSprite(gap\u003c0?`CLOSED · ${fmt(sig,0)} MPa compression`:`gap ${fmt(gap,1)} mm`,{scale:0.5, color: gap\u003c0?\"#b0261c\":\"#111\"}); lab.position.set(0,320,0); TB.group.add(lab); TB.group.userData.lab=lab;\n    setHud(`Rail temp ${fmt(T,0)} °C · 60E1 profile\u003cbr>Joint gap ${fmt(gap,2)} mm (shown ×${ex})${gap\u003c0?`\u003cbr>Rails jammed: σ = ${fmt(sig,0)} MPa`:\"\"}`);\n  };\n  TB.group.remove(tl);\n  TB.railUpdate=update;\n  const T0 = TB.railT ?? p.Tmax; update(Math.max(p.Tmin,Math.min(p.Tmax,T0)));\n  setLegend(false);\n}\nfunction renderRailSlider(p){\n  let box=$(\"#railSliderBox\");\n  if(!box){ box=el(\"div\",{class:\"panel stack\",id:\"railSliderBox\"}); $(\"#testPanel\").insertBefore(box, $(\"#testPanel\").children[2]); }\n  const T = TB.railT ?? p.Tmax;\n  box.innerHTML=`\u003cdiv class=\"field\">\u003clabel for=\"railT\">Rail temperature now: \u003cb class=\"mono\" id=\"railTv\">${fmt(T,0)} °C\u003c/b>\u003c/label>\u003cinput id=\"railT\" type=\"range\" min=\"${p.Tmin}\" max=\"${p.Tmax}\" step=\"1\" value=\"${T}\" style=\"width:100%\">\u003c/div>`;\n  $(\"#railT\").addEventListener(\"input\",e=>{ TB.railT=+e.target.value; $(\"#railTv\").textContent=`${e.target.value} °C`; TB.railUpdate && TB.railUpdate(TB.railT); });\n}\nfunction armPoseTorque(p,r,t1d,t2d){\n  const g=9.81e-3, KGCM=98.0665, a1=t1d*Math.PI/180, a12=(t1d+t2d)*Math.PI/180;\n  const x1=p.L1*Math.cos(a1), c1=p.L1/2*Math.cos(a1), c2=x1+p.L2/2*Math.cos(a12), xt=x1+p.L2*Math.cos(a12);\n  const Ts=g*(r.m1*c1 + p.me*x1 + r.m2*c2 + r.tip*xt), Te=g*(r.m2*p.L2/2*Math.cos(a12) + r.tip*p.L2*Math.cos(a12));\n  return {Ts:Math.abs(Ts)/KGCM, Te:Math.abs(Te)/KGCM, x:xt, y:p.L1*Math.sin(a1)+p.L2*Math.sin(a12)};\n}\nfunction buildArm(p,m,r){\n  const H0=70, eff=p.rs>1?0.9:1;\n  const base=new THREE.Mesh(new THREE.CylinderGeometry(55,60,20,40), steelMat(0x3a4048)); base.position.y=10; TB.group.add(withEdges(base));\n  const turret=new THREE.Mesh(new THREE.CylinderGeometry(28,28,H0-20,32), steelMat(0xd8d2c4)); turret.position.y=20+(H0-20)/2; TB.group.add(withEdges(turret));\n  const inner=Math.abs(p.L1-p.L2), outer=p.L1+p.L2;\n  const ring=new THREE.Mesh(new THREE.RingGeometry(Math.max(1,inner), outer, 96, 1, -Math.PI/6, Math.PI*7/6), new THREE.MeshBasicMaterial({color:0x2f6fd6, transparent:true, opacity:0.08, side:THREE.DoubleSide, depthWrite:false}));\n  ring.userData.noWire=true; ring.position.set(0,H0,-p.w); TB.group.add(ring);\n  const arc=[]; for(let i=0;i\u003c=64;i++){ const t=-Math.PI/6+Math.PI*7/6*i/64; arc.push(new THREE.Vector3(p.reach*Math.cos(t), H0+p.reach*Math.sin(t), -p.w)); }\n  TB.group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arc), new THREE.LineDashedMaterial({color:0xb0261c, dashSize:8, gapSize:6})).computeLineDistances());\n  const rl=textSprite(`required reach ${p.reach} mm`,{scale:0.16, color:\"#b0261c\"}); rl.position.set(p.reach*0.72, H0+p.reach*0.78, -p.w); TB.group.add(rl);\n  const sh=new THREE.Group(); sh.position.set(0,H0,0); TB.group.add(sh);\n  const cS=rampColor(Math.min(1.2,r.uS)*0.9), cE=rampColor(Math.min(1.2,r.uE)*0.9);\n  const servoM=new THREE.MeshStandardMaterial({color:0x22272c, metalness:.2, roughness:.6});\n  const sS=new THREE.Mesh(new THREE.BoxGeometry(40,40,p.w+16), servoM); sh.add(withEdges(sS,0x555555));\n  if(p.rs>1){ const pul=new THREE.Mesh(new THREE.CylinderGeometry(14*p.rs,14*p.rs,8,40), steelMat(0x8e979f)); pul.rotation.x=Math.PI/2; pul.position.z=(p.w+16)/2+6; sh.add(withEdges(pul)); const lb=textSprite(`${p.rs}:1 reduction`,{scale:0.14}); lb.position.set(0,-14*p.rs-14,(p.w+16)/2+6); sh.add(lb); }\n  const l1=new THREE.Mesh(new THREE.BoxGeometry(p.L1,p.hgt,p.w), new THREE.MeshStandardMaterial({color:new THREE.Color(...cS), roughness:.7})); l1.position.x=p.L1/2; sh.add(withEdges(l1));\n  const el=new THREE.Group(); el.position.x=p.L1; sh.add(el);\n  const sE=new THREE.Mesh(new THREE.BoxGeometry(34,34,p.w+14), servoM); el.add(withEdges(sE,0x555555));\n  const l2=new THREE.Mesh(new THREE.BoxGeometry(p.L2,p.hgt*0.85,p.w*0.9), new THREE.MeshStandardMaterial({color:new THREE.Color(...cE), roughness:.7})); l2.position.x=p.L2/2; el.add(withEdges(l2));\n  const palm=new THREE.Mesh(new THREE.BoxGeometry(16,34,p.w+10), servoM); palm.position.x=p.L2+8; el.add(withEdges(palm,0x555555));\n  [-1,1].forEach(sgn=>{ const f=new THREE.Mesh(new THREE.BoxGeometry(34,6,8), steelMat(0xd8d2c4)); f.position.set(p.L2+32, sgn*12, 0); el.add(withEdges(f)); });\n  const cube=Math.cbrt(Math.max(p.mp,1)/1.2)*1.6; const pay=new THREE.Mesh(new THREE.BoxGeometry(cube,cube,cube), new THREE.MeshStandardMaterial({color:0xd9822b, roughness:.6})); pay.position.set(p.L2+34,0,0); el.add(withEdges(pay));\n  const pl=textSprite(`${p.mp} g`,{scale:0.14}); pl.position.set(p.L2+34, cube/2+16, 0); el.add(pl);\n  const floor=new THREE.Mesh(new THREE.PlaneGeometry(900,500), new THREE.MeshStandardMaterial({color:0xb9b2a6, roughness:1, side:THREE.DoubleSide})); floor.rotation.x=-Math.PI/2; floor.position.set(150,0,0); floor.userData.noWire=true; TB.group.add(floor);\n  TB.armRefs={sh, el};\n  TB.armPose = TB.armPose || {t1:0, t2:0};\n  applyArmPose(p,r);\n  setLegend(true,\"100%+\",\"\",\"\",\"0%\");\n}\nfunction applyArmPose(p,r){\n  const ps=TB.armPose||{t1:0,t2:0};\n  if(TB.armRefs){ TB.armRefs.sh.rotation.z=ps.t1*Math.PI/180; TB.armRefs.el.rotation.z=ps.t2*Math.PI/180; }\n  const pt=armPoseTorque(p,r,ps.t1,ps.t2);\n  const allowS=p.stall*p.rs*(p.rs>1?0.9:1)/p.fos, allowE=p.stall*p.re*(p.re>1?0.9:1)/p.fos;\n  setHud(`Pose: shoulder ${ps.t1}°, elbow ${ps.t2}°\u003cbr>Static shoulder ${fmt(pt.Ts,2)} kg·cm (${fmt(pt.Ts/allowS*100,0)}% of allowed)\u003cbr>Static elbow ${fmt(pt.Te,2)} kg·cm (${fmt(pt.Te/allowE*100,0)}%)\u003cbr>Links coloured by worst-case joint use`);\n  const o=$(\"#armPoseOut\"); if(o) o.textContent=`Tip at x ${fmt(pt.x,0)} mm, y ${fmt(pt.y,0)} mm · static shoulder ${fmt(pt.Ts/allowS*100,0)}% · elbow ${fmt(pt.Te/allowE*100,0)}% of allowed`;\n}\nfunction renderArmSliders(p,m,r){\n  const box=el(\"div\",{class:\"panel stack\",id:\"armSliderBox\"});\n  const ps=TB.armPose||(TB.armPose={t1:0,t2:0});\n  box.innerHTML=`\u003ch3>Move the joints\u003c/h3>\n   \u003cdiv class=\"field\">\u003clabel for=\"armT1\">Shoulder angle: \u003cb class=\"mono\" id=\"armT1v\">${ps.t1}°\u003c/b> (0° = horizontal)\u003c/label>\u003cinput id=\"armT1\" type=\"range\" min=\"-10\" max=\"170\" step=\"1\" value=\"${ps.t1}\" style=\"width:100%\">\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"armT2\">Elbow angle: \u003cb class=\"mono\" id=\"armT2v\">${ps.t2}°\u003c/b> (relative to upper arm)\u003c/label>\u003cinput id=\"armT2\" type=\"range\" min=\"-150\" max=\"150\" step=\"1\" value=\"${ps.t2}\" style=\"width:100%\">\u003c/div>\n   \u003cp class=\"mono\" id=\"armPoseOut\" style=\"font-size:.8rem\">\u003c/p>\n   \u003cp class=\"src\">The checks use the worst case: arm straight out and horizontal. Raise the arm and watch the holding torque drop with cos θ.\u003c/p>`;\n  $(\"#testPanel\").insertBefore(box, $(\"#testPanel\").children[2]);\n  const upd=()=>{ ps.t1=+$(\"#armT1\").value; ps.t2=+$(\"#armT2\").value; $(\"#armT1v\").textContent=ps.t1+\"°\"; $(\"#armT2v\").textContent=ps.t2+\"°\"; applyArmPose(p,r); };\n  $(\"#armT1\").addEventListener(\"input\",upd); $(\"#armT2\").addEventListener(\"input\",upd);\n  applyArmPose(p,r);\n}\nfunction selectScenario(id){\n  TB.sc=id; TB.railT=null;\n  document.querySelectorAll(\"#scenarioSeg button\").forEach(b=>b.setAttribute(\"aria-pressed\", b.dataset.sc===id?\"true\":\"false\"));\n  renderTests();\n  if(V.ok) frameObject(TB.group, TB.sc===\"rail\"?\"iso\":\"iso\");\n}\n\n/* ============================== TRENDS / CAREER / DATA RENDER ============================== */\nfunction renderTrends(){\n  const grid=$(\"#trendGrid\"); grid.innerHTML=\"\";\n  BUILTIN_TRENDS.forEach(t=>{\n    const c=el(\"article\",{class:\"panel trend\"});\n    c.innerHTML=`\u003cspan class=\"meta\">${esc(t.tag)}\u003c/span>\u003ch3>${esc(t.title)}\u003c/h3>\u003cp>${esc(t.body)}\u003c/p>\u003cp class=\"why\">\u003cb>Why it matters for you:\u003c/b> ${esc(t.why)}\u003c/p>\n    \u003cdiv class=\"foot\">\u003ca class=\"btn small\" href=\"#${t.link}\">${esc(t.linkText)}\u003c/a>\u003ca href=\"${t.src}\" target=\"_blank\" rel=\"noopener\">Source: ${esc(t.srcName)}\u003c/a>\u003c/div>`;\n    grid.appendChild(c);\n  });\n  S.userTrends.forEach(t=>{\n    const c=el(\"article\",{class:\"panel trend user\"}); const u=safeUrl(t.source);\n    c.innerHTML=`\u003cspan class=\"meta\">Added by you\u003c/span>\u003ch3>${esc(t.title)}\u003c/h3>\u003cp>${esc(t.note)}\u003c/p>\u003cdiv class=\"foot\">${u?`\u003ca href=\"${esc(u)}\" target=\"_blank\" rel=\"noopener\">Source\u003c/a>`:\"\u003cspan>\u003c/span>\"}\u003cbutton class=\"btn small\" data-del-trend=\"${esc(t.id)}\" type=\"button\">Remove\u003c/button>\u003c/div>`;\n    grid.appendChild(c);\n  });\n  grid.querySelectorAll(\"[data-del-trend]\").forEach(b=>b.addEventListener(\"click\",()=>delRecord(\"trends\",b.dataset.delTrend,\"userTrends\")));\n}\nconst STATUS_NEXT={todo:\"booked\", booked:\"done\", done:\"todo\"}; const STATUS_LABEL={todo:\"To do\", booked:\"Booked\", done:\"Done\"};\nfunction renderCareer(){\n  const list=$(\"#certList\"); list.innerHTML=\"\";\n  const certs = BUILTIN_CERTS.concat(S.userCerts.map(c=>({...c, tier:\"mine\", user:true})));\n  const tiers = {...TIERS, mine:[\"Added by you\",\"Your list\"]};\n  Object.keys(tiers).forEach(tk=>{\n    const items=certs.filter(c=>c.tier===tk); if(!items.length) return;\n    list.appendChild(el(\"div\",{class:\"tierhead\"},`\u003ch3>${esc(tiers[tk][0])}\u003c/h3>\u003cspan class=\"chip ${tk===\"role\"?\"fail\":tk===\"step\"?\"warn\":\"info\"}\">${esc(tiers[tk][1])}\u003c/span>`));\n    items.forEach(c=>{\n      const s=S.careerStatus[c.id]||\"todo\";\n      const row=el(\"div\",{class:\"cert\"});\n      row.innerHTML=`\u003cdiv>\u003ch3>${esc(c.name)}\u003c/h3>\u003cdiv class=\"facts\">${esc(c.cost||\"\")}${c.time?\" · \"+esc(c.time):\"\"}\u003c/div>\u003c/div>\n       \u003cdiv style=\"display:flex;gap:6px;align-items:start\">\u003cbutton class=\"statusbtn\" type=\"button\" data-s=\"${s}\" data-id=\"${esc(c.id)}\" aria-label=\"Status for ${esc(c.name)}: ${STATUS_LABEL[s]}\">${STATUS_LABEL[s]}\u003c/button>${c.user?`\u003cbutton class=\"btn small\" type=\"button\" data-del-cert=\"${esc(c.id)}\">Remove\u003c/button>`:\"\"}\u003c/div>\n       \u003cp>${esc(c.why||\"\")}\u003c/p>`;\n      list.appendChild(row);\n    });\n  });\n  list.querySelectorAll(\".statusbtn\").forEach(b=>b.addEventListener(\"click\",()=>{ const id=b.dataset.id; S.careerStatus[id]=STATUS_NEXT[S.careerStatus[id]||\"todo\"]; saveCareer(); renderCareer(); }));\n  list.querySelectorAll(\"[data-del-cert]\").forEach(b=>b.addEventListener(\"click\",()=>delRecord(\"certs\",b.dataset.delCert,\"userCerts\")));\n  const hl=$(\"#hireList\"); hl.innerHTML=\"\";\n  HIRING.forEach(h=>{\n    const row=el(\"label\",{class:\"check\"}); const chk=!!S.hireStatus[h.id];\n    row.innerHTML=`\u003cinput type=\"checkbox\" ${chk?\"checked\":\"\"} data-h=\"${h.id}\">\u003cspan>${esc(h.text)}\u003c/span>`;\n    hl.appendChild(row);\n  });\n  hl.querySelectorAll(\"input\").forEach(i=>i.addEventListener(\"change\",()=>{ S.hireStatus[i.dataset.h]=i.checked; saveCareer(); renderCareerProgress(); }));\n  renderCareerProgress();\n}\nfunction renderCareerProgress(){\n  const certs = BUILTIN_CERTS.concat(S.userCerts);\n  const total = certs.length + HIRING.length;\n  const done = certs.filter(c=>S.careerStatus[c.id]===\"done\").length + HIRING.filter(h=>S.hireStatus[h.id]).length;\n  const booked = certs.filter(c=>S.careerStatus[c.id]===\"booked\").length;\n  const pct = total? Math.round(done/total*100):0;\n  $(\"#careerBar\").style.width=pct+\"%\";\n  $(\"#careerPct\").textContent=`${done} of ${total} done · ${booked} booked · ${pct}%`;\n}\nfunction renderData(){\n  const mt=$(\"#matTable\");\n  mt.innerHTML=`\u003ctr>\u003cth>Material\u003c/th>\u003cth class=\"num\">E GPa\u003c/th>\u003cth class=\"num\">σy MPa\u003c/th>\u003cth class=\"num\">ρ\u003c/th>\u003cth class=\"num\">α\u003c/th>\u003cth>\u003c/th>\u003c/tr>`+\n   allMaterials().map(m=>`\u003ctr>\u003ctd>${esc(m.name)}\u003cdiv class=\"src\">${esc(m.note||\"\")}${m.user?\" · yours\":\"\"}\u003c/div>\u003c/td>\u003ctd class=\"num mono\">${fmt(m.E,1)}\u003c/td>\u003ctd class=\"num mono\">${fmt(m.sy,0)}\u003c/td>\u003ctd class=\"num mono\">${fmt(m.rho,2)}\u003c/td>\u003ctd class=\"num mono\">${fmt(m.alpha,1)}\u003c/td>\u003ctd>${m.user?`\u003cbutton class=\"btn small\" type=\"button\" data-del-mat=\"${esc(m.id)}\">Remove\u003c/button>`:\"\"}\u003c/td>\u003c/tr>`).join(\"\");\n  mt.querySelectorAll(\"[data-del-mat]\").forEach(b=>b.addEventListener(\"click\",()=>delRecord(\"materials\",b.dataset.delMat,\"userMaterials\")));\n  const rt=$(\"#runTable\");\n  const runs=[...S.runs].sort((a,b)=>String(b.created).localeCompare(String(a.created)));\n  rt.innerHTML = runs.length ? `\u003ctr>\u003cth>When\u003c/th>\u003cth>Case\u003c/th>\u003cth>Rev\u003c/th>\u003cth>Result\u003c/th>\u003cth>\u003c/th>\u003c/tr>`+runs.map(r=>`\u003ctr>\u003ctd class=\"mono\" style=\"font-size:.76rem\">${esc(String(r.created||\"\").slice(0,16).replace(\"T\",\" \"))}\u003c/td>\u003ctd>${esc(r.scenario)}\u003c/td>\u003ctd class=\"mono\">${esc(r.rev)}\u003c/td>\u003ctd style=\"font-size:.8rem\">${esc(r.result)} \u003cspan class=\"chip ${r.verdict===\"PASS\"?\"pass\":\"fail\"}\">${esc(r.verdict)}\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"btn small\" type=\"button\" data-del-run=\"${esc(r.id)}\">Remove\u003c/button>\u003c/td>\u003c/tr>`).join(\"\")\n   : `\u003ctr>\u003ctd style=\"color:var(--muted)\">No saved revisions yet. On the Test bench, press \"Save revision\" to log one here.\u003c/td>\u003c/tr>`;\n  rt.querySelectorAll(\"[data-del-run]\").forEach(b=>b.addEventListener(\"click\",()=>delRecord(\"runs\",b.dataset.delRun,\"runs\")));\n}\nfunction renderAllData(){ renderTrends(); renderCareer(); renderData(); renderLevelChip(); if(S.tab===\"path\") renderPathLadder(); if(S.tab===\"cad\") renderCadPanel(); if(S.tab===\"tests\") renderTests(); }\n\n/* ============================== PATH + QUIZ RENDER ============================== */\nfunction renderLevelChip(){\n  const lv=level(); $(\"#levelChip\").innerHTML=`Level \u003cb>${mastered()?\"Advanced ✓\":LEVELS[lv-1]}\u003c/b>`;\n  document.querySelectorAll(\"#scenarioSeg button\").forEach(b=>{ const n=SC_LEVEL[b.dataset.sc]; const lab={beam:\"Shelf bracket\",gear:\"Gear drive\",rail:\"Rail in summer\",arm:\"Robot arm\"}[b.dataset.sc]; b.innerHTML = esc(lab) + (unlocked(n)?\"\":`\u003cspan class=\"lk\">L${n}\u003c/span>`); });\n  const sb=$(\"#sectionBtn\"); if(sb){ sb.disabled=!unlocked(2); sb.title=unlocked(2)?\"Cut the part at the flange hole\":\"Unlocks at Intermediate\"; }\n  $(\"#freeMode\").checked=!!P.free;\n}\nfunction renderPathLadder(){\n  const lv=level(), box=$(\"#pathLadder\"); box.innerHTML=\"\";\n  [1,2,3].forEach(n=>{\n    const tasks=PATH_TASKS[n], done=tasks.filter(t=>taskDone(t.id)).length, complete=done===tasks.length && (n\u003c3 || mastered());\n    const state = n\u003clv || (n===3&&mastered()) ? \"done\" : (n===lv ? \"current\" : \"locked\");\n    const c=el(\"div\",{class:`panel lvl ${state}`});\n    c.innerHTML=`\u003cspan class=\"tag\">Level ${n} · ${state===\"done\"?\"Complete\":state===\"current\"?\"You are here\":\"Locked\"}\u003c/span>\u003ch3>${LEVELS[n-1]}\u003c/h3>\n      \u003cdiv class=\"stack\" style=\"gap:6px\">${tasks.map(t=>{ const ok=taskDone(t.id); return `\u003cdiv class=\"task ${ok?\"ok\":\"\"}\">\u003cspan class=\"box\">${ok?\"✓\":\"\"}\u003c/span>\u003cspan>${esc(t.text)}${t.id===\"runs3\"?` (${Math.min(3,S.runs.length)}/3)`:\"\"}${/^cp/.test(t.id)&&P.quiz[t.id]!=null?` · best ${P.quiz[t.id]}/5`:\"\"}\u003c/span>\u003c/div>`; }).join(\"\")}\u003c/div>\n      \u003cp class=\"src\">${done}/${tasks.length} tasks${n\u003c3?` · finishing these unlocks ${LEVELS[n]}`:\" · finishing these completes the path\"}\u003c/p>\n      \u003cdiv>\u003cb style=\"font-size:.8rem\">This level opens:\u003c/b>\u003cul class=\"unlocks\">${UNLOCKS[n].map(u=>`\u003cli>${esc(u)}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>`;\n    box.appendChild(c);\n  });\n}\nfunction renderQuiz(host, key, title, sub){\n  const qs=QUIZ[key];\n  host.innerHTML=`\u003ch3>${esc(title)}\u003c/h3>\u003cp style=\"font-size:.86rem;color:var(--muted);margin-bottom:8px\">${esc(sub)}\u003c/p>`+\n    qs.map((q,i)=>`\u003cfieldset class=\"q\">\u003clegend>${i+1}. ${esc(q.q)}\u003c/legend>${q.o.map((o,j)=>`\u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"${key}-${i}\" value=\"${j}\">\u003cspan>${esc(o)}\u003c/span>\u003c/label>`).join(\"\")}\u003cp class=\"expl\" hidden>\u003c/p>\u003c/fieldset>`).join(\"\")+\n    `\u003cdiv class=\"stepper\">\u003cbutton class=\"btn primary\" type=\"button\" data-mark>Mark my answers\u003c/button>\u003cspan class=\"mono\" data-score style=\"font-size:.82rem\">${P.quiz[key]!=null?`Best so far: ${P.quiz[key]}/${qs.length}`:\"\"}\u003c/span>\u003c/div>`;\n  host.querySelector(\"[data-mark]\").addEventListener(\"click\",()=>{\n    let sc=0; const fss=host.querySelectorAll(\"fieldset\");\n    qs.forEach((q,i)=>{ const sel=host.querySelector(`input[name=\"${key}-${i}\"]:checked`); const ok=!!sel && +sel.value===q.a; if(ok) sc++;\n      fss[i].classList.toggle(\"right\",ok); fss[i].classList.toggle(\"wrong\",!ok);\n      const ex=fss[i].querySelector(\".expl\"); ex.hidden=false; ex.innerHTML=`\u003cb>${ok?\"Correct.\":(sel?\"Not quite.\":\"No answer.\")+\" Answer: \"+esc(q.o[q.a])+\".\"}\u003c/b> ${esc(q.e)}`; });\n    const before=level();\n    if(!DEMO.on){ P.quiz[key]=Math.max(P.quiz[key]||0,sc); saveProgress(); }\n    host.querySelector(\"[data-score]\").textContent=`Score ${sc}/${qs.length}${sc>=4?\" · passed\":\" · 4 needed to pass\"} · best ${P.quiz[key]||sc}`;\n    afterProgress(before);\n  });\n}\nfunction renderPathQuizzes(){\n  const box=$(\"#pathQuizzes\"); box.innerHTML=\"\";\n  const lv=level();\n  [[\"cp1\",1,\"Checkpoint 1: Beginner\",\"Statics, CAD states, thermal expansion. 4 out of 5 to pass.\"],[\"cp2\",2,\"Checkpoint 2: Intermediate\",\"Gears, fits and thermal stress.\"],[\"cp3\",3,\"Checkpoint 3: Advanced\",\"Robot arm torque, reductions, backlash and design sweeps.\"]].forEach(([k,n,t,sub])=>{\n    const host=el(\"div\",{class:\"panel\"});\n    if(lv>=n || P.free) renderQuiz(host,k,t,sub); else host.innerHTML=`\u003cspan class=\"chip warn\">Unlocks at ${LEVELS[n-1]}\u003c/span> \u003cb>${esc(t)}\u003c/b>`;\n    box.appendChild(host);\n  });\n}\nfunction renderInterview(){\n  const box=$(\"#interviewBox\"); if(!box) return;\n  if(!unlocked(2)){ box.innerHTML=`\u003cdiv class=\"panel lock\">\u003cspan class=\"chip warn\">Unlocks at Intermediate\u003c/span>\u003ch3>Interview practice quiz\u003c/h3>\u003cp style=\"font-size:.88rem\">Six technical assessment questions: thermoforming defects, measuring and lock-out.\u003c/p>\u003c/div>`; return; }\n  const host=el(\"div\",{class:\"panel\"}); box.innerHTML=\"\"; box.appendChild(host);\n  renderQuiz(host,\"interview\",\"Interview practice: technical assessment\",\"Thermoforming defects, measuring instruments and safe isolation.\");\n}\n\n/* ============================== STORAGE ============================== */\nconst LKEY=\"dailycoach.lab.v1\"; let LOCAL_OK=false;\ntry{ localStorage.setItem(LKEY+\".t\",\"1\"); localStorage.removeItem(LKEY+\".t\"); LOCAL_OK=true; }catch(e){}\nfunction localSave(){ if(!LOCAL_OK) return; try{ localStorage.setItem(LKEY, JSON.stringify({userMaterials:S.userMaterials,userTrends:S.userTrends,runs:S.runs,userCerts:S.userCerts,careerStatus:S.careerStatus,hireStatus:S.hireStatus,progress:{done:P.done,quiz:P.quiz,free:P.free}})); }catch(e){} }\nfunction localLoad(){ if(!LOCAL_OK) return; let d=null; try{ d=JSON.parse(localStorage.getItem(LKEY)||\"null\"); }catch(e){} if(!d) return;\n  const before=level(); [\"userMaterials\",\"userTrends\",\"runs\",\"userCerts\"].forEach(k=>{ if(Array.isArray(d[k])) S[k]=d[k]; });\n  if(d.careerStatus) S.careerStatus=d.careerStatus; if(d.hireStatus) S.hireStatus=d.hireStatus;\n  if(d.progress){ P.done=d.progress.done||{}; P.quiz=d.progress.quiz||{}; P.free=!!d.progress.free; const fm=$(\"#freeMode\"); if(fm) fm.checked=P.free; }\n  afterProgress(before); renderAllData(); renderCareer(); if(S.tab===\"tests\") renderTests(); }\nfunction setStore(kind){\n  S.store=kind;\n  const dot=$(\"#storeDot\"), t=$(\"#storeText\");\n  if(kind===\"local\"){ dot.className=\"dot ok\"; t.textContent=\"Saved in this browser, with your coach data\"; $(\"#tbData\").textContent=\"Saved on this device\"; return; }\n  if(kind===\"cloud\"){ dot.className=\"dot ok\"; t.textContent=\"Saved to this artifact's database\"; $(\"#tbData\").textContent=\"Saved online\"; }\n  else { dot.className=\"dot bad\"; t.textContent=\"Not saved between visits here: export a backup before closing\"; $(\"#tbData\").textContent=\"This visit only\"; }\n}\nconst COL_KEY={materials:\"userMaterials\", trends:\"userTrends\", runs:\"runs\", certs:\"userCerts\"};\nfunction localId(){ return \"l\"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }\nasync function addRecord(col, rec, key){\n  key = key || COL_KEY[col];\n  if(S.db){\n    try{ await S.db.collection(col).add(rec); return true; }\n    catch(e){ if(e&&e.code===\"quota_exceeded\") toast(\"Database is full: remove old records first\"); else toast(\"Could not save: \"+(e&&e.message||\"error\")); return false; }\n  }\n  S[key]=S[key].concat([{...rec, id:localId()}]); localSave(); renderAllData(); return true;\n}\nasync function delRecord(col, id, key){\n  if(S.db && !String(id).startsWith(\"l\")){ try{ await S.db.collection(col).doc(id).delete(); }catch(e){ toast(\"Could not remove: \"+(e&&e.message||\"error\")); } }\n  else { S[key]=S[key].filter(x=>x.id!==id); localSave(); renderAllData(); }\n}\nlet careerChain=Promise.resolve(), careerTimer=null;\nfunction saveCareer(){\n  if(!S.db){ localSave(); return; }\n  clearTimeout(careerTimer);\n  careerTimer=setTimeout(()=>{ const body={map:{...S.careerStatus}, hire:{...S.hireStatus}, updated:new Date().toISOString()}; careerChain=careerChain.then(()=>S.db.doc(\"career/status\").set(body)).catch(e=>toast(\"Could not save progress\")); }, 500);\n}\nlet progChain=Promise.resolve(), progTimer=null;\nfunction saveProgress(){\n  if(!S.db){ localSave(); return; }\n  clearTimeout(progTimer);\n  progTimer=setTimeout(()=>{ const body={done:{...P.done}, quiz:{...P.quiz}, free:!!P.free, updated:new Date().toISOString()}; progChain=progChain.then(()=>S.db.doc(\"progress/state\").set(body)).catch(()=>toast(\"Could not save progress\")); }, 500);\n}\nasync function initStore(){\n  let db=null;\n  try{ if(window.claude && typeof window.claude.use===\"function\"){ db = await window.claude.use(\"db\"); } }catch(e){ db=null; }\n  if(!db){ localLoad(); setStore(LOCAL_OK?\"local\":\"none\"); }\n  else {\n    S.db=db; setStore(\"cloud\");\n    const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id, ...d.data()})); renderAllData(); }, err=>{ if(err&&err.code===\"revoked\"){ S.db=null; setStore(\"none\"); } });\n    sub(\"materials\",\"userMaterials\"); sub(\"trends\",\"userTrends\"); sub(\"runs\",\"runs\"); sub(\"certs\",\"userCerts\");\n    db.doc(\"progress/state\").onSnapshot(d=>{ if(!d.exists) return; const x=d.data()||{}; const before=level(); P.done={...(x.done||{})}; P.quiz={...(x.quiz||{})}; P.free=!!x.free; afterProgress(before); if(S.tab===\"tests\") renderTests(); }, ()=>{});\n    db.doc(\"career/status\").onSnapshot(d=>{ if(d.exists){ const x=d.data()||{}; S.careerStatus={...(x.map||{})}; S.hireStatus={...(x.hire||{})}; } renderCareer(); }, ()=>{});\n  }\n  try{ if(window.claude && typeof window.claude.use===\"function\"){ S.downloads = await window.claude.use(\"downloads\"); } }catch(e){ S.downloads=null; }\n  $(\"#dlJson\").hidden = !S.downloads; $(\"#dlCsv\").hidden = !S.downloads;\n}\nfunction exportJson(){\n  const strip = arr => arr.map(({id,user,...rest})=>rest);\n  return JSON.stringify({version:1, exported:new Date().toISOString(), materials:strip(S.userMaterials), trends:strip(S.userTrends), runs:strip(S.runs), certs:strip(S.userCerts), careerStatus:S.careerStatus, hireStatus:S.hireStatus, progress:{done:P.done, quiz:P.quiz, free:P.free}}, null, 2);\n}\nfunction exportCsv(){\n  const q=v=>`\"${String(v??\"\").replace(/\"/g,'\"\"')}\"`;\n  const rows=[[\"created\",\"case\",\"revision\",\"material\",\"result\",\"verdict\"]].concat([...S.runs].sort((a,b)=>String(a.created).localeCompare(String(b.created))).map(r=>[r.created,r.scenario,r.rev,r.material,r.result,r.verdict]));\n  return rows.map(r=>r.map(q).join(\",\")).join(\"\\r\\n\");\n}\nfunction num(v){ const n=parseFloat(v); return isFinite(n)?n:NaN; }\nasync function importJson(text){\n  let d; try{ d=JSON.parse(text); }catch(e){ toast(\"That is not valid JSON. Check you pasted the whole backup.\"); return; }\n  if(!d || typeof d!==\"object\"){ toast(\"Backup format not recognised\"); return; }\n  let n=0;\n  for(const m of (Array.isArray(d.materials)?d.materials:[])){ const rec={name:String(m.name||\"\").slice(0,80), E:num(m.E), sy:num(m.sy), rho:num(m.rho), alpha:num(m.alpha), note:String(m.note||\"\").slice(0,120)}; if(rec.name && rec.E>0 && rec.sy>0 && rec.rho>0 && rec.alpha>=0){ await addRecord(\"materials\",rec); n++; } }\n  for(const t of (Array.isArray(d.trends)?d.trends:[])){ if(t&&t.title){ await addRecord(\"trends\",{title:String(t.title).slice(0,120), note:String(t.note||\"\").slice(0,600), source:safeUrl(t.source||\"\")}); n++; } }\n  for(const c of (Array.isArray(d.certs)?d.certs:[])){ if(c&&c.name){ await addRecord(\"certs\",{name:String(c.name).slice(0,120), cost:String(c.cost||\"\").slice(0,60), time:String(c.time||\"\").slice(0,60), why:String(c.why||\"\").slice(0,600)}); n++; } }\n  for(const r of (Array.isArray(d.runs)?d.runs:[])){ if(r&&r.scenario){ await addRecord(\"runs\",{scenario:String(r.scenario), rev:String(r.rev||\"\"), inputs:r.inputs||{}, material:String(r.material||\"\"), result:String(r.result||\"\"), verdict:r.verdict===\"PASS\"?\"PASS\":\"FAIL\", created:String(r.created||new Date().toISOString())}); n++; } }\n  if(d.careerStatus && typeof d.careerStatus===\"object\"){ for(const k in d.careerStatus){ if([\"todo\",\"booked\",\"done\"].includes(d.careerStatus[k])) S.careerStatus[k]=d.careerStatus[k]; } }\n  if(d.hireStatus && typeof d.hireStatus===\"object\"){ for(const k in d.hireStatus){ S.hireStatus[k]=!!d.hireStatus[k]; } }\n  if(d.progress && typeof d.progress===\"object\"){ const before=level(); for(const k in (d.progress.done||{})) if(d.progress.done[k]) P.done[k]=true; for(const k in (d.progress.quiz||{})){ const v=num(d.progress.quiz[k]); if(v>=0) P.quiz[k]=Math.max(P.quiz[k]||0,Math.min(6,v)); } saveProgress(); afterProgress(before); }\n  saveCareer(); renderAllData();\n  toast(`Imported ${n} records`);\n}\n\n/* ============================== ROUTING ============================== */\nconst TABS=[\"trends\",\"path\",\"cad\",\"tests\",\"career\",\"data\"];\nfunction go(tab){\n  if(!TABS.includes(tab)) tab=\"trends\";\n  S.tab=tab;\n  document.querySelectorAll(\"section.view\").forEach(s=>s.classList.toggle(\"active\", s.id===\"view-\"+tab));\n  document.querySelectorAll(\"nav.tabs a\").forEach(a=>a.setAttribute(\"aria-current\", a.dataset.tab===tab?\"page\":\"false\"));\n  if(tab===\"path\"){ renderPathLadder(); renderPathQuizzes(); }\n  if(tab===\"cad\"){ renderFits(); placeViewport(\"slot-cad\"); $(\"#planesBtn\").hidden=false; $(\"#sectionBtn\").hidden=false; $(\"#displaySeg\").hidden=false; if(V.ok){ V.scene=CAD.scene; setLegend(false); } renderCadPanel(); if(V.ok) frameObject(CAD.root, CAD.view, false); }\n  else if(tab===\"tests\"){ placeViewport(\"slot-tests\"); $(\"#planesBtn\").hidden=true; $(\"#sectionBtn\").hidden=true; if(V.ok){ V.scene=TB.scene; } renderTests(); if(V.ok) frameObject(TB.group,\"iso\",false); }\n  else if(tab===\"career\"){ renderCareer(); renderInterview(); }\n  else if(tab===\"data\") renderData();\n  if(!V.ok) setHud(\"\");\n  try{ parent.postMessage({labTab:tab},\"*\"); }catch(e){}\n}\n\n/* ============================== DEMO ============================== */\nconst DEMO={on:false, token:0};\nconst sleep=(ms,tok)=>new Promise((res,rej)=>setTimeout(()=>{ if(tok!==DEMO.token) rej(\"stop\"); else res(); }, ms));\nfunction cap(t){ $(\"#demoCap\").textContent=t; }\nasync function runDemo(){\n  const tok=++DEMO.token; DEMO.on=true; renderLevelChip(); $(\"#demobar\").style.display=\"flex\"; $(\"#demoBtn\").textContent=\"Stop demo\"; $(\"#demoBtn\").classList.add(\"demo-on\");\n  try{\n    cap(\"CAD theory: building bracket MB-01 one feature at a time\"); go(\"cad\"); cadSet(0); await sleep(2600,tok);\n    for(let k=1;k\u003cCAD_STEPS.length;k++){ cadSet(k); cap(`${CAD_STEPS[k].name}: ${CAD_STEPS[k].title}`); await sleep(3000,tok); }\n    cap(\"Test bench: the shelf bracket starts as Rev A and fails\"); go(\"tests\"); delete TB.state.beam; selectScenario(\"beam\"); await sleep(3200,tok);\n    for(let i=0;i\u003c4;i++){ if(!improveStep()) break; const rv=scState(\"beam\"); cap(`Shelf bracket Rev ${rv.revs[rv.cur].label}: ${rv.revs[rv.cur].why.replace(/\u003c[^>]+>/g,\"\").slice(0,110)}…`); await sleep(3800,tok); }\n    cap(\"Gear drive: wrong speed, undercut pinion, weak teeth\"); delete TB.state.gear; selectScenario(\"gear\"); await sleep(3400,tok);\n    for(let i=0;i\u003c4;i++){ if(!improveStep()) break; const rv=scState(\"gear\"); cap(`Gear drive Rev ${rv.revs[rv.cur].label}: ${rv.revs[rv.cur].why.replace(/\u003c[^>]+>/g,\"\").slice(0,110)}…`); await sleep(3800,tok); }\n    cap(\"Rail in summer: heating the rail from winter to a heatwave\"); delete TB.state.rail; selectScenario(\"rail\");\n    const p=curP(); for(let T=p.Tmin; T\u003c=p.Tmax; T+=5){ TB.railT=T; TB.railUpdate&&TB.railUpdate(T); const s=$(\"#railT\"); if(s){ s.value=T; $(\"#railTv\").textContent=T+\" °C\"; } await sleep(450,tok); }\n    for(let i=0;i\u003c4;i++){ if(!improveStep()) break; const rv=scState(\"rail\"); cap(`Rail Rev ${rv.revs[rv.cur].label}: ${rv.revs[rv.cur].why.replace(/\u003c[^>]+>/g,\"\").slice(0,110)}…`); await sleep(4000,tok); }\n    cap(\"Robot arm (Advanced level): sizing a LeRobot-style arm before buying servos\"); delete TB.state.arm; TB.armPose={t1:0,t2:0}; selectScenario(\"arm\"); await sleep(3600,tok);\n    for(let i=0;i\u003c6;i++){ if(!improveStep()) break; const rv=scState(\"arm\"); cap(`Robot arm Rev ${rv.revs[rv.cur].label}: ${rv.revs[rv.cur].why.replace(/\u003c[^>]+>/g,\"\").slice(0,110)}…`); await sleep(4000,tok); }\n    cap(\"Path: levels unlock as you finish tasks and pass checkpoints\"); go(\"path\"); await sleep(3500,tok);\n    cap(\"Career: the licences to get, in order, with progress you can tick off\"); go(\"career\"); await sleep(4000,tok);\n    cap(\"Demo finished. Everything you just saw is editable.\"); await sleep(2500,tok);\n  }catch(e){ /* stopped */ }\n  if(tok===DEMO.token) stopDemo();\n}\nfunction stopDemo(){ DEMO.token++; DEMO.on=false; $(\"#demobar\").style.display=\"none\"; $(\"#demoBtn\").textContent=\"Run demo\"; $(\"#demoBtn\").classList.remove(\"demo-on\"); renderLevelChip(); go(S.tab); }\n\n/* ============================== WIRING ============================== */\nfunction wire(){\n  document.addEventListener(\"click\",e=>{ const a=e.target.closest&&e.target.closest(\"a[href]\"); if(!a) return; const h=a.getAttribute(\"href\")||\"\"; if(h.startsWith(\"#\")){ e.preventDefault(); go(h.slice(1)); window.scrollTo(0,0); } else if(/^https?:/i.test(h)){ a.target=\"_blank\"; a.rel=\"noopener\"; } });\n  $(\"#cadPrev\").addEventListener(\"click\",()=>cadSet(CAD.step-1));\n  $(\"#cadNext\").addEventListener(\"click\",()=>cadSet(CAD.step+1));\n  document.querySelectorAll(\"#scenarioSeg button\").forEach(b=>b.addEventListener(\"click\",()=>selectScenario(b.dataset.sc)));\n  document.querySelectorAll(\"[data-view]\").forEach(b=>b.addEventListener(\"click\",()=>{\n    document.querySelectorAll(\"[data-view]\").forEach(x=>x.setAttribute(\"aria-pressed\",x===b?\"true\":\"false\"));\n    CAD.view=b.dataset.view; frameObject(S.tab===\"cad\"?CAD.root:TB.group, b.dataset.view);\n  }));\n  document.querySelectorAll(\"[data-disp]\").forEach(b=>b.addEventListener(\"click\",()=>{\n    document.querySelectorAll(\"[data-disp]\").forEach(x=>x.setAttribute(\"aria-pressed\",x===b?\"true\":\"false\"));\n    V.display=b.dataset.disp; if(V.ok){ applyDisplay(CAD.part); applyDisplay(TB.group); }\n  }));\n  $(\"#sectionBtn\").addEventListener(\"click\",e=>{ if(!unlocked(2)) return; V.section=!V.section; e.currentTarget.setAttribute(\"aria-pressed\",V.section?\"true\":\"false\"); if(V.ok) applyDisplay(CAD.part); });\n  $(\"#freeMode\").addEventListener(\"change\",e=>{ const before=level(); P.free=e.target.checked; saveProgress(); afterProgress(before); renderPathLadder(); renderPathQuizzes(); renderLevelChip(); if(!P.free) toast(\"Path mode on: levels unlock as you finish tasks\"); });\n  $(\"#dlCsv\").addEventListener(\"click\",async()=>{ if(!S.downloads) return; if(!S.runs.length){ toast(\"No saved revisions yet\"); return; } try{ await S.downloads.save({filename:`me-lab-test-log-${new Date().toISOString().slice(0,10)}.csv`, data:exportCsv()}); toast(\"Test log saved\"); }catch(e){ if(e&&e.code===\"declined\") toast(\"Download cancelled\"); else toast(\"Download not available here\"); } });\n  $(\"#planesBtn\").addEventListener(\"click\",e=>{ V.planes=!V.planes; e.currentTarget.setAttribute(\"aria-pressed\",V.planes?\"true\":\"false\"); buildCad(); });\n  $(\"#demoBtn\").addEventListener(\"click\",()=> DEMO.on ? stopDemo() : runDemo());\n  $(\"#demoStop\").addEventListener(\"click\",stopDemo);\n  $(\"#matForm\").addEventListener(\"submit\",async e=>{ e.preventDefault();\n    const rec={name:$(\"#mfName\").value.trim(), E:num($(\"#mfE\").value), sy:num($(\"#mfSy\").value), rho:num($(\"#mfRho\").value), alpha:num($(\"#mfA\").value), note:$(\"#mfNote\").value.trim()};\n    if(!rec.name||!(rec.E>0)||!(rec.sy>0)||!(rec.rho>0)||!(rec.alpha>=0)){ toast(\"Fill in every number: E, σy and ρ must be above zero\"); return; }\n    if(await addRecord(\"materials\",rec)){ e.target.reset(); toast(`${rec.name} added: pick it in CAD and Test bench`); }\n  });\n  $(\"#trendForm\").addEventListener(\"submit\",async e=>{ e.preventDefault();\n    const rec={title:$(\"#tfTitle\").value.trim(), note:$(\"#tfNote\").value.trim(), source:safeUrl($(\"#tfSrc\").value.trim())};\n    if(!rec.title){ toast(\"Give the trend a name\"); return; }\n    if(await addRecord(\"trends\",rec)){ e.target.reset(); toast(\"Trend added to the Trends page\"); }\n  });\n  $(\"#certForm\").addEventListener(\"submit\",async e=>{ e.preventDefault();\n    const rec={name:$(\"#cfName\").value.trim(), cost:$(\"#cfCost\").value.trim(), time:$(\"#cfTime\").value.trim(), why:$(\"#cfWhy\").value.trim()};\n    if(!rec.name){ toast(\"Give the certificate a name\"); return; }\n    if(await addRecord(\"certs\",rec)){ e.target.reset(); toast(\"Added to your career list\"); }\n  });\n  $(\"#copyJson\").addEventListener(\"click\",async()=>{ try{ await navigator.clipboard.writeText(exportJson()); toast(\"Backup copied: paste it into a note or email\"); }catch(e){ $(\"#importBox\").value=exportJson(); toast(\"Copy blocked here: the backup is in the box below, select and copy it\"); } });\n  $(\"#dlJson\").addEventListener(\"click\",async()=>{ if(!S.downloads) return; try{ await S.downloads.save({filename:`me-lab-backup-${new Date().toISOString().slice(0,10)}.json`, data:exportJson()}); toast(\"Backup saved\"); }catch(e){ if(e&&e.code===\"declined\") toast(\"Download cancelled\"); else { toast(\"Download not available here: use Copy backup\"); $(\"#dlJson\").hidden=true; } } });\n  $(\"#importFile\").addEventListener(\"change\",async e=>{ const f=e.target.files[0]; if(!f) return; $(\"#importBox\").value=await f.text(); });\n  $(\"#importBtn\").addEventListener(\"click\",()=>{ const t=$(\"#importBox\").value.trim(); if(!t){ toast(\"Paste a backup or choose a file first\"); return; } importJson(t); });\n}\nfunction boot(){\n  wire();\n  const ok = init3D();\n  if(ok){\n    CAD.scene=makeScene(); CAD.root=new THREE.Group(); CAD.part=new THREE.Group(); CAD.aux=new THREE.Group(); CAD.root.add(CAD.part); CAD.root.add(CAD.aux); CAD.scene.add(CAD.root);\n    TB.scene=makeScene(); TB.group=new THREE.Group(); TB.scene.add(TB.group);\n    buildCad();\n  } else { $(\"#vpFallback\").style.display=\"flex\"; }\n  renderTrends(); renderCareer(); renderData(); renderLevelChip();\n  go(window.LAB_START || \"trends\");\n  setStore(\"none\"); $(\"#tbData\").textContent=\"Checking…\"; $(\"#storeText\").textContent=\"Checking storage…\";\n  initStore();\n}\nboot();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";</script>
<script data-src="src/js/00-core.js">
/* ============================================================
   DAILY COACH · core — utils, storage, state, content model
   ============================================================ */
'use strict';

/* ---------- tiny utils ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = (s='') => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '£' + (Math.round(n*100)/100).toLocaleString('en-GB',{minimumFractionDigits: (Math.abs(n%1)>0.004?2:0), maximumFractionDigits:2});
const money0 = n => '£' + Math.round(n).toLocaleString('en-GB');
const num = n => (Math.round(n*10)/10).toLocaleString('en-GB');

const REDUCE_QUERY = window.matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- dates (local, week starts Monday) ---------- */
const pad2 = n => String(n).padStart(2,'0');
const dkey = (d=new Date()) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = (d=new Date()) => { const x = new Date(d); const i = (x.getDay()+6)%7; x.setDate(x.getDate()-i); x.setHours(0,0,0,0); return x; };
const isoWeekday = (d=new Date()) => (d.getDay()+6)%7; // 0 = Monday
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const prettyDate = (d=new Date()) => `${DAYS_LONG[isoWeekday(d)]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const shortDate = (d=new Date()) => `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;
const daysBetween = (a,b) => Math.round((parseKey(b)-parseKey(a))/864e5);

/* ---------- deterministic seeded RNG ---------- */
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- storage ---------- */
const KEY = 'dailycoach.v1';
const DEFAULT_STATE = {
  v: 1,
  theme: 'auto',            // auto | light | dark
  reduceMotion: false,
  createdAt: dkey(),
  profile: { name:'Kyaw Soe Han', heightCm:170, weightStart:81, weightTarget:72, city:'Southsea, Portsmouth', degree:'BEng Mechanical Engineering, Portsmouth 2025' },
  settings: {
    income: 2500, goal: 25000, opening: 0,
    fixed: [
      { id:'rent',  name:'Rent + bills',        amount: 650 },
      { id:'food',  name:'Food shop',           amount: 180 },
      { id:'trans', name:'Transport',           amount: 60  },
      { id:'phone', name:'Phone + subscriptions', amount: 25 },
      { id:'fun',   name:'Fun + eating out',    amount: 90  },
      { id:'misc',  name:'Everything else',     amount: 45  }
    ],
    stepsGoal: 8000,
    ieltsTarget: 7.0,
    examDate: ''
  },
  days: {},        // dateKey -> { tasks:{id:true}, steps, note, weight }
  expenses: [],    // {id,date,amount,cat,note}
  savings: [],     // {id,date,amount,note}
  workouts: {},    // dateKey -> { sessionId, sets:{exId:[true...]} }
  ielts: { essays: [], speaking: {}, cueSeen: {}, quick: [] },
  knowledge: {},   // packId -> dateKey completed
  chat: [],        // {role:'user'|'coach', text, ts}
  career: { portfolio:{}, openQ:{}, huht:{} },
  seen: { coach: false }
};

function deepMerge(base, patch){
  if (Array.isArray(base)) return Array.isArray(patch) ? patch : base;
  if (typeof base === 'object' && base && typeof patch === 'object' && patch){
    const out = {...base};
    for (const k of Object.keys(patch)) out[k] = (k in base) ? deepMerge(base[k], patch[k]) : patch[k];
    return out;
  }
  return patch === undefined ? base : patch;
}

/* storage availability (sandboxed previews and private modes can block it) */
let storageOK = true;
try { localStorage.setItem('__dc_probe','1'); localStorage.removeItem('__dc_probe'); }
catch(e){ storageOK = false; }

let state = load();
function load(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ raw = null; }
  const s = deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), raw || {});
  return s;
}
let saveWarned = false;
function save(){
  if (!storageOK) return;                       // memory-only session, handled at boot
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){
    if (!saveWarned){ saveWarned = true; storageOK = false; toast('Storage is full — this session is memory only. Export a backup.','warn',5000); }
  }
}

/* ---------- day helpers ---------- */
function dayRec(k = dkey(), create=false){
  if (!state.days[k] && create) state.days[k] = { tasks:{}, steps:0, note:'' };
  return state.days[k] || { tasks:{}, steps:0, note:'' };
}
function setTask(k, id, val){
  const d = dayRec(k, true);
  if (val) d.tasks[id] = true; else delete d.tasks[id];
  save();
}
function taskDone(k, id){ return !!dayRec(k).tasks[id]; }
function countDone(k){ return Object.keys(dayRec(k).tasks).filter(id=>dayRec(k).tasks[id]).length; }

/* ============================================================
   CONTENT · daily tasks
   days: ISO weekday index 0=Mon .. 6=Sun
   ============================================================ */
const TASK_DEFS = [
  { id:'train',    name:'Strength session',   meta:'Bodyweight · 40 min',            icon:'dumbbell', color:'var(--teal)',   days:[0,1,3,4], go:'train' },
  { id:'mobility', name:'Mobility + easy walk', meta:'25 min, loose hips and shoulders', icon:'yoga',  color:'var(--lteal)', days:[2,5,6], go:'train' },
  { id:'walk',     name:'8,000 steps',        meta:'Outdoors, phone in pocket',      icon:'steps',    color:'var(--sky)',    days:[0,1,2,3,4,5,6], go:'today' },
  { id:'essay',    name:'IELTS Task 2 essay', meta:'40 min · 270+ words',            icon:'pen',      color:'var(--orange)', days:[0,2,4], go:'learn' },
  { id:'speaking', name:'Speaking cue card',  meta:'1 min prep · 2 min talk',        icon:'mic',      color:'var(--mid)',    days:[1,3,5], go:'learn' },
  { id:'vocab',    name:'Vocabulary drill',   meta:'15 min · 10 words in sentences', icon:'book',     color:'var(--lteal)', days:[0,1,2,3,4,5,6], go:'learn' },
  { id:'knowledge',name:'Knowledge pack',     meta:'20 min read, then recall out loud', icon:'gears', color:'var(--deep)',  days:[0,1,2,3,4], go:'learn' },
  { id:'log',      name:'Log every spend',    meta:'Same day, no catching up',        icon:'cart',     color:'var(--teal)',   days:[0,1,2,3,4,5,6], go:'money' },
  { id:'weigh',    name:'Monday weigh-in',    meta:'Morning, after toilet, before food', icon:'scale', color:'var(--orange)', days:[0], go:'progress' },
  { id:'career',   name:'Career 15 minutes',  meta:'Portfolio, drawing or question bank', icon:'bolt',   color:'var(--orange)', days:[6], go:'learn', sub:'career' },
  { id:'review',   name:'Weekly review',      meta:'5 min · pick next week’s focus',  icon:'compass',  color:'var(--mid)',    days:[6], go:'coach' }
];
const STREAK_TARGET = 4;

function tasksFor(d = new Date()){
  const wd = isoWeekday(d);
  return TASK_DEFS.filter(t=>t.days.includes(wd));
}
function tasksForDay(k){
  const list = tasksFor(parseKey(k)).slice();
  // keep checked tasks visible even if the schedule changed
  const extra = Object.keys(dayRec(k).tasks).filter(id=>!list.some(t=>t.id===id));
  extra.forEach(id=>{ const def = TASK_DEFS.find(t=>t.id===id); if(def) list.push(def); });
  return list;
}
function dayScore(k){
  const list = tasksForDay(k);
  if (!list.length) return 0;
  return countDone(k)/list.length;
}
function isStreakDay(k){ return countDone(k) >= STREAK_TARGET; }
function currentStreak(from = new Date()){
  let n = 0, d = new Date(from);
  // today only counts once it has hit the threshold
  if (!isStreakDay(dkey(d))) d = addDays(d,-1);
  for (let i=0;i<400;i++){
    if (isStreakDay(dkey(d))) { n++; d = addDays(d,-1); } else break;
  }
  return n;
}
function bestStreak(){
  const keys = Object.keys(state.days).filter(k=>isStreakDay(k)).sort();
  let bestN = 0, run = 0, prev = null;
  for (const k of keys){
    run = (prev && daysBetween(prev,k)===1) ? run+1 : 1;
    bestN = Math.max(bestN, run); prev = k;
  }
  return bestN;
}

const fixedTotal = () => state.settings.fixed.reduce((a,f)=>a+Number(f.amount||0),0);
const savedTotal = () => state.savings.reduce((a,s)=>a+Number(s.amount||0),0) + Number(state.settings.opening||0);
const spentMonth = (m = new Date()) => {
  const p = `${m.getFullYear()}-${pad2(m.getMonth()+1)}`;
  return state.expenses.filter(e=>(e.date||'').startsWith(p)).reduce((a,e)=>a+Number(e.amount||0),0);
};
const monthKey = (d=new Date()) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
function monthLabel(k){ const [y,m]=k.split('-').map(Number); return `${MONTHS[m-1].slice(0,3)} ${String(y).slice(2)}`; }
function monthProgress(d=new Date()){ const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); return { day:d.getDate(), dim, frac:d.getDate()/dim }; }
const planMonths = 12;
const needPerMonth = () => Math.max(0, (Number(state.settings.goal) - Number(state.settings.opening||0)) / planMonths);
const freeAfterFixed = () => Number(state.settings.income||0) - fixedTotal();
const feasiblePerMonth = () => Math.max(0, freeAfterFixed() * 0.9);
const milestoneList = (() => {
  const goal = 25000; return [5000,10000,15000,20000,25000].map(v=>({ v, pct:v/goal }));
})();

/* ---------- weight ---------- */
function weighIns(){ return state.days; }
function weightSeries(){
  return Object.keys(state.days).sort()
    .filter(k=>Number(state.days[k].weight) > 0)
    .map(k=>({ date:k, kg:Number(state.days[k].weight) }));
}
function lastWeight(){
  const s = weightSeries();
  return s.length ? s[s.length-1].kg : Number(state.profile.weightStart);
}
function weightChangeWeek(){
  const s = weightSeries(); if (s.length < 2) return null;
  const last = s[s.length-1], weekAgo = addDays(parseKey(last.date), -7);
  const prev = s.filter(p=>parseKey(p.date) <= weekAgo).pop() || s[0];
  return last.kg - prev.kg;
}

/* ---------- workouts ---------- */
function wrec(k=dkey(), create=false){
  if (!state.workouts[k] && create) state.workouts[k] = { sessionId: todaysSession(parseKey(k)).id, sets:{} };
  return state.workouts[k] || { sessionId: todaysSession(parseKey(k)).id, sets:{} };
}
function sessionFor(k=dkey()){
  const r = state.workouts[k];
  return SESSIONS[r && r.sessionId] || todaysSession(parseKey(k));
}
function setKeyDone(k, exId, i){ const r = wrec(k); return !!(r.sets[exId] && r.sets[exId][i]); }
function toggleSet(k, exId, i, setsCount){
  const r = wrec(k, true);
  const arr = r.sets[exId] && r.sets[exId].length === setsCount ? r.sets[exId].slice() : new Array(setsCount).fill(false);
  arr[i] = !arr[i];
  r.sets[exId] = arr;
  save();
  return arr[i];
}
function sessionDonePct(k=dkey()){
  const s = sessionFor(k); const r = wrec(k);
  let total = 0, done = 0;
  s.blocks.forEach(b=>{ total += b.sets; const arr = r.sets[b.ex] || []; for (let i=0;i<b.sets;i++) if (arr[i]) done++; });
  return total ? Math.round(done/total*100) : 0;
}
function workoutsThisWeek(){
  const ws = startOfWeek();
  let n = 0;
  for (let i=0;i<7;i++){ const k = dkey(addDays(ws,i)); if (sessionDonePct(k) >= 80) n++; }
  return n;
}

/* ---------- IELTS progress ---------- */
const essaysThisWeek = () => { const ws = startOfWeek(); return state.ielts.essays.filter(e=>parseKey(e.date) >= ws).length; };
const speakingThisWeek = () => { const ws = startOfWeek(); return Object.keys(state.ielts.speaking).filter(k=>parseKey(k) >= ws).length; };

/* ---------- derived summaries ---------- */
function todayDone(){ return countDone(dkey()); }
function todayTotal(){ return tasksForDay(dkey()).length; }
function upNext(){
  const k = dkey();
  const list = tasksForDay(k).filter(t=>!taskDone(k,t.id));
  return list[0] || null;
}
function avgScoreLast(n=7){
  let sum = 0, count = 0;
  for (let i=0;i<n;i++){ const k = dkey(addDays(new Date(), -i)); sum += dayScore(k); count++; }
  return count ? sum/count : 0;
}

/* ============================================================
   RING + small chart helpers
   ============================================================ */
let gradSeq = 0;
function ring(pct, size=112, sw=9, opts={}){
  const r = (size - sw)/2, c = 2*Math.PI*r, id = 'rg'+(++gradSeq);
  const dash = c * clamp(pct,0,1);
  const from = opts.fromTo ? c : dash;
  const label = opts.label ?? Math.round(pct*100);
  const sub = opts.sub ?? '';
  return `<div class="ringwrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${opts.c1||'#710014'}"/><stop offset="55%" stop-color="${opts.c2||'#E8D7A6'}"/><stop offset="100%" stop-color="${opts.c3||'#C9946E'}"/>
      </linearGradient></defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
      <circle class="ringfg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${sw}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}"
        style="--full:${from.toFixed(1)}px;--dash:${dash.toFixed(1)}px;filter:drop-shadow(0 3px 6px rgba(113,0,20,.35))"/>
    </svg>
    <div class="ringmid"><b>${label}${opts.pct!==false?'%':''}</b>${sub?`<span>${sub}</span>`:''}</div>
  </div>`;
}
const pctOf = (a,b)=> b ? a/b : 0;

function sparkline(points, opts={}){
  const w = 300, h = opts.h || 64, pad = 6;
  if (!points.length) return `<div class="tiny" style="padding:14px 0">No data yet.</div>`;
  const vals = points.map(p=>p.kg ?? p);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = Math.max(max-min, 0.6);
  const lo = min - span*0.25, hi = max + span*0.25;
  const X = i => pad + (points.length===1 ? (w-2*pad)/2 : i*(w-2*pad)/(points.length-1));
  const Y = v => h - pad - ((v-lo)/(hi-lo))*(h-2*pad);
  const line = vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area = `${line} L${X(vals.length-1).toFixed(1)},${h} L${X(0).toFixed(1)},${h} Z`;
  const target = opts.target;
  const gid = 'sg'+(++gradSeq);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C8278" stop-opacity=".32"/><stop offset="100%" stop-color="#8C8278" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    ${target?`<line x1="0" x2="${w}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" stroke="#B38F6F" stroke-width="1.4" stroke-dasharray="5 5" opacity=".8"/>`:''}
    <path d="${line}" fill="none" stroke="#8A0A1E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${vals.map((v,i)=> i===vals.length-1 ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="#710014" stroke="#fff" stroke-width="2"/>` : '').join('')}
  </svg>`;
}

/* ============================================================
   TODAY'S TIDE — generative art
   one tide per finished task · one seabed layer per streak day
   all tasks done = orange sun · seeded by date
   ============================================================ */
const TIDE_COLORS = ['#710014','#8C8278','#C9946E','#E8D7A6','#8A0A1E','#B38F6F','#E6CDB0','#E8D7A6'];
function tideArt(k){
  const done = countDone(k);
  const total = tasksForDay(k).length || 1;
  const streak = currentStreak(parseKey(k));
  const all = done >= total;
  const rnd = mulberry32(hashStr(k + ':' + done + ':' + streak));
  const W = 360, H = 216, base = H - 10;

  const wavePath = (y0, amp, wl, ph) => {
    let d = `M0,${(y0 + Math.sin(ph)*amp).toFixed(1)}`;
    for (let x=8; x<=W; x+=8) d += ` L${x},${(y0 + Math.sin((x/wl)*Math.PI*2 + ph)*amp).toFixed(1)}`;
    return d;
  };

  // seabed: streak layers
  let seabed = '';
  const layers = Math.min(streak, 12);
  for (let i=0;i<layers;i++){
    const y = base - 4 - i*6.2;
    const amp = 2.4 + rnd()*3.2, wl = 70 + rnd()*90, ph = rnd()*6.28;
    const col = ['#8A0A1E','#710014','#8C8278','#4A0D14'][i%4];
    const op = 0.14 + (i/layers)*0.4;
    seabed += `<path d="${wavePath(y,amp,wl,ph)} L${W},${H} L0,${H} Z" fill="${col}" opacity="${(op*0.5).toFixed(2)}"/>`;
    seabed += `<path d="${wavePath(y,amp,wl,ph)}" fill="none" stroke="${col}" stroke-width="1.1" opacity="${op.toFixed(2)}"/>`;
  }

  // tides: one per done task
  let tides = '';
  const n = Math.min(done, 12);
  for (let i=0;i<n;i++){
    const y = base - 10 - i*8.4;
    const amp = 4 + rnd()*6.5, wl = 55 + rnd()*70, ph = rnd()*6.28;
    const col = TIDE_COLORS[i % TIDE_COLORS.length];
    const p = wavePath(y, amp, wl, ph);
    tides += `<g class="tide-wave" style="animation-delay:${(i*0.7).toFixed(1)}s;animation-duration:${(8+i*0.8).toFixed(1)}s">`;
    tides += `<path d="${p} L${W},${H} L0,${H} Z" fill="${col}" opacity="0.10"/>`;
    tides += `<path d="${p}" fill="none" stroke="${col}" stroke-width="1.9" stroke-linecap="round" opacity="0.85"/>`;
    tides += `</g>`;
  }

  // resting swell — the sea is never completely dead
  let swell = '';
  for (let i=0;i<3;i++){
    const y = base - 2 - i*3.4;
    const amp = 1.6 + rnd()*2.0, wl = 110 + rnd()*80, ph = rnd()*6.28;
    swell += `<path d="${wavePath(y,amp,wl,ph)}" fill="none" stroke="#F2F1ED" stroke-width="1" opacity="${(0.16 - i*0.04).toFixed(2)}"/>`;
  }

  // sun when everything is done
  let sun = '';
  if (all){
    sun = `<g class="tide-sun">
      <circle cx="292" cy="46" r="46" fill="url(#sunGlow)" opacity=".85"/>
      <circle cx="292" cy="46" r="19" fill="url(#sunCore)"/>
      ${Array.from({length:12},(_,i)=>{ const a = i*Math.PI/6; const x1=292+Math.cos(a)*25, y1=46+Math.sin(a)*25, x2=292+Math.cos(a)*33, y2=46+Math.sin(a)*33;

  } else {
    sun = `<circle cx="292" cy="46" r="13" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.4" stroke-dasharray="3 5" opacity=".7"/>`;
  }

  // motes for finished tasks
  let motes = '';
  for (let i=0;i<done*3;i++){
    const x = 14 + rnd()*(W-28), y = 12 + rnd()*(H*0.6), r = 0.8 + rnd()*1.5;
    motes += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#F2F1ED" opacity="${(0.25+rnd()*0.5).toFixed(2)}"/>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tide art: ${done} of ${total} tasks complete, ${streak} day streak${all?', sun risen':''}">

      <linearGradient id="tideSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C9946E" stop-opacity=".55"/>
        <stop offset="55%" stop-color="#8C8278" stop-opacity=".30"/>
        <stop offset="100%" stop-color="#8A0A1E" stop-opacity=".50"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0%" stop-color="#B38F6F" stop-opacity=".85"/><stop offset="60%" stop-color="#B38F6F" stop-opacity=".22"/><stop offset="100%" stop-color="#B38F6F" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunCore"><stop offset="0%" stop-color="#F2F1ED"/><stop offset="55%" stop-color="#E6CDB0"/><stop offset="100%" stop-color="#B38F6F"/></radialGradient>
    </defs>

    ${sun}${swell}${seabed}${tides}${motes}

}

   PIT WALL — the race-day visual layer
   status bar · rev gauge · generated lap · start lights ·
