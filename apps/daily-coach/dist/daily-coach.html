function planDay(){
  const a = parseKey(state.createdAt || dkey()), b = parseKey(dkey());
  return Math.max(1, Math.round((b - a) / 864e5) + 1);
}
function statusBar(){
  const k = dkey(), done = countDone(k), total = tasksForDay(k).length, streak = currentStreak();
  const flag = total && done >= total ? 'chequer' : done >= 4 ? 'green' : done > 0 ? 'yellow' : 'red';
  const msg = { chequer:'Chequered flag', green:'Streak day secured', yellow:'Racing', red:'Lights out soon' }[flag];
  return `<div class="statusbar" role="status">
    <span class="sb-flag ${flag}" aria-hidden="true"></span>
    <b>${esc(prettyDate())}</b>
    <span class="sb-sep" aria-hidden="true"></span><span class="sb-clock num" data-clock="Europe/London">${(()=>{ const t = tzParts('Europe/London'); return t.t + ' ' + t.abbr; })()}</span>
    <span class="sb-sep" aria-hidden="true"></span><span class="num">Day ${planDay()} of 365</span>
    <span class="sb-sep" aria-hidden="true"></span><span class="sb-streak num">${streak}-day streak</span>
    <span class="sb-msg">${msg}</span>
  </div>`;
}

/* rev counter: 270° sweep, needle springs to today's progress, purple mark at the streak line */
function revGauge(done, total, size=148){
  const pct = total ? clamp(done/total,0,1) : 0, cx = size/2, cy = size/2, r = size/2 - 12;
  const ang = d => (d - 225) * Math.PI/180;            // 0 → 270 sweep, starting bottom-left
  const pt = (d, rr) => [cx + Math.cos(ang(d))*rr, cy + Math.sin(ang(d))*rr];
  const [sx,sy] = pt(0,r), [ex,ey] = pt(270,r);
  const arc = `M${sx.toFixed(1)},${sy.toFixed(1)} A${r},${r} 0 1 1 ${ex.toFixed(1)},${ey.toFixed(1)}`;
  let ticks = '';
  for (let i=0;i<=total;i++){
    const d = total ? 270*i/total : 0, [x1,y1] = pt(d, r-9), [x2,y2] = pt(d, r-17);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="g-tick ${i<=done?'on':''}"/>`;
  }
  const sl = total ? 270*Math.min(4,total)/total : 0, [s1,s2] = pt(sl, r+4), [s3,s4] = pt(sl, r-6);
  const needle = -135 + 270*pct;
  return `<div class="gauge" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
      <path d="${arc}" class="g-track"/>
      <path d="${arc}" class="g-fill" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:${(1-pct).toFixed(3)}"/>
      ${ticks}
      <line x1="${s1.toFixed(1)}" y1="${s2.toFixed(1)}" x2="${s3.toFixed(1)}" y2="${s4.toFixed(1)}" class="g-streak"/>
      <g class="g-needle" style="transform:rotate(${needle.toFixed(1)}deg);transform-origin:${cx}px ${cy}px">
        <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${(cy - r + 22).toFixed(1)}"/>
      </g>
      <circle cx="${cx}" cy="${cy}" r="6" class="g-hub"/>
    </svg>
    <div class="g-read"><b class="num">${done}<span>/${total}</span></b><small>tasks</small></div>
  </div>`;
}

/* today's lap: a circuit generated from the date; each finished task drives further round it */
let lapSeq = 0;
function lapArt(k){
  const total = tasksForDay(k).length || 1, done = countDone(k), p = clamp(done/total,0,1), all = done >= total;
  const streak = currentStreak(parseKey(k));
  const rnd = mulberry32(hashStr('lap:' + k));
  const W = 360, H = 210, cx = 180, cy = 104, rx = 138, ry = 74, N = 9, uid = 'lp' + (++lapSeq);
  const ctrl = [];
  for (let i=0;i<N;i++){ const a = i/N*Math.PI*2 - Math.PI/2, rr = 0.66 + rnd()*0.42; ctrl.push([cx+Math.cos(a)*rx*rr, cy+Math.sin(a)*ry*rr]); }
  const pts = [], S = 26;
  for (let i=0;i<N;i++){
    const p0 = ctrl[(i-1+N)%N], p1 = ctrl[i], p2 = ctrl[(i+1)%N], p3 = ctrl[(i+2)%N];
    for (let s=0;s<S;s++){
      const t = s/S, t2 = t*t, t3 = t2*t, f = (a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      pts.push([f(p0[0],p1[0],p2[0],p3[0]), f(p0[1],p1[1],p2[1],p3[1])]);
    }
  }
  const d = 'M' + pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' L') + ' Z';
  const L = [0];
  for (let i=1;i<=pts.length;i++){ const a = pts[i-1], b = pts[i%pts.length]; L.push(L[i-1] + Math.hypot(b[0]-a[0], b[1]-a[1])); }
  const tot = L[L.length-1];
  const at = f => { const tg = f*tot; let i = 1; while (i < L.length-1 && L[i] < tg) i++; const a = pts[i-1], b = pts[i%pts.length], u = (tg-L[i-1])/((L[i]-L[i-1])||1); return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, Math.atan2(b[1]-a[1], b[0]-a[0])]; };
  const mark = (f, cls, len=11) => { const [x,y,a] = at(f), nx = Math.cos(a+Math.PI/2)*len, ny = Math.sin(a+Math.PI/2)*len; return `<line x1="${(x-nx).toFixed(1)}" y1="${(y-ny).toFixed(1)}" x2="${(x+nx).toFixed(1)}" y2="${(y+ny).toFixed(1)}" class="${cls}"/>`; };
  const [carX, carY] = at(all ? 0 : p);
  const [stX, stY, stA] = at(0);
  let grid = '';
  for (let x=20;x<W;x+=20) grid += `<line x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;
  for (let y=20;y<H;y+=20) grid += `<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  const sec = f => p >= f ? (all ? 'lap-sec best' : 'lap-sec pb') : 'lap-sec';
  const flag = all ? `<g class="lap-flag" transform="translate(${(stX+14).toFixed(1)},${(stY-40).toFixed(1)})">
      <line x1="0" y1="0" x2="0" y2="38" class="lap-pole"/>
      <g class="lap-cloth"><rect x="0" y="0" width="30" height="20" fill="url(#${uid}c)" stroke="currentColor" stroke-width=".8"/></g></g>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Today's lap: ${done} of ${total} tasks done, ${streak}-day streak${all?', chequered flag':''}">
    <defs>
      <pattern id="${uid}c" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff"/><rect width="5" height="5" fill="#111"/><rect x="5" y="5" width="5" height="5" fill="#111"/></pattern>
      <pattern id="${uid}k" width="8" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(${(stA*180/Math.PI+90).toFixed(1)})"><rect width="4" height="4" fill="#fff"/><rect x="4" width="4" height="4" fill="#111"/></pattern>
    </defs>
    <g class="lap-grid">${grid}</g>
    <path d="${d}" class="lap-wall" transform="translate(0,7)"/>
    <path d="${d}" class="lap-kerb"/>
    <path d="${d}" class="lap-road"/>
    <path d="${d}" class="lap-centre"/>
    ${p > 0 ? `<path d="${d}" class="lap-trace" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:${(1-p).toFixed(3)}"/>` : ''}
    ${mark(1/3, sec(1/3))}${mark(2/3, sec(2/3))}
    <g transform="translate(${stX.toFixed(1)},${stY.toFixed(1)}) rotate(${(stA*180/Math.PI+90).toFixed(1)})"><rect x="-12" y="-3" width="24" height="6" fill="url(#${uid}k)"/></g>
    <text x="14" y="22" class="lap-label">Lap ${streak + (all?1:0)}</text>
    <text x="${W-14}" y="22" class="lap-label" text-anchor="end">S1 · S2 · S3</text>
    ${flag}
    <g class="lap-car" transform="translate(${carX.toFixed(1)},${carY.toFixed(1)})"><circle r="11" class="lap-halo"/><circle r="5.5" class="lap-dot"/></g>
  </svg>`;
}

/* lights out, once per session */
function startLights(){
  if (motionOff()) return;
  try { if (sessionStorage.getItem('dc.lights')) return; sessionStorage.setItem('dc.lights','1'); } catch(e){}
  const o = document.createElement('div');
  o.className = 'lights'; o.setAttribute('aria-hidden','true');
  o.innerHTML = '<div class="lights-gantry">' + '<span><i></i><i></i></span>'.repeat(5) + '</div><div class="lights-cap">Lights out and away we go</div>';
  document.body.appendChild(o);
  const pods = o.querySelectorAll('.lights-gantry span');
  const step = 240, t0 = 180;
  pods.forEach((x,i)=>setTimeout(()=>x.classList.add('on'), t0 + i*step));
  const outAt = t0 + 5*step + 420;
  setTimeout(()=>{ pods.forEach(x=>x.classList.remove('on')); o.classList.add('go'); }, outAt);
  const end = ()=>{ if (!o.isConnected) return; o.classList.add('out'); setTimeout(()=>o.remove(), 520); };
  setTimeout(end, outAt + 700);
  o.addEventListener('click', end);
}

/* ---------- time zones ---------- */
const CLOCKS = [
  { zone:'Europe/London', city:'UK',      note:'Southsea' },
  { zone:'Asia/Yangon',   city:'Myanmar', note:'Yangon' },
  { zone:'Asia/Tokyo',    city:'Japan',   note:'Tokyo' }
];
function tzOffsetMin(zone, d=new Date()){
  const local = new Date(d.toLocaleString('en-US', { timeZone:zone }));
  const utc = new Date(d.toLocaleString('en-US', { timeZone:'UTC' }));
  return Math.round((local - utc) / 60000);
}
function tzParts(zone, d=new Date()){
  const t = new Intl.DateTimeFormat('en-GB', { timeZone:zone, hour:'2-digit', minute:'2-digit', hour12:false }).format(d);
  const date = new Intl.DateTimeFormat('en-GB', { timeZone:zone, weekday:'short', day:'numeric', month:'short' }).format(d);
  let abbr = 'UTC';
  try { abbr = new Intl.DateTimeFormat('en-GB', { timeZone:zone, timeZoneName:'short' }).formatToParts(d).find(p=>p.type==='timeZoneName').value; } catch(e){}
  const off = tzOffsetMin(zone, d), sign = off >= 0 ? '+' : '−', a = Math.abs(off);
  const offTxt = 'UTC' + sign + Math.floor(a/60) + (a % 60 ? ':' + pad2(a % 60) : '');
  const h = +new Intl.DateTimeFormat('en-GB', { timeZone:zone, hour:'numeric', hour12:false }).format(d) % 24;
  const m = +new Intl.DateTimeFormat('en-GB', { timeZone:zone, minute:'numeric' }).format(d);
  const named = { 'Asia/Yangon':'MMT', 'Asia/Tokyo':'JST' }[zone];
  return { t, date, abbr: named || (abbr.startsWith('GMT+') || abbr.startsWith('GMT-') ? offTxt : abbr), offTxt, h, m, s:d.getSeconds(), off };
}

</script>

<script data-src="src/js/47-render-cad3d.js">
/* ============================================================
   3D CAD PRACTICE — a small software 3D renderer (no library)
   Parts are built from extruded profiles with holes, shaded with
   back-face culling and a painter's sort, outlined with feature
   and silhouette edges. The same geometry produces a first-angle
   orthographic drawing (front, end, plan) with hidden lines.
   ============================================================ */
const V3 = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  norm:a=>{ const l = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/l,a[1]/l,a[2]/l]; }
};
const circleLoop = (cx,cy,r,n=36) => Array.from({length:n},(_,i)=>{ const a = i/n*Math.PI*2; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; });
const area2 = l => { let s = 0; for (let i=0;i<l.length;i++){ const a = l[i], b = l[(i+1)%l.length]; s += a[0]*b[1]-b[0]*a[1]; } return s/2; };
function newell(loop){ let n = [0,0,0]; for (let i=0;i<loop.length;i++){ const a = loop[i], b = loop[(i+1)%loop.length]; n[0] += (a[1]-b[1])*(a[2]+b[2]); n[1] += (a[2]-b[2])*(a[0]+b[0]); n[2] += (a[0]-b[0])*(a[1]+b[1]); } return V3.norm(n); }

/* extrude 2D loops (first = outline, rest = holes) from w0 to w1 along basis [eu, ev, ew] */
function extrude(loops, w0, w1, basis, origin=[0,0,0], mat='steel'){
  const [eu,ev,ew] = basis, det = V3.dot(eu, V3.cross(ev,ew));
  let L = loops.map((lp,i)=>{ const ccw = area2(lp) > 0; return (ccw === (i===0)) ? lp : lp.slice().reverse(); });

  faces.push({ loops:L.map(l=>l.slice().reverse().map(([u,v])=>P(u,v,w0))), cap:true, mat });

}
const CAD_PARTS = {
  bracket:{ name:'L-bracket MB-01', info:'8 mm plate. Two Ø12 fixing holes in the base, two Ø12 holes in the upright, and a centre gusset in front of the upright that stiffens the corner. In the front view the base holes are hidden, so they are drawn dashed.',
    build:()=>[

  bush:{ name:'Flanged bush', info:'Ø60 flange, Ø36 body, Ø20 bore. A typical turned part: the bore is the critical fit, so it carries the tightest tolerance.',
    build:()=>[ ...extrude([circleLoop(0,0,30,40), circleLoop(0,0,10,28)], 0, 8, [X,Y,Z]),
      ...extrude([circleLoop(0,0,18,36), circleLoop(0,0,10,28)], 8, 40, [X,Y,Z], [0,0,0], 'red') ] },
  shaft:{ name:'Stepped shaft', info:'Ø24, Ø32 and Ø20 steps. The shoulders locate a bearing on each side; the larger step carries a gear.',
    build:()=>[ ...extrude([circleLoop(0,0,12,32)], 0, 60, [Y,Z,X]),
      ...extrude([circleLoop(0,0,16,32)], 60, 110, [Y,Z,X], [0,0,0], 'red'),
      ...extrude([circleLoop(0,0,10,32)], 110, 150, [Y,Z,X]) ] },
  gear:{ name:'Spur gear', info:'16 teeth, module 4 (pitch circle Ø64), 12 mm face width, Ø16 bore. Count the teeth in the plan view.',
    build:()=>[ ...extrude([gearLoop(), circleLoop(0,0,8,28)], 0, 12, [X,Y,Z], [0,0,0], 'red') ] }

const CAD_VIEWS = { iso:[-0.62,0.52], front:[0,0], top:[0,Math.PI/2], left:[Math.PI/2,0] };

function camXf(p, yaw, pitch){
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x = p[0]*cy - p[1]*sy, y = p[0]*sy + p[1]*cy, z = p[2];

function cadBounds(faces){

function cadDraw(){

}
/* first-angle orthographic sheet as SVG */
function cadSheet(){
  const faces = cad.faces, b = cad.b, labels = cadLabels();
  const views = [ { key:'front', yaw:0, pitch:0, name:'Front view' }, { key:'end', yaw:Math.PI/2, pitch:0, name:'End view (from left)' }, { key:'plan', yaw:0, pitch:Math.PI/2, name:'Plan' } ];
  const proj = (v,p) => { const q = camXf([p[0]-b.c[0],p[1]-b.c[1],p[2]-b.c[2]], v.yaw, v.pitch); return [q[0], -q[2]]; };
  views.forEach(v=>{
    const segs = [], hid = [];
    faces.forEach(f=>{
      if (f.cap){ f.loops.forEach(l=>{ for (let i=0;i<l.length;i++) segs.push([proj(v,l[i]), proj(v,l[(i+1)%l.length])]); }); }
      else {

        const me = fac(f), pr = f.prev ? fac(f.prev) : me;
        const sil = (me < -1e-6 && pr > 1e-6) || (me > 1e-6 && pr < -1e-6);
        if (f.sharp || sil){ const [p0,,,p3] = f.loops[0]; (f.hole && sil && !f.sharp ? hid : segs).push([proj(v,p0), proj(v,p3)]); }

    v.w = v.mxx - v.mnx; v.h = v.mxy - v.mny;
  });

  const s = Math.min((Wd - 2*pad - gap)/(F.w + E.w), (Hd - 2*pad - gap)/(F.h + P.h));
  const fx = pad + 10, fy = pad;
  F.ox = fx - F.mnx*s; F.oy = fy - F.mny*s;
  E.ox = fx + F.w*s + gap - E.mnx*s; E.oy = fy + (F.h*s - E.h*s)/2 - E.mny*s;
  P.ox = fx + (F.w*s - P.w*s)/2 - P.mnx*s; P.oy = fy + F.h*s + gap - P.mny*s;

    const x0 = F.ox+F.mnx*s, x1 = F.ox+F.mxx*s, y0 = F.oy+F.mny*s, y1 = F.oy+F.mxy*s, ex1 = E.ox+E.mnx*s, ex2 = E.ox+E.mxx*s, ey0 = E.oy+E.mny*s;
    const W = Math.round(b.mx[0]-b.mn[0]), Hh = Math.round(b.mx[2]-b.mn[2]), D = Math.round(b.mx[1]-b.mn[1]);
    return `<g class="dim"><line x1="${x0}" y1="${y0-12}" x2="${x1}" y2="${y0-12}" marker-start="url(#dimA)" marker-end="url(#dimA)"/><text x="${(x0+x1)/2}" y="${y0-16}" text-anchor="middle">${W}</text>
      <line x1="${x0-12}" y1="${y0}" x2="${x0-12}" y2="${y1}" marker-start="url(#dimA)" marker-end="url(#dimA)"/><text x="${x0-16}" y="${(y0+y1)/2}" text-anchor="middle" transform="rotate(-90 ${x0-16} ${(y0+y1)/2})">${Hh}</text>
      <line x1="${ex1}" y1="${ey0-12}" x2="${ex2}" y2="${ey0-12}" marker-start="url(#dimA)" marker-end="url(#dimA)"/><text x="${(ex1+ex2)/2}" y="${ey0-16}" text-anchor="middle">${D}</text></g>`;
  })();
  const tag = (v,i) => `<g class="vtag"><rect x="${(v.ox+v.mnx*s-2).toFixed(1)}" y="${(v.oy+v.mxy*s+6).toFixed(1)}" width="18" height="16" rx="4"/><text x="${(v.ox+v.mnx*s+7).toFixed(1)}" y="${(v.oy+v.mxy*s+18).toFixed(1)}" text-anchor="middle">${labels[i]}</text></g>`;

  return `<svg viewBox="0 0 ${Wd} ${Hd}" class="dwg" role="img" aria-label="First-angle orthographic drawing of the ${esc(CAD_PARTS[cad.part].name)}">
    <defs><marker id="dimA" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z"/></marker></defs>
    <rect x="4" y="4" width="${Wd-8}" height="${Hd-8}" rx="6" class="dwg-frame"/>

}

      <div class="row" style="gap:8px">${['A','B','C'].map(L=>`<button class="qbtn" data-a="cad-answer" data-id="${L}">${L}</button>`).join('')}

}
function cadSetPart(id){ cad.part = id; cad.faces = CAD_PARTS[id].build(); cad.b = cadBounds(cad.faces); }
function cadLoop(){

}
function cadKick(){ if (!cad.raf) cad.raf = requestAnimationFrame(cadLoop); }
function mountCad(root){
  const cv = root.querySelector('#cadCanvas'); if (!cv) return;
  if (!cad.faces) cadSetPart(cad.part);
  cv.addEventListener('pointerdown', e=>{ cad.drag = { x:e.clientX, y:e.clientY }; cad.tween = null; cv.setPointerCapture(e.pointerId); });

function cadRefresh(){ const card = document.getElementById('cadCard'); if (!card) return; card.outerHTML = cadCardHTML(); mountCad(document.getElementById('cadCard').parentNode); cadKick(); }
function cadAction(a, el){
  if (a==='cad-part'){ cadSetPart(el.dataset.id); cadRefresh(); }
  else if (a==='cad-view'){ const [y,p] = CAD_VIEWS[el.dataset.id]; const ny = y + Math.round((cad.yaw - y)/(Math.PI*2))*Math.PI*2;

  else if (a==='cad-spin'){ cad.spin = !cad.spin; el.classList.toggle('on', cad.spin); cadKick(); }

function dwgCardHTML(){
  const best = dxBest();
  let body = '';
  if (dx.mode === 'explore'){
    const k = dx.sel, i = DX_INFO[k];
    body = `${dxDrawing(k)}
      <div class="dx-info"><div class="dx-n">${i.n}</div><div><div class="h3">${esc(i.t)}</div><p>${esc(i.b)}</p><p class="dx-check"><b>On the shop floor:</b> ${esc(i.c)}</p></div></div>
      <div class="row" style="gap:8px;margin-top:10px"><button class="btn btn-soft btn-sm" data-a="dx-step" data-id="-1">Previous</button><button class="btn btn-soft btn-sm" data-a="dx-step" data-id="1">Next feature</button></div>`;
  } else if (!dx.done){
    const Q = DX_Q[dx.order[dx.i]];
    body = `${dxDrawing(dx.picked!=null ? Q.f : null)}
      <div class="dx-test"><div class="dx-prog"><span class="num">Question ${dx.i+1} of ${dx.order.length}</span><span class="num">Score ${dx.score}</span></div>
      <div class="dx-bar"><i style="width:${(dx.i/dx.order.length*100).toFixed(0)}%"></i></div>
      <div class="dx-q">${esc(Q.q)}</div>
      <div class="dx-opts">${Q.o.map((o,j)=>`<button data-a="dx-answer" data-id="${j}" class="${dx.picked==null?'':(j===Q.a?'right':(j===dx.picked?'wrong':''))}" ${dx.picked!=null?'disabled':''}>${esc(o)}</button>`).join('')}</div>
      ${dx.picked!=null ? `<div class="dx-why ${dx.picked===Q.a?'ok':'no'}"><b>${dx.picked===Q.a?'Correct.':'Not quite.'}</b> ${esc(Q.w)} The feature is highlighted on the drawing.</div>
      <button class="btn btn-primary btn-sm" data-a="dx-next" style="margin-top:10px">${dx.i+1<dx.order.length?'Next question':'See result'}</button>` : ''}</div>`;
  } else {
    const n = dx.order.length, pct = Math.round(dx.score/n*100);
    body = `<div class="dx-result"><div class="dx-score num">${dx.score}<span>/${n}</span></div>
      <div class="h3">${pct>=88?'Drawing reader. Ready for the shop floor.':pct>=63?'Solid. Review the ones you missed in Explore.':'Keep going: explore each balloon, then retake.'}</div>
      <div class="tiny">Best score: ${Math.max(best, dx.score)}/${n}</div>
      <div class="row" style="gap:8px;margin-top:12px"><button class="btn btn-primary btn-sm" data-a="dx-start">Retake test</button><button class="btn btn-soft btn-sm" data-a="dx-mode" data-id="explore">Back to explore</button></div></div>`;
  }
  return `<div class="glass dxcard" id="dxCard">
    <div class="cadhead"><div><div class="h3">Read a technical drawing</div><div class="tiny">${dx.mode==='explore'?'Tap a numbered balloon to learn that feature.':'Eight questions from the drawing. Explanations after each one.'}</div></div>
      <span class="chip-live">${best?`Best ${best}/8`:'New'}</span></div>
    <div class="cadparts"><button class="${dx.mode==='explore'?'on':''}" data-a="dx-mode" data-id="explore">Explore</button><button class="${dx.mode==='test'?'on':''}" data-a="dx-start">Test me</button></div>
    ${body}
  </div>`;
}
function dxRefresh(){ const c = document.getElementById('dxCard'); if (c) c.outerHTML = dwgCardHTML(); }
function dxAction(a, el){
  const keys = Object.keys(DX_INFO);
  if (a==='dx-pick'){ dx.mode = 'explore'; dx.sel = el.dataset.id; dxRefresh(); }
  else if (a==='dx-step'){ const i = keys.indexOf(dx.sel); dx.sel = keys[(i + (+el.dataset.id) + keys.length) % keys.length]; dxRefresh(); }
  else if (a==='dx-mode'){ dx.mode = el.dataset.id; dx.done = false; dxRefresh(); }
  else if (a==='dx-start'){ const idx = DX_Q.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,8); Object.assign(dx, { mode:'test', order:idx, i:0, score:0, done:false, picked:null }); dxRefresh(); }
  else if (a==='dx-answer'){ if (dx.picked!=null) return; dx.picked = +el.dataset.id; if (dx.picked === DX_Q[dx.order[dx.i]].a) dx.score++; dxRefresh(); }
  else if (a==='dx-next'){ dx.picked = null; if (dx.i+1 < dx.order.length) dx.i++; else { dx.done = true; dxSetBest(dx.score); } dxRefresh(); }
}

<script data-src="src/js/49-render-v12.js">
/* ============================================================
   V12 ENGINE — animated 3D model with real geometry
   60° V, 6-throw crankshaft (throws 120° apart, two rods per
   pin), even firing every 60° of crank. Firing order
   1-7-5-11-3-9-6-12-2-8-4-10 (bank A = 1–6, bank B = 7–12),
   as listed for the BMW N73 V12. Piston position from the
   slider-crank equation s = r cos α + √(l² − r² sin² α).
   ============================================================ */
const V12_FAULTS = {
  none:{ name:'Healthy', health:96, alert:'All twelve cylinders firing evenly', causes:['Oil pressure normal','Vibration in the normal band','Cam timing on the marks'], fix:'Keep to the service plan: oil and filter, plugs at the interval, a timing check at the big service.', when:'Next check at the routine service.' },
  misfire:{ name:'Misfire, cylinder 5', health:71, cyl:5, alert:'Cylinder 5 is not firing', causes:['Worn spark plug','Failed coil pack','Blocked injector'], fix:'Swap the coil from cylinder 5 to cylinder 4. If the misfire moves, replace the coil. If it stays, check the plug, then the injector.', when:'Fix within a day or two: unburnt fuel overheats the catalyst.' },
  bearing:{ name:'Worn big-end, cylinder 3', health:54, cyl:3, alert:'Knock at cylinder 3, louder under load', causes:['Low oil pressure','Oil starvation at high rpm','Bearing clearance past the limit'], fix:'Stop the engine. Check the oil level and pressure, then drop the sump and measure the big-end clearance with Plastigauge.', when:'Stop now: a spun bearing can wreck the crankshaft.' },
  timing:{ name:'Cam timing out one tooth', health:79, alert:'Power down and rough idle on both banks', causes:['Stretched timing chain','Worn tensioner','Chain jumped a tooth'], fix:'Lock the crank at top dead centre on cylinder 1, check both cam marks, then replace the chain and tensioner as a set.', when:'Plan within a week and avoid high rpm until fixed.' }
};
const V12 = { fault:'none', vib:[], order:[1,7,5,11,3,9,6,12,2,8,4,10], theta:0, speed:0.25, run:true, yaw:-0.95, pitch:0.34, drag:null, raf:0, vis:false, io:null, last:0, tween:null, quiz:0, idle:0 };
const VG = { r:8, l:26, bore:7, sp:24, off:9, bank:Math.PI/6, deck:40, skirt:14 };
const STROKE = [ ['power','Power',[242,86,58]], ['exhaust','Exhaust',[140,110,96]], ['intake','Intake',[248,236,172]], ['compression','Compression',[239,200,139]] ];
const v12Fire = c => V12.order.indexOf(c) * 60;
function v12Cyl(c, theta){
  const A = c <= 6, i = A ? c-1 : c-7, beta = (A ? -1 : 1) * VG.bank;
  const phase = (((theta - v12Fire(c)) % 720) + 720) % 720, al = phase * Math.PI/180;
  let s = VG.r*Math.cos(al) + Math.sqrt(VG.l*VG.l - VG.r*VG.r*Math.sin(al)**2);
  if (V12.fault==='bearing' && c===3) s += (Math.random()-.5)*1.4;
  const u = [0, Math.sin(beta), Math.cos(beta)], psi = beta + al;
  return { c, A, i, beta, phase, s, u, x: i*VG.sp + (A ? 0 : VG.off), pin:[VG.r*Math.sin(psi), VG.r*Math.cos(psi)], st: STROKE[Math.floor(phase/180)] };
}
function v12Build(theta){
  const faces = [], rods = [], cyls = [];
  for (let c=1;c<=12;c++){
    const k = v12Cyl(c, theta); cyls.push(k);
    const ev = [0, k.u[2], -k.u[1]];
    const pf = extrude([circleLoop(0,0,VG.bore-0.7,14)], k.s-5, k.s+4, [X, ev, k.u], [k.x,0,0]);
    pf.forEach((f,j)=>{ f.mat = j===0 ? k.st[0] : 'piston'; });
    faces.push(...pf);
    const g = [k.x, k.u[1]*(k.s-2), k.u[2]*(k.s-2)], p = [k.x, k.pin[0], k.pin[1]];
    rods.push({ a:p, b:g, hot: V12.fault==='bearing' && c===3 });
    // valves: intake opens on the intake stroke, exhaust on the exhaust stroke
    const lift = (from) => k.phase > from && k.phase < from+180 ? Math.sin((k.phase-from)/180*Math.PI) : 0;
    [[-2.6,'in',lift(360)],[2.6,'ex',lift(180)]].forEach(([dx,kind,l])=>{ const w0 = VG.deck - 1 - l*2.6, w1 = VG.deck + 8 - l*2.6;
      rods.push({ a:[k.x+dx, k.u[1]*w0, k.u[2]*w0], b:[k.x+dx, k.u[1]*w1, k.u[2]*w1], valve:kind }); });
  }
  for (let i=0;i<6;i++){
    const k = cyls[i];
    faces.push(...extrude([circleLoop(k.pin[0],k.pin[1],2.6,10)], i*VG.sp-4, i*VG.sp+VG.off+4, [Y,Z,X], [0,0,0], 'red'));
    [i*VG.sp-5, i*VG.sp+VG.off+5].forEach(x=>rods.push({ a:[x,0,0], b:[x,k.pin[0],k.pin[1]], web:true }));
  }
  faces.push(...extrude([circleLoop(0,0,3.2,12)], -12, 5*VG.sp+VG.off+16, [Y,Z,X], [0,0,0], 'steel'));
  const end = 5*VG.sp + VG.off;
  faces.push(...extrude([circleLoop(0,0,22,32), circleLoop(0,0,4,12)], -20, -16, [Y,Z,X], [0,0,0], 'fly'));
  faces.push(...extrude([circleLoop(0,0,8,20)], end+12, end+16, [Y,Z,X], [0,0,0], 'red'));
  [-1,1].forEach(sg=>{ const b = sg*VG.bank, cy = Math.sin(b)*(VG.deck+10), cz = Math.cos(b)*(VG.deck+10), x0 = -6 + (sg>0?VG.off:0);
    faces.push(...extrude([circleLoop(cy,cz,2.2,10)], x0, end+14, [Y,Z,X], [0,0,0], 'cam'));
    faces.push(...extrude([circleLoop(cy,cz,6.5,18)], end+12, end+16, [Y,Z,X], [0,0,0], 'red'));
    rods.push({ a:[end+14, 0, 8], b:[end+14, cy, cz+6.5], belt:true });
    rods.push({ a:[end+14, sg*8, 0], b:[end+14, cy+sg*6.5, cz], belt:true }); });
  faces.forEach(f=>{ f.n = newell(f.loops[0]); const o = f.loops[0]; f.c = o.reduce((s,p)=>[s[0]+p[0]/o.length,s[1]+p[1]/o.length,s[2]+p[2]/o.length],[0,0,0]); });
  return { faces, rods, cyls };
}
const V12_CENTRE = [(5*VG.sp+VG.off)/2, 0, 20], V12_R = 78;
function v12Draw(){
  const cv = document.getElementById('v12Canvas'); if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio||1), W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const s = Math.min(W,H)*0.46/V12_R*1.25, cx = W/2, cy = H/2 + 8;
  const tp = p => { const q = camXf([p[0]-V12_CENTRE[0],p[1]-V12_CENTRE[1],p[2]-V12_CENTRE[2]], V12.yaw, V12.pitch); return [cx+q[0]*s, cy-q[2]*s, q[1]]; };
  const M = v12Build(V12.theta), light = V3.norm([-0.45,-0.7,0.6]);
  const items = [];
  M.faces.forEach(f=>{ const n = camXf(f.n, V12.yaw, V12.pitch); if (n[1] < -1e-4){ f._n = n; items.push({ f, d: camXf(V3.sub(f.c,V12_CENTRE), V12.yaw, V12.pitch)[1] }); } });
  M.rods.forEach(r=>{ const m = [(r.a[0]+r.b[0])/2,(r.a[1]+r.b[1])/2,(r.a[2]+r.b[2])/2]; items.push({ r, d: camXf(V3.sub(m,V12_CENTRE), V12.yaw, V12.pitch)[1] }); });
  items.sort((a,b)=>b.d - a.d);
  const col = { steel: dark?[118,96,88]:[170,150,136], piston: dark?[196,176,160]:[226,212,190], red:[200,30,14], fly: dark?[96,70,62]:[150,124,110], cam: dark?[226,200,140]:[201,144,46] };
  STROKE.forEach(([k,,c])=>col[k] = c);
  items.forEach(it=>{
    if (it.r){
      const a = tp(it.r.a), b = tp(it.r.b);
      const r = it.r;
      g.strokeStyle = r.hot ? '#C9946E' : r.belt ? (dark?'rgba(230,205,176,.55)':'rgba(74,13,20,.55)') : r.valve==='in' ? '#E6CDB0' : r.valve==='ex' ? (dark?'#978A7E':'#766A60') : r.web ? (dark?'#2C2A28':'#8A6A5C') : (dark?'#C9B49A':'#6E4A3E');
      g.lineWidth = r.hot ? 4.5 : r.belt ? 1.6 : r.valve ? 1.8 : r.web ? 4.5 : 3; g.lineCap = 'round';
      if (r.hot){ g.shadowColor = '#C9946E'; g.shadowBlur = 14; } else g.shadowBlur = 0;
      g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); g.shadowBlur = 0; return;
    }
    const f = it.f, lam = Math.max(0, V3.dot(f._n, light)), k = 0.42 + 0.62*lam, c = col[f.mat] || col.steel, sp = Math.pow(lam,16)*55;
    g.fillStyle = `rgb(${Math.min(255,c[0]*k+sp)|0},${Math.min(255,c[1]*k+sp)|0},${Math.min(255,c[2]*k+sp)|0})`;
    g.beginPath(); f.loops.forEach(l=>{ l.forEach((p,i)=>{ const q = tp(p); i ? g.lineTo(q[0],q[1]) : g.moveTo(q[0],q[1]); }); g.closePath(); }); g.fill('evenodd');
    if (f.cap){ g.strokeStyle = dark?'rgba(255,255,255,.25)':'rgba(10,10,16,.35)'; g.lineWidth = .8; g.stroke(); }
  });

  [-1,1].forEach(sg=>{
    const b = sg*VG.bank, u = [0,Math.sin(b),Math.cos(b)], ev = [0,u[2],-u[1]], x0 = -10 + (sg>0?VG.off:0), x1 = 5*VG.sp + 10 + (sg>0?VG.off:0);
    const P = (x,w,e) => tp([x, u[1]*w + ev[1]*e, u[2]*w + ev[2]*e]);
    const q = [P(x0,VG.deck,-VG.bore-2),P(x1,VG.deck,-VG.bore-2),P(x1,VG.deck,VG.bore+2),P(x0,VG.deck,VG.bore+2)];
    g.fillStyle = dark ? 'rgba(255,255,255,.035)' : 'rgba(74,13,20,.05)'; g.strokeStyle = dark ? 'rgba(179,143,111,.35)' : 'rgba(113,0,20,.35)'; g.lineWidth = 1;
    g.beginPath(); q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); g.fill(); g.stroke();
    const lb = P(x1+6, VG.deck, 0); g.font = '800 11px -apple-system,system-ui,sans-serif'; g.fillStyle = dark?'#C9946E':'#8A0A1E'; g.textAlign = 'center'; g.fillText(sg<0?'Bank A':'Bank B', lb[0], lb[1]);
  });
  // glass cylinder liners, combustion glow, spark, numbers
  M.cyls.forEach(k=>{
    const ev = [0, k.u[2], -k.u[1]];
    const ring = w => circleLoop(0,0,VG.bore,24).map(([a,b])=>tp([k.x + a, ev[1]*b + k.u[1]*w, ev[2]*b + k.u[2]*w]));
    const top = ring(VG.deck), bot = ring(VG.skirt), crown = ring(k.s+4);
    const F = V12.fault, mis = F==='misfire' && k.c===5, ph = F==='timing' ? (k.phase - 25 + 720) % 720 : k.phase;
    if (!mis && ph < 180){
      const a = (F==='timing'?0.32:0.55)*(1 - ph/180);
      g.fillStyle = `rgba(255,${90+Math.round(80*(1-ph/180))},30,${a.toFixed(2)})`;
      g.beginPath(); top.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); crown.slice().reverse().forEach(p=>g.lineTo(p[0],p[1])); g.closePath(); g.fill();
    }
    g.strokeStyle = dark ? 'rgba(230,205,176,.28)' : 'rgba(74,13,20,.28)'; g.lineWidth = 1;
    if (mis){ g.strokeStyle = `rgba(179,143,111,${(0.5+0.5*Math.sin(performance.now()/180)).toFixed(2)})`; g.lineWidth = 2.4; }
    [top, bot].forEach(r=>{ g.beginPath(); r.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); g.stroke(); });
    if (!mis && ph < 22){
      const d = tp([k.x, k.u[1]*VG.deck, k.u[2]*VG.deck]), rr = 9*(1 - ph/22) + 3;

function v12Panel(cyls){

function v12Vib(){
  const cv = document.getElementById('v12Vib'); if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio||1), W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  if (cv.width !== Math.round(W*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }

  if (F==='bearing'){ const t = ((th % 360)+360)%360; if (t < 12 || Math.abs(t-180) < 12) v += 0.95*(Math.random()>.3?1:-1); }

  const h = V12_FAULTS[F].health, col = h>=85 ? (dark?'#E6CDB0':'#A9845F') : h>=65 ? '#B38F6F' : '#C9946E';
  g.strokeStyle = col; g.lineWidth = 1.8; g.shadowColor = col; g.shadowBlur = 8; g.beginPath();
  V12.vib.forEach((s,i)=>{ const x = i/159*W, y = H/2 - s*H*0.42; i ? g.lineTo(x,y) : g.moveTo(x,y); }); g.stroke(); g.shadowBlur = 0;
}
function v12CardHTML(){

const V12_VIEWS = { iso:[-0.95,0.34], front:[-Math.PI/2,0.02], side:[0,0.02], top:[0,Math.PI/2] };
function v12Loop(ts){
  V12.raf = 0;
  if (!V12.vis || !document.getElementById('v12Canvas')) return;
  const dt = V12.last ? Math.min(0.05, (ts - V12.last)/1000) : 0; V12.last = ts;
  if (V12.run && !motionOff()) V12.theta += dt * V12.speed * 360;
  if (V12.tween){ const t = Math.min(1,(performance.now()-V12.tween.t0)/650), e = 1-Math.pow(1-t,3); V12.yaw = V12.tween.y0+(V12.tween.y1-V12.tween.y0)*e; V12.pitch = V12.tween.p0+(V12.tween.p1-V12.tween.p0)*e; if (t>=1) V12.tween = null; }
  v12Draw(); v12Vib();
  V12.raf = requestAnimationFrame(v12Loop);
}
function v12Kick(){ V12.last = 0; if (!V12.raf) V12.raf = requestAnimationFrame(v12Loop); }
function v12SpeedTxt(){ const el = document.getElementById('v12SpeedTxt'); if (el) el.textContent = `one turn every ${(1/V12.speed).toFixed(1)} s`; }
function mountV12(root){
  const cv = root.querySelector('#v12Canvas'); if (!cv) return;
  cv.addEventListener('pointerdown', e=>{ V12.drag = { x:e.clientX, y:e.clientY }; V12.tween = null; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e=>{ if (!V12.drag) return; V12.yaw += (e.clientX-V12.drag.x)*0.012; V12.pitch = clamp(V12.pitch + (e.clientY-V12.drag.y)*0.01, -1.4, 1.55); V12.drag = { x:e.clientX, y:e.clientY }; if (motionOff()) v12Draw(); });
  const end = ()=>{ V12.drag = null; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  const sp = root.querySelector('#v12Speed'); if (sp) sp.addEventListener('input', ()=>{ V12.speed = +sp.value; v12SpeedTxt(); });

  V12.io = new IntersectionObserver(es=>{ V12.vis = es[0].isIntersecting; if (V12.vis) v12Kick(); });
  V12.io.observe(cv);
  v12Draw();
}
function v12Action(a, el){
  if (a==='v12-view'){ const [y,p] = V12_VIEWS[el.dataset.id]; const ny = y + Math.round((V12.yaw - y)/(Math.PI*2))*Math.PI*2;
    if (motionOff()){ V12.yaw = ny; V12.pitch = p; v12Draw(); } else { V12.tween = { t0:performance.now(), y0:V12.yaw, y1:ny, p0:V12.pitch, p1:p }; v12Kick(); } }
  else if (a==='v12-fault'){ V12.fault = el.dataset.id; V12.vib = []; const t = document.getElementById('v12Twin'); if (t) t.outerHTML = v12TwinHTML(); v12Kick(); if (V12.fault !== 'none') toast('Fault simulated: ' + V12_FAULTS[V12.fault].name, 'warn', 1800); }
  else if (a==='v12-run'){ V12.run = !V12.run; el.textContent = V12.run ? 'Pause' : 'Play'; el.classList.toggle('on', V12.run); v12Kick(); }
  else if (a==='v12-answer'){
    const right = [1,1,0][V12.quiz % 3], whys = ['720° ÷ 12 cylinders = 60°, which is why the banks sit 60° apart.','7 sits opposite 1 on the same crank pin and fires 60° later.','An inline six is perfectly balanced; a V12 is two of them on one crank.'];
    const fb = document.getElementById('v12Fb');

}

function kmFindTopic(name){ return KM_DOMAINS.flatMap(d=>d.topics).find(t=>t.n===name); }
function kmMatch(q){
  const words = q.toLowerCase().split(/[^a-z0-9&]+/).filter(w=>w.length>2); if (!words.length) return null;

  return bs >= 2 ? best : null;
}

/* ============================================================

   - GAL: shared galaxy helpers (spiral dust, differential rotation,

const isDarkUI = () => document.documentElement.getAttribute('data-theme') === 'dark';

function paintLandscape(){

    { base:.46, amp:.30, rough:.56, fill:['rgba(70,64,60,.55)','rgba(30,28,27,.2)'], gold:.25 },
    { base:.56, amp:.26, rough:.58, fill:['rgba(110,90,72,.55)','rgba(40,32,28,.3)'], gold:.55 },
    { base:.66, amp:.22, rough:.60, fill:['rgba(150,118,90,.5)','rgba(60,40,32,.4)'], gold:.8 },

    { base:.64, amp:.22, rough:.60, fill:['rgba(201,168,130,.78)','rgba(236,226,214,.3)'], gold:.9 },
    { base:.76, amp:.20, rough:.60, fill:['rgba(176,32,52,.82)','rgba(214,140,140,.35)'], gold:.6 },
    { base:.88, amp:.14, rough:.62, fill:['rgba(138,10,30,.95)','rgba(113,0,20,.8)'], gold:.35 }

    g.globalCompositeOperation = 'source-over'; g.restore();

    g.strokeStyle = dark ? 'rgba(230,200,150,.45)' : 'rgba(190,146,84,.55)'; g.lineWidth = 1.1;
    g.beginPath(); pts.forEach((p,i)=>{ if (rnd() < L.gold*.9) i ? g.lineTo(p[0],p[1]) : g.moveTo(p[0],p[1]); else g.moveTo(p[0],p[1]); }); g.stroke();

}

function renderProgress(){
  const weeks = 13;
  const start = addDays(startOfWeek(), -7*(weeks-1));
  let cells = '';
  for (let w=0; w<weeks; w++){
    for (let d=0; d<7; d++){
      const k = dkey(addDays(start, w*7+d));
      const n = countDone(k), tot = tasksForDay(k).length;
      const future = parseKey(k) > new Date();
      let lvl = 0;
      if (n>0) lvl = 1;
      if (n>=3) lvl = 2;
      if (n>=5) lvl = 3;
      if (n>=7) lvl = 4;
      if (tot && n>=tot) lvl = 5;
      cells += `<i class="l${lvl} ${future?'fut':''}" title="${shortDate(parseKey(k))}: ${n}/${tot} tasks"></i>`;
    }
  }
  const weight = weightSeries();
  const wChange = weightChangeWeek();
  const wAvg7 = weight.length ? weight.slice(-7).reduce((a,b)=>a+b.kg,0)/Math.min(7,weight.length) : null;
  const startKg = Number(state.profile.weightStart)||81;
  const targetKg = Number(state.profile.weightTarget)||72;
  const weightPct = clamp((startKg - lastWeight())/(startKg-targetKg),0,1);

  const stats = [
    { k:'Streak', v:currentStreak(), s:'days', d:`Best ${bestStreak()}`, ic:'flame', cls:'' },
    { k:'7-day completion', v:Math.round(avgScoreLast(7)*100), s:'%', d:'of scheduled tasks', ic:'target', cls:'teal' },
    { k:'Sessions this week', v:workoutsThisWeek(), s:'/6', d:'strength + conditioning', ic:'dumbbell', cls:'' },
    { k:'Weight', v:num(lastWeight()), s:'kg', d:wChange===null?'first weigh-in':`${wChange>0?'+':''}${num(wChange)} kg this week`, ic:'scale', cls:'orange' }
  ];

  return `<div class="tcol a">
  <div class="glass card" data-tilt>
    <div class="glare"></div>
    <div class="row between" style="align-items:flex-start;margin-bottom:14px">

    </div>
    <div class="heat">${cells}</div>
    <div class="row between" style="margin-top:12px">
      <span class="tiny">Each column is a week</span>
      <span class="row" style="gap:5px;align-items:center"><span class="tiny">less</span>
        <span class="heat-legend"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i><i class="f"></i></span>
      <span class="tiny">more</span></span>
    </div>
  </div>

  <div class="h2">Numbers</div>
  <div class="stats">
    ${stats.map(s=>`<div class="glass stat ${s.cls}">
      <div class="k">${ic(s.ic,13)} ${s.k}</div>
      <div class="v">${s.v}<small>${s.s}</small></div>
      <div class="d">${esc(s.d)}</div>
    </div>`).join('')}
  </div>

  <div class="h2">Bodyweight <span class="side">${startKg} kg → ${targetKg} kg</span></div>
  <div class="glass card">
    <div class="row between" style="align-items:flex-end">
      <div><div class="mono" style="font-size:26px;font-weight:700;letter-spacing:-.04em">${num(lastWeight())}<span class="tiny" style="font-size:13px"> kg</span></div>
        <div class="tiny">${wAvg7?`7-day average ${num(wAvg7)} kg`:'Log a few mornings to see the trend'}</div></div>
      <span class="chip ${(wChange||0)<=0?'chip-teal':'chip-orange'}">${wChange===null?'—':`${wChange>0?'+':''}${num(wChange)} kg`}</span>
    </div>
    <div style="margin-top:10px">${sparkline(weight.map(p=>({kg:p.kg})), {target:targetKg, h:70})}</div>
    <div class="pbar" style="margin-top:10px"><i class="teal" style="width:${(weightPct*100).toFixed(1)}%"></i></div>
    <div class="row between" style="margin-top:8px"><span class="tiny">${num(Math.max(0,startKg-lastWeight()))} kg down</span><span class="tiny">${num(Math.max(0,lastWeight()-targetKg))} kg to target</span></div>
    <form data-form="weight" class="row" style="margin-top:14px;gap:8px">
      <div class="input-prefix" style="flex:1"><span class="pfx">kg</span><input class="input" name="kg" type="number" step="0.1" min="30" max="250" placeholder="${num(lastWeight())}" required aria-label="Weight today"></div>
      <button class="btn btn-primary btn-sm" type="submit">${ic('scale',15)} Log weight</button>
    </form>
  </div>

  </div>
  <div class="tcol b">
      <div class="h2">IELTS</div>
      <div class="glass card">
        <div class="kv"><span>Essays this week</span><b>${essaysThisWeek()}</b></div>
        <div class="kv"><span>Essays all time</span><b>${state.ielts.essays.length}</b></div>
        <div class="kv"><span>Speaking days this week</span><b>${speakingThisWeek()}/7</b></div>
        <div class="kv"><span>Knowledge packs started</span><b>${Object.keys(state.knowledge).length}/${KNOWLEDGE_PACKS.length}</b></div>
        <div class="kv"><span>Target band</span><b>${num(state.settings.ieltsTarget)}</b></div>
        <div class="pbar" style="margin-top:10px"><i style="width:${clamp(avgEssayBand()/9*100,0,100)}%"></i></div>
        <div class="tiny" style="margin-top:6px">${avgEssayBand()?`Average self-assessed band ${num(avgEssayBand())}`:'No bands logged yet'}</div>
      </div>
      <div class="h2">Money</div>
      <div class="glass card">
        <div class="kv"><span>Saved</span><b>${money0(savedTotal())}</b></div>
        <div class="kv"><span>Goal</span><b>${money0(state.settings.goal)}</b></div>
        <div class="kv"><span>Spent this month</span><b>${money0(spentMonth())}</b></div>
        <div class="pbar" style="margin-top:10px"><i class="orange" style="width:${clamp(savedTotal()/state.settings.goal*100,0,100)}%"></i></div>
      </div>
      <div class="h2">Last 14 days</div>
      <div class="glass card">
        <div class="bars">
          ${Array.from({length:14},(_,i)=>{
            const k = dkey(addDays(new Date(), -13+i));
            const sc = dayScore(k);
            return `<div class="b ${i===13?'now':''}" style="height:${Math.max(6,sc*100)}%"><span>${parseKey(k).getDate()}</span></div>`;
          }).join('')}
        </div>
        <div style="height:20px"></div>
        <div class="tiny">Grey-blue is the past, orange is today. Heights are the share of scheduled tasks completed.</div>
      </div>
      <div class="h2">Records</div>
      <div class="glass card">
        <div class="kv"><span>Best streak</span><b>${bestStreak()} days</b></div>
        <div class="kv"><span>Days logged</span><b>${Object.keys(state.days).length}</b></div>
        <div class="kv"><span>Expenses logged</span><b>${state.expenses.length}</b></div>
        <div class="kv"><span>Sets completed</span><b>${totalSetsDone()}</b></div>
        <div class="kv"><span>Since</span><b>${shortDate(parseKey(state.createdAt))}</b></div>
      </div>
  </div>`;
}
function avgEssayBand(){
  const b = state.ielts.essays.filter(e=>e.band).map(e=>Number(e.band));
  return b.length ? b.reduce((a,c)=>a+c,0)/b.length : 0;
}
function totalSetsDone(){
  let n = 0;
  Object.values(state.workouts).forEach(w=>{ Object.values(w.sets||{}).forEach(arr=>{ n += arr.filter(Boolean).length; }); });
  return n;
}


</script>

const AI_RULES = `You are the coach inside Kyaw Soe Han's personal growth app. Kyaw is 22, a mechanical engineering graduate (BEng, Portsmouth, 2:2) living in Southsea, UK. He has applied (not yet hired) to Huhtamaki as a thermo machine operator and wants a design or manufacturing engineering job, IELTS Academic band 7+, a fitter body (no equipment) and £25,000 saved in a year. He has 1.5 to 2 hours a day. His past work: automated packaging lines at Barfoots, CNC programming at a plastics printer.
Style: British English, direct and warm, specific numbers instead of adjectives, no hype, never moralise about weight or money. Keep replies under 120 words unless he asks for more. End with one clear next step when it fits. Plain text only, no markdown headings; short lists are fine.

`;
const AI_TRANSLATE = `Translate between English and Burmese (Myanmar). If the text is English, reply with the Burmese translation; if it is Burmese, reply with natural British English. Then add one line in English starting "Note:" only if a word has no direct equivalent. No other commentary.`;

function aiTurns(userText){
  const hist = state.chat.slice(-12).map(m=>({ role: m.role==='user' ? 'user' : 'assistant', content: m.text })).filter(m=>m.content);
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const rules = AI.mode==='translate' ? AI_TRANSLATE : AI_RULES + coachContext();
  if (AI.mode==='translate') return [{ role:'user', content: rules + '\n\nText:\n' + userText }];

}

/* ---------- liquid orb ---------- */
function orbPaint(cv, mode){
  const W = cv.clientWidth, H = cv.clientHeight, d = Math.min(2, devicePixelRatio||1); if (!W) return;
  if (cv.width !== Math.round(W*d)){ cv.width = Math.round(W*d); cv.height = Math.round(H*d); }
  const g = cv.getContext('2d'); g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,W,H);
  const T = motionOff() ? 1.2 : performance.now()/1000, st = AI.state, sp = st==='thinking' ? 2.6 : st==='speaking' ? 1.6 : 0.7;
  const beat = st==='speaking' ? .04*Math.sin(T*9) : st==='listening' ? .025*Math.sin(T*5) : .015*Math.sin(T*1.6);
  const cx = W/2, cy = H/2, r = Math.min(W,H)*.36*(1+beat), dark = document.documentElement.getAttribute('data-theme')==='dark';
  // outer glow
  const gR = Math.min(W,H)/2 - 1;
  let gr = g.createRadialGradient(cx,cy,r*.6,cx,cy,gR); gr.addColorStop(0,'rgba(179,143,111,.42)'); gr.addColorStop(.55,'rgba(113,0,20,.14)'); gr.addColorStop(1,'rgba(113,0,20,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(cx,cy,gR,0,7); g.fill();
  g.save(); g.beginPath(); g.arc(cx,cy,r,0,7); g.clip();
  gr = g.createRadialGradient(cx-r*.3,cy-r*.35,r*.1,cx,cy,r); gr.addColorStop(0,'#F3E6D6'); gr.addColorStop(.35,'#C9A27E'); gr.addColorStop(.75,'#8A0A1E'); gr.addColorStop(1,'#3A0710');
  g.fillStyle = gr; g.fillRect(cx-r,cy-r,r*2,r*2);
  // moving liquid blobs
  g.globalCompositeOperation = 'lighter';
  const blobs = [['rgba(230,205,176,.55)',.55,.9,1.3],['rgba(196,140,110,.45)',.7,-.7,1.7],['rgba(214,170,180,.32)',.6,1.1,2.1],['rgba(230,205,176,.4)',.45,-1.3,1.1]];
  blobs.forEach(([c,s,ph,f],i)=>{ const a = T*sp*.35*f + ph*3, bx = cx + Math.cos(a)*r*.42, by = cy + Math.sin(a*1.3+i)*r*.38, br = r*s*(1+.12*Math.sin(T*sp+i));
    const b = g.createRadialGradient(bx,by,0,bx,by,br); b.addColorStop(0,c); b.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = b; g.beginPath(); g.arc(bx,by,br,0,7); g.fill(); });
  // caustic ribbons
  g.lineWidth = r*.06; g.lineCap = 'round';
  for (let i=0;i<3;i++){ g.strokeStyle = `rgba(255,240,210,${.12+i*.04})`; g.beginPath(); for (let x=-1;x<=1;x+=.05){ const y = Math.sin(x*3 + T*sp*.8 + i*2)*.18 + (i-1)*.32; const px = cx + x*r, py = cy + y*r; x===-1 ? g.moveTo(px,py) : g.lineTo(px,py); } g.stroke(); }
  g.globalCompositeOperation = 'source-over'; g.restore();
  // holographic rim + specular
  g.save(); g.translate(cx,cy); g.rotate(T*.3);
  const rim = g.createConicGradient ? g.createConicGradient(0,0,0) : null;
  if (rim){ [[0,'rgba(230,205,176,.9)'],[.25,'rgba(214,170,180,.7)'],[.5,'rgba(179,143,111,.85)'],[.75,'rgba(230,205,176,.8)'],[1,'rgba(230,205,176,.9)']].forEach(([o,c])=>rim.addColorStop(o,c)); g.strokeStyle = rim; }
  else g.strokeStyle = 'rgba(230,205,176,.7)';
  g.lineWidth = Math.max(1.5, r*.025); g.beginPath(); g.arc(0,0,r-1,0,7); g.stroke(); g.restore();
  g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(cx-r*.32, cy-r*.42, r*.26, r*.12, -.55, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.ellipse(cx+r*.35, cy+r*.45, r*.18, r*.07, -.6, 0, 7); g.fill();
  if (st==='thinking' && !motionOff()){ g.strokeStyle = 'rgba(230,205,176,.55)'; g.lineWidth = 2; g.beginPath(); g.arc(cx,cy,r*1.14,T*3,T*3+1.4); g.stroke(); g.beginPath(); g.arc(cx,cy,r*1.14,T*3+Math.PI,T*3+Math.PI+1.4); g.stroke(); }
}
function orbLoop(){
  cancelAnimationFrame(AI.orbRaf);
  const tick = ()=>{ const cvs = document.querySelectorAll('canvas.ai-orb'); if (!cvs.length) return; cvs.forEach(c=>orbPaint(c)); if (!motionOff()) AI.orbRaf = requestAnimationFrame(tick); };
  AI.orbRaf = requestAnimationFrame(tick);
}

/* ---------- home ---------- */
const AI_EXPLORE = [
  ['pen','Mark my essay','Paste a Task 2 essay and get a band estimate with three fixes.', 'I will paste an IELTS Task 2 essay. Give a band estimate for each criterion and the three changes that would raise it most. Here it is:\n\n'],

function renderCoach(){

  const recent = [...(state.chatArchive||[]).flatMap(c=>c.filter(m=>m.role==='user').slice(0,1)), ...state.chat.filter(m=>m.role==='user')].slice(-3).reverse();

    <div class="tiny ai-privacy">When you ask, Coach AI sends Claude your question, the recent chat and a short summary of today’s numbers (tasks, streak, money totals, learning progress). Everything else stays in this browser.</div>

/* ---------- conversation overlay ---------- */
function aiWords(text, lit){ return esc(text).split(/(\s+)/).map((w,i)=>/\s+/.test(w) ? w : `<span class="${i/2 < lit ? 'lit' : ''}">${w}</span>`).join(''); }
function aiShellHTML(){
  const tr = AI.mode==='translate';
  return `<div class="ai-chat" id="aiChat" role="dialog" aria-modal="true" aria-label="${tr?'Translation':'Coach chat'}">
    <header class="ai-top"><button class="ai-ib" data-a="ai-close" aria-label="Back">${ic('back',20)}</button>
      <span class="ai-pill"><i class="${aiOnline()?'on':''}"></i>${tr ? 'Translate · English ⇄ Burmese' : aiOnline() ? 'Coach AI · Claude' : 'Offline coach'}</span>
      <button class="ai-ib" data-a="ai-menu" aria-label="More options" aria-expanded="false"><span class="ai-dots"><i></i><i></i><i></i></span></button>
      <div class="ai-menu" id="aiMenu" hidden>${tr?'':`<button data-a="ai-deep">${AI.deep?'✓ ':''}Deeper answers (slower)</button>`}<button data-a="ai-new">New chat</button><button data-a="ai-clear">Clear this chat</button></div></header>
    <p class="ai-hint" id="aiHint">${tr ? 'Type English or Burmese' : 'Go ahead! I’m listening'}</p>

    <form class="ai-input" id="aiForm"><textarea id="aiQ" rows="1" placeholder="${tr ? 'Text to translate…' : 'Ask your coach…'}" aria-label="Message"></textarea></form>
    <div class="ai-dock">
      <button class="ai-side" data-a="ai-history" aria-label="Show the whole chat">${ic('list',20)}</button>
      <button class="ai-main" id="aiMain" data-a="ai-send" aria-label="Send">${ic('arrowRight',26)}</button>
      <button class="ai-side" data-a="${tr?'ai-open':'ai-new'}" data-id="chat" aria-label="${tr?'Back to chat':'New chat'}">${ic(tr?'edit':'plus',20)}</button>
    </div>
  </div>`;
}
function aiLogHTML(){
  const msgs = AI.mode==='translate' ? (AI.tr||[]) : state.chat;
  if (!msgs.length) return `<div class="ai-empty">${AI.mode==='translate' ? 'Write a sentence and it comes back in the other language.' : 'Ask anything: your plan, an engineering idea, an IELTS question, your money.'}</div>`;
  const older = msgs.slice(0,-2), lastQ = msgs.slice(-2);
  return `${older.length ? `<div class="ai-older">${older.map(m=>`<div class="ai-b ${m.role==='user'?'me':''}">${esc(m.text)}</div>`).join('')}</div>` : ''}
    ${lastQ.map(m=> m.role==='user' ? `<p class="ai-q">${aiWords(m.text, 999)}</p>` : `<div class="ai-a">${esc(m.text)}</div>`).join('')}`;
}
function aiOpen(mode){
  AI.mode = mode || 'chat'; if (AI.mode==='translate') AI.tr = AI.tr || [];
  document.getElementById('aiChat')?.remove();
  document.body.insertAdjacentHTML('beforeend', aiShellHTML()); document.body.classList.add('ai-open'); AI.open = true; AI.state = 'idle';
  const q = document.getElementById('aiQ');
  q.addEventListener('input', ()=>{ q.style.height = 'auto'; q.style.height = Math.min(120, q.scrollHeight) + 'px'; AI.state = q.value.trim() ? 'listening' : 'idle'; aiHint(); });
  q.addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); aiSend(); } });
  document.getElementById('aiForm').addEventListener('submit', e=>{ e.preventDefault(); aiSend(); });
  if ((AI.mode==='translate' ? AI.tr : state.chat).length) document.getElementById('aiChat').classList.add('has-log');
  aiScroll(); orbLoop(); setTimeout(()=>q.focus({preventScroll:true}), 250);
}
function aiClose(){ AI.ctl?.abort(); document.getElementById('aiChat')?.classList.add('out'); setTimeout(()=>document.getElementById('aiChat')?.remove(), motionOff()?0:260); document.body.classList.remove('ai-open'); AI.open = false; if (activeTab==='coach') renderView('coach'); }
function aiHint(){ const h = document.getElementById('aiHint'); if (!h) return; h.textContent = AI.state==='thinking' ? 'Thinking…' : AI.state==='speaking' ? (AI.mode==='translate'?'Translating':'Answering') : AI.state==='listening' ? 'I’m listening…' : AI.mode==='translate' ? 'Type English or Burmese' : 'Go ahead! I’m listening'; document.getElementById('aiChat')?.setAttribute('data-state', AI.state);
  const m = document.getElementById('aiMain'); if (m){ m.innerHTML = AI.state==='thinking'||AI.state==='speaking' ? '<span class="ai-stop"></span>' : ic('arrowRight',26); m.setAttribute('aria-label', AI.state==='thinking'||AI.state==='speaking' ? 'Stop' : 'Send'); } }
function aiScroll(){ const l = document.getElementById('aiLog'); if (l) l.scrollTop = l.scrollHeight; }
async function aiSend(preset){
  if (AI.state==='thinking' || AI.state==='speaking'){ AI.ctl?.abort(); return; }
  const q = document.getElementById('aiQ'), text = (preset ?? q.value).trim(); if (!text) { q.focus(); return; }
  q.value = ''; q.style.height = 'auto';
  const list = AI.mode==='translate' ? AI.tr : state.chat;
  list.push({ role:'user', text, ts:Date.now() }); if (AI.mode!=='translate') save();
  document.getElementById('aiChat').classList.add('has-log');
  const log = document.getElementById('aiLog'); log.innerHTML = aiLogHTML();
  // light the question up word by word
  const qEl = log.querySelector('.ai-q:last-of-type'); if (qEl && !motionOff()){ const n = text.split(/\s+/).length; qEl.innerHTML = aiWords(text, 0); let i = 0; const iv = setInterval(()=>{ qEl.innerHTML = aiWords(text, ++i); if (i >= n) clearInterval(iv); }, 70); }
  const ans = document.createElement('div'); ans.className = 'ai-a live'; ans.innerHTML = '<span class="ai-think"><i></i><i></i><i></i></span>'; log.appendChild(ans); aiScroll();
  AI.state = 'thinking'; aiHint();
  let reply = '';
  if (aiOnline()){
    AI.ctl = new AbortController();
    try {
      const r = await AI.sample(aiTurns(text), { cache:false, signal:AI.ctl.signal, modelTier: AI.deep && AI.mode!=='translate' ? 'default' : 'quick',
        onText: ({ text:t })=>{ if (AI.state!=='speaking'){ AI.state = 'speaking'; aiHint(); } ans.textContent = t; aiScroll(); } });
      reply = r.text + (r.truncated ? '\n\n(Cut short. Ask for less at a time.)' : '');
    } catch(e){
      reply = e.text || '';
      if (e.code==='not_granted' || e.code==='sampling_disabled' || e.code==='not_declared' || e.code==='capability_disabled'){ AI.sample = 'denied'; toast('Claude is not allowed here, so the offline coach answered.','warn',3200); }
      else if (e.code==='rate_limited') toast('Claude is busy or your usage limit is reached. Try again in a while.','warn',3200);
      else if (e.code==='refused'){ reply = ''; toast('Claude declined that one. Try rewording it.','warn',2600); }
      else if (e.code!=='cancelled') toast('The connection dropped. Send it again to retry.','warn',2600);
      if (e.code==='cancelled' && reply) reply += ' …';
    }
  }
  if (!reply && AI.mode!=='translate' && (!aiOnline() || AI.sample==='denied')){
    AI.state = 'speaking'; aiHint(); const full = generateReply(text);
    if (motionOff()) reply = full; else { for (let i=0;i<=full.length;i+=3){ ans.textContent = full.slice(0,i); aiScroll(); await new Promise(r=>setTimeout(r,12)); } reply = full; }
  }
  if (!reply && AI.mode==='translate' && !aiOnline()) reply = 'Translation needs Coach AI (Claude), which is not available in this view.';
  ans.classList.remove('live');
  if (reply){ ans.textContent = reply; list.push({ role: AI.mode==='translate' ? 'assistant' : 'coach', text:reply, ts:Date.now() }); if (AI.mode!=='translate') save(); }
  else ans.remove();
  AI.state = 'idle'; AI.ctl = null; aiHint(); aiScroll();
}
function aiAction(a, el){
  if (a==='ai-open') aiOpen(el.dataset.id);
  else if (a==='ai-close') aiClose();
  else if (a==='ai-send') aiSend();
  else if (a==='ai-new'){ if (state.chat.length){ state.chatArchive = [...(state.chatArchive||[]), state.chat].slice(-10); state.chat = []; save(); } if (AI.mode==='translate') AI.tr = []; aiOpen(AI.open && AI.mode==='translate' ? 'translate' : 'chat'); }
  else if (a==='ai-clear'){ if (AI.mode==='translate') AI.tr = []; else { state.chat = []; save(); } document.getElementById('aiLog').innerHTML = aiLogHTML(); document.getElementById('aiMenu').hidden = true; }
  else if (a==='ai-menu'){ const m = document.getElementById('aiMenu'); m.hidden = !m.hidden; el.setAttribute('aria-expanded', String(!m.hidden)); }
  else if (a==='ai-deep'){ AI.deep = !AI.deep; el.textContent = (AI.deep?'✓ ':'') + 'Deeper answers (slower)'; toast(AI.deep ? 'Deeper answers on: Claude thinks first, so replies take longer.' : 'Quick answers on.','ok',2000); }
  else if (a==='ai-history'){ document.getElementById('aiChat').classList.toggle('full'); aiScroll(); }
  else if (a==='ai-preset'){ const p = AI_EXPLORE[+el.dataset.id]; aiOpen('chat'); const q = document.getElementById('aiQ'); if (p[3].endsWith('\n\n')){ q.value = p[3]; q.focus(); q.dispatchEvent(new Event('input')); } else aiSend(p[3]); }
}
document.addEventListener('click', e=>{ const el = e.target.closest('[data-a^="ai-"]'); if (!el) return; e.stopPropagation(); aiAction(el.dataset.a, el); }, true);
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && AI.open) aiClose(); });

</script>

/* ---------- bloom + press ---------- */
const motionOff = ()=> document.documentElement.classList.contains('reduce');

/* the light is scaled to the control it lands on, and capped small */
function bloomAt(x, y, host){
  if (motionOff()) return;
  const b = document.createElement('div');
  b.className = 'bloom';
  b.innerHTML = '<span class="core"></span><span class="ring"></span>';
  const w = host ? host.getBoundingClientRect().width : 44;
  // a chip lands small, a full-width row lands a little wider. Never a flare.
  const scale = clamp(1.7 + w/240, 1.7, 3.0).toFixed(2);
  b.style.setProperty('--bs', scale);
  b.style.left = x+'px'; b.style.top = y+'px';
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), 560);
}
function sparkBurst(x, y, n=6, spread=26){
  if (motionOff()) return;
  for (let i=0;i<n;i++){
    const sp = document.createElement('div');
    sp.className = 'spark';
    const a = (Math.PI*2*i)/n + Math.random()*0.5;
    const r = spread*(0.6+Math.random()*0.7);
    sp.style.setProperty('--dx', (Math.cos(a)*r).toFixed(1)+'px');
    sp.style.setProperty('--dy', (Math.sin(a)*r - 6).toFixed(1)+'px');
    sp.style.left = x+'px'; sp.style.top = y+'px';
    sp.style.animationDelay = (i*14)+'ms';
    document.body.appendChild(sp);
    setTimeout(()=>sp.remove(), 760);
  }
}
document.addEventListener('pointerdown', e=>{
  const t = e.target.closest('.btn, .tab, .task, .setchip, .timer, .lrow, .exhead, .cuehead, .fab, .fabmenu button, .seg button, .chip');
  if (t) bloomAt(e.clientX, e.clientY, t);
}, { passive:true });

/* ---------- card tilt + glare (fine pointers only) ---------- */
const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
document.addEventListener('pointermove', e=>{
  if (!finePointer.matches) return;

  // specular sheen on glass controls
  const ctrl = e.target.closest('.btn');
  if (ctrl){
    const r = ctrl.getBoundingClientRect();
    ctrl.style.setProperty('--mx', ((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
    ctrl.style.setProperty('--my', ((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
  }
  // tide art leans toward the pointer
  const tide = e.target.closest('.tideart');
  if (tide){
    const r = tide.getBoundingClientRect();
    const off = clamp(((e.clientX-r.left)/r.width - .5) * 14, -8, 8);
    tide.style.setProperty('--tide-x', off.toFixed(1)+'px');
  }

  // soft light following the pointer around the page
  const cl = document.getElementById('cursorlight');
  if (cl){
    cl.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
    document.body.classList.add('pointer-live');
  }

  const card = e.target.closest('[data-tilt]');
  $$('[data-tilt]').forEach(c=>{ if (c!==card){ c.style.transform=''; c.classList.remove('tilting'); } });
  if (!card) return;
  const r = card.getBoundingClientRect();
  const px = (e.clientX - r.left)/r.width, py = (e.clientY - r.top)/r.height;
  const rx = (0.5-py)*4.2, ry = (px-0.5)*5.2;
  card.style.transform = `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateZ(0)`;
  card.style.setProperty('--gx', (px*100).toFixed(1)+'%');
  card.style.setProperty('--gy', (py*100).toFixed(1)+'%');
  card.classList.add('tilting');
}, { passive:true });
document.addEventListener('pointerleave', ()=>{
  $$('[data-tilt]').forEach(c=>c.style.transform='');
  document.body.classList.remove('pointer-live');
}, { passive:true });

/* ============================================================
   TIMERS  (cue prep/talk, rest)
   ============================================================ */
const T = {
  prep: { total:60, left:60, running:false, done:false },
  talk: { total:120, left:120, running:false, done:false },
  rest: { total:60, left:60, running:false, label:'Rest', active:false }
};
function fmt(s){ s = Math.max(0, Math.round(s)); return `${Math.floor(s/60)}:${pad2(s%60)}`; }
function renderCueTimer(which){
  const t = T[which];
  $$('[data-tv="'+which+'"]').forEach(valEl=>{
    valEl.textContent = fmt(t.left);
    const btn = valEl.closest('.timer');
    if (!btn) return;
    const barEl = btn.querySelector('[data-tb="'+which+'"]');
    if (barEl) barEl.style.width = ((1 - t.left/t.total)*100).toFixed(1)+'%';
    btn.classList.toggle('running', t.running);
    btn.classList.toggle('done', t.done);
  });
}
function renderRest(){
  const bar = $('#restbar'), t = T.rest;
  bar.classList.toggle('show', t.active);
  $('#restTime').textContent = fmt(Math.ceil(t.left));
  $('#restProg').style.width = ((1 - t.left/t.total)*100).toFixed(1)+'%';
  $('#restLabel').textContent = t.label;
}
function tickAll(dt){
  let changed = false;
  ['prep','talk'].forEach(w=>{
    const t = T[w];
    if (t.running) { t.left -= dt; if (t.left <= 0){ t.left = 0; t.running = false; t.done = true; changed = true; cueAlarm(w); } renderCueTimer(w); }
  });
  if (T.rest.active && T.rest.running){
    T.rest.left -= dt;
    if (T.rest.left <= 0){ T.rest.left = 0; T.rest.running = false; T.rest.active = false; restAlarm(); }
    renderRest();
  }
}
let lastTick = performance.now();
setInterval(()=>{
  const now = performance.now();
  const dt = Math.min(1, (now - lastTick)/1000);
  lastTick = now;
  tickAll(dt);
}, 250);

function cueAlarm(which){
  toast(which==='prep' ? 'Prep over — start talking. Two minutes, no stopping.' : 'Two minutes done. Note one thing to fix, then move on.', 'ok', 3400);
  vibrate([40,60,40]);
}
function restAlarm(){
  toast('Rest done — next set.', 'ok', 1800);
  vibrate([30,50,30]);
}
function vibrate(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function startRest(secs, label='Rest'){
  T.rest.total = secs; T.rest.left = secs; T.rest.running = true; T.rest.active = true; T.rest.label = label;
  renderRest();
}
$('#restSkip').addEventListener('click', ()=>{ T.rest.active = false; T.rest.running = false; renderRest(); });
$('#restbar').addEventListener('click', e=>{
  if (e.target.closest('#restSkip')) return;
  T.rest.running = !T.rest.running; renderRest();
});

        <div class="field"><label for="imp">Paste a backup file’s contents</label><textarea class="input" id="imp" name="json" placeholder='{"v":1,…}' required></textarea></div>
        <button class="btn btn-deep" type="submit">${ic('upload',16)} Merge and reload</button>
        <p class="tiny">Import replaces current data with the file’s data. Export first if unsure.</p>
      </form>`});
      break;
    }
    case 'reset': {
      openSheet({ title:'Reset everything?', body:`
        <p class="tiny">This clears every task, weigh-in, expense and essay stored in this browser. It cannot be undone.</p>
        <div class="row" style="gap:8px;margin-top:6px">
          <button class="btn btn-soft" data-a="close-sheet" style="flex:1">Keep my data</button>
          <button class="btn btn-deep" data-a="reset-confirm" style="flex:1;background:linear-gradient(165deg,#B38F6F,#94704F)">Reset</button>
        </div>`});
      break;
    }
    case 'reset-confirm': {
      localStorage.removeItem(KEY);
      state = load(); save(); closeSheet();
      setTab('today', {force:true}); window.scrollTo(0,0);
      toast('Fresh start.','ok',1800);
      break;
    }
    case 'close-sheet': closeSheet(); break;
    case 'fab-expense': closeFab(); openExpenseSheet(); break;
    case 'fab-saving': closeFab(); document.querySelector('[data-a="add-saving"]')?.click() || openSheet({title:'Add to savings', body:''}); break;
  }
});

/* ---------- forms ---------- */
document.addEventListener('submit', e=>{
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const data = Object.fromEntries(new FormData(form).entries());

  if (kind === 'essay'){
    const words = Number(data.words)||0;
    state.ielts.essays.push({ id:uid(), date:dkey(), prompt:(essayPrompt||essayPromptToday()).t, words, mins:Number(data.mins)||null, band:data.band?Number(data.band):null });
    setTask(dkey(),'essay',true); save();
    renderView('learn'); updateChrome();
    toast(words<250?`Logged ${words} words — under 250 is a penalty. Aim 270+.`:'Essay logged. Read one paragraph out loud.','ok',2800);
  }
  if (kind === 'weight'){
    const kg = Number(data.kg);
    if (!kg) return;
    const d = dayRec(dkey(), true); d.weight = kg;
    setTask(dkey(),'weigh',true); save();
    renderView('progress'); updateChrome();
    const ch = weightChangeWeek();
    toast(`Logged ${num(kg)} kg${ch!==null?` · ${ch>0?'+':''}${num(ch)} kg this week`:''}. Weekly trend beats daily noise.`,'ok',2800);
  }
  if (kind === 'expense'){
    const amount = Number(data.amount);
    if (!amount) return;
    state.expenses.push({ id:uid(), date:dkey(), amount, cat:data.cat||'life', note:(data.note||'').trim() });
    setTask(dkey(),'log',true); save();
    const spend = spentMonth(), dim = monthProgress().dim;
    const proj = spend/monthProgress().day*dim;
    renderView('money'); updateChrome();
    toast(proj > freeAfterFixed() ? `Logged. Projected ${money0(proj)} this month — that is over your flexible budget.` : `Logged ${money(amount)}. ${money0(Math.max(0,freeAfterFixed()-spend))} of flexible budget left.`, proj>freeAfterFixed()?'warn':'ok',2800);
  }
  if (kind === 'saving'){
    const amount = Number(data.amount);
    state.savings.push({ id:uid(), date:dkey(), amount, note:(data.note||'').trim() });
    save(); closeSheet(); renderView('money'); updateChrome();
    toast(`${money0(amount)} banked. ${money0(savedTotal())} of ${money0(state.settings.goal)}.`,'ok',2600);
  }
  if (kind === 'fixed'){
    const f = state.settings.fixed.find(x=>x.id===form.dataset.id);
    if (f){ f.amount = Number(data.amount)||0; save(); closeSheet(); renderView('money'); toast('Plan updated.','ok',1600); }
  }
  if (kind === 'settings'){
    state.settings.income = Number(data.income)||state.settings.income;
    state.settings.goal = Number(data.goal)||state.settings.goal;
    state.settings.examDate = data.exam||'';
    state.settings.stepsGoal = Number(data.steps)||state.settings.stepsGoal;
    save(); renderView('coach'); updateChrome();
    toast('Settings saved.','ok',1800);
  }
  if (kind === 'chat'){
    const msg = (data.msg||'').trim();
    if (!msg) return;
    form.querySelector('[name=msg]').value = '';
    sendMessage(msg);
  }
  if (kind === 'import'){
    try {
      const parsed = JSON.parse(data.json);
      state = deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
      save(); closeSheet(); setTab('today',{force:true});
      toast('Backup imported.','ok',2000);
    } catch(err){ toast('That file did not parse. Nothing changed.','warn',2800); }
  }

  // a form submitted from the sheet should dismiss the sheet
  if (form.closest('#sheet')) closeSheet();
});

/* ---------- fab ---------- */
function closeFab(){
  document.body.classList.remove('fab-open');
  $('#fabwrap').classList.remove('open');
  $('#fab').classList.remove('open');
  $('#fab').setAttribute('aria-expanded','false');
}
$('#fab').addEventListener('click', ()=>{
  const w = $('#fabwrap');
  const open = w.classList.toggle('open');
  document.body.classList.toggle('fab-open', open);
  $('#fab').classList.toggle('open', open);
  $('#fab').setAttribute('aria-expanded', String(open));
});
$('#fabmenu').addEventListener('click', e=>{
  const b = e.target.closest('button[data-fab]'); if (!b) return;
  if (b.dataset.fab === 'expense'){ closeFab(); openExpenseSheet(); }
  else { closeFab(); document.querySelector('[data-a="add-saving"]').click(); }
});
function openExpenseSheet(){
  openSheet({ title:'Log spending', body:`<form data-form="expense" style="display:grid;gap:12px">
    <div class="field"><label for="xa">Amount</label>
      <div class="input-prefix"><span class="pfx">£</span><input class="input" id="xa" name="amount" type="number" step="0.01" min="0" placeholder="0.00" required></div></div>
    <div class="field"><label for="xn">What was it?</label><input class="input" id="xn" name="note" placeholder="Meal deal, bus, coffee"></div>
