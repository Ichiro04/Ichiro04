<script data-src="lab/lab.html">window.LAB_HTML="\u003c!DOCTYPE html>\n\u003chtml lang=\"en-GB\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Mechanical Engineering Lab\u003c/title>\n\u003cstyle>\n:root{\n  /* Layout idea: a drawing-office workbench. Title-block header, 3D viewport on the left, data sheet on the right; stacks on phones. */\n  --paper:#eceff2; --panel:#ffffff; --ink:#17212b; --muted:#566370; --line:#cdd5dc; --accent:#1d5fa8;\n  --accent-soft:#e3ecf7; --pass:#1d7344; --pass-bg:#e2f3e8; --fail:#b0261c; --fail-bg:#fbe6e3; --warn:#9a5b00; --warn-bg:#fdf0db;\n  --vp-top:#d9e1ea; --vp-bottom:#f6f8fa;\n  --font-display:\"IBM Plex Sans Condensed\",\"Arial Narrow\",Arial,sans-serif;\n  --font-body:\"IBM Plex Sans\",\"Segoe UI\",Roboto,Arial,sans-serif;\n  --font-mono:\"IBM Plex Mono\",Consolas,\"Courier New\",monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --paper:#11161b; --panel:#192027; --ink:#e2e8ed; --muted:#97a4af; --line:#2d3740; --accent:#6aa5e6;\n    --accent-soft:#1d2c3c; --pass:#5cc38a; --pass-bg:#16301f; --fail:#f07a6e; --fail-bg:#3a1b18; --warn:#e4a64a; --warn-bg:#36290f;\n    --vp-top:#26303a; --vp-bottom:#141a1f; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --paper:#11161b; --panel:#192027; --ink:#e2e8ed; --muted:#97a4af; --line:#2d3740; --accent:#6aa5e6;\n  --accent-soft:#1d2c3c; --pass:#5cc38a; --pass-bg:#16301f; --fail:#f07a6e; --fail-bg:#3a1b18; --warn:#e4a64a; --warn-bg:#36290f;\n  --vp-top:#26303a; --vp-bottom:#141a1f; color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}\nh1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2}\nh2{font-size:1.35rem;font-weight:600}\nh3{font-size:1.05rem;font-weight:600}\np{margin:0}\na{color:var(--accent)}\nbutton,input,select,textarea{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}\n\n/* Title block */\n.titleblock{display:grid;grid-template-columns:auto 1fr auto;border-bottom:1px solid var(--line);background:var(--panel)}\n.tb-name{padding:10px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}\n.tb-name h1{font-size:1.15rem;font-weight:700;letter-spacing:.02em}\n.tb-name span{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}\n.tb-cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));}\n.tb-cell{padding:6px 12px;border-right:1px solid var(--line);font-size:.8rem;min-width:0}\n.tb-cell b{display:block;font-family:var(--font-mono);font-size:.66rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}\n.tb-cell span{font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}\n.tb-actions{display:flex;align-items:center;padding:8px 12px;gap:8px}\nnav.tabs{display:flex;gap:0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}\nnav.tabs a{padding:11px 16px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}\nnav.tabs a[aria-current=\"page\"]{color:var(--ink);border-bottom-color:var(--accent)}\n.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:4px;cursor:pointer;font-weight:500;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;min-height:36px}\n.btn:hover{border-color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}\n.btn.primary:hover{filter:brightness(1.08)}\n.btn.small{padding:4px 9px;min-height:30px;font-size:.8rem}\n.btn[disabled]{opacity:.5;cursor:not-allowed}\n.btn.demo-on{background:var(--fail);border-color:var(--fail);color:#fff}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}\n.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:6px 11px;cursor:pointer;font-size:.84rem;min-height:34px}\n.seg button:last-child{border-right:0}\n.seg button[aria-pressed=\"true\"]{background:var(--accent-soft);color:var(--accent);font-weight:600}\n\nmain{padding:16px;max-width:1440px;margin:0 auto}\nsection.view{display:none}\nsection.view.active{display:block}\n.lede{color:var(--muted);max-width:68ch;margin-top:4px}\n.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}\n\n/* Workbench */\n.bench{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:14px;align-items:start}\n.vp-slot{position:sticky;top:8px}\n.viewport{position:relative;height:min(64vh,620px);min-height:300px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:linear-gradient(var(--vp-top),var(--vp-bottom))}\n.viewport canvas{display:block;width:100%;height:100%;touch-action:none}\n.vp-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}\n.vp-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}\n.vp-hud{position:absolute;left:10px;top:10px;font-family:var(--font-mono);font-size:.75rem;background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:4px;padding:6px 8px;max-width:70%;pointer-events:none}\n.vp-legend{position:absolute;right:10px;top:10px;display:none;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-family:var(--font-mono);font-size:.7rem;pointer-events:none}\n.vp-legend .ramp{width:14px;height:120px;background:linear-gradient(#8e1b1b,#d63b2a,#e9c43b,#3fae5a,#2f6fd6);border-radius:2px}\n.vp-legend .row{display:flex;gap:6px}\n.vp-legend .ticks{display:flex;flex-direction:column;justify-content:space-between;height:120px}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}\n.stack{display:flex;flex-direction:column;gap:12px}\n\n/* Feature tree */\n.tree{list-style:none;margin:0;padding:0;font-size:.88rem;border:1px solid var(--line);border-radius:4px}\n.tree li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}\n.tree li:last-child{border-bottom:0}\n.tree li .ico{width:20px;height:20px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;font-family:var(--font-mono);font-size:.62rem;color:var(--accent);flex:none}\n.tree li.future{color:var(--muted);opacity:.55}\n.tree li.current{background:var(--accent-soft);font-weight:600}\n.tree li.rollback{border-bottom:3px solid var(--accent)}\n.tree li:hover{background:var(--accent-soft)}\n.theory h3{margin-bottom:4px}\n.theory .cmd{font-family:var(--font-mono);font-size:.78rem;color:var(--accent)}\n.theory p+p{margin-top:8px}\n.tip{border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft);font-size:.88rem;border-radius:0 4px 4px 0}\n.tip.warn{border-left-color:var(--warn);background:var(--warn-bg)}\n.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.stepper .count{font-family:var(--font-mono);font-size:.82rem;color:var(--muted)}\n\n/* Forms + tables */\n.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}\n.field{display:flex;flex-direction:column;gap:2px;min-width:0}\n.field label{font-size:.76rem;color:var(--muted)}\n.field .inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--paper)}\n.field input,.field select,.field textarea{border:0;background:transparent;padding:6px 8px;width:100%;min-width:0;font-family:var(--font-mono);font-size:.88rem}\n.field textarea{font-family:var(--font-body);resize:vertical;min-height:60px}\n.field .unit{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);padding-right:8px;white-space:nowrap}\n.field.wide{grid-column:1/-1}\ntable{border-collapse:collapse;width:100%;font-size:.86rem}\nth,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}\nth{font-size:.72rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}\ntd.num,th.num{text-align:right}\n.tablewrap{overflow-x:auto}\n.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:3px;font-family:var(--font-mono);white-space:nowrap}\n.chip.pass{background:var(--pass-bg);color:var(--pass)}\n.chip.fail{background:var(--fail-bg);color:var(--fail)}\n.chip.warn{background:var(--warn-bg);color:var(--warn)}\n.chip.info{background:var(--accent-soft);color:var(--accent)}\n.verdict{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;font-weight:600}\n.verdict.pass{background:var(--pass-bg);color:var(--pass)}\n.verdict.fail{background:var(--fail-bg);color:var(--fail)}\n.verdict .big{font-family:var(--font-mono);font-size:1.1rem}\n.change{font-size:.88rem;border:1px dashed var(--line);padding:8px 10px;border-radius:4px}\ndetails.working{font-size:.84rem}\ndetails.working summary{cursor:pointer;color:var(--accent);font-weight:500}\ndetails.working pre{font-family:var(--font-mono);font-size:.78rem;white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);padding:8px;border-radius:4px;margin:8px 0 0}\n\n/* Trends */\n.trend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}\n.trend{display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--accent)}\n.trend .meta{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}\n.trend p{font-size:.9rem}\n.trend .why{font-size:.86rem;color:var(--muted)}\n.trend .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem}\n.trend.user{border-top-color:var(--pass)}\n\n/* Career */\n.career-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:14px;align-items:start}\n.cert{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}\n.cert:last-child{border-bottom:0}\n.cert h3{font-size:.98rem}\n.cert .facts{font-family:var(--font-mono);font-size:.76rem;color:var(--muted)}\n.cert p{font-size:.88rem;grid-column:1/-1}\n.statusbtn{border:1px solid var(--line);border-radius:4px;background:var(--panel);font-size:.75rem;font-weight:600;padding:4px 8px;cursor:pointer;font-family:var(--font-mono);min-width:76px;min-height:30px}\n.statusbtn[data-s=\"booked\"]{background:var(--warn-bg);color:var(--warn);border-color:transparent}\n.statusbtn[data-s=\"done\"]{background:var(--pass-bg);color:var(--pass);border-color:transparent}\n.tierhead{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px}\n.tierhead:first-child{margin-top:0}\n.tierhead .chip{font-size:.68rem}\n.progress{height:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}\n.progress>div{height:100%;background:var(--pass)}\n.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}\n.check:last-child{border-bottom:0}\n.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}\n\n/* Data */\n.data-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}\n.store{display:flex;align-items:center;gap:8px;font-size:.85rem}\n.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}\n.dot.ok{background:var(--pass)}.dot.bad{background:var(--warn)}\n.src{font-size:.72rem;color:var(--muted);font-family:var(--font-mono)}\n.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:.88rem;display:none;z-index:50;max-width:90vw}\n\n/* Demo bar */\n.demobar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:10px 16px;display:none;align-items:center;gap:12px;z-index:40;font-size:.92rem}\n.demobar .lbl{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;border:1px solid currentColor;padding:2px 6px;border-radius:3px;flex:none}\n.demobar .cap{flex:1;min-width:0}\n.demobar .btn{background:transparent;color:inherit;border-color:currentColor}\n\n/* Levels, path, quizzes, sweep */\n.levelchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:6px 10px;text-decoration:none;color:var(--ink);font-size:.82rem;min-height:36px;white-space:nowrap}\n.levelchip b{font-family:var(--font-mono);color:var(--accent)}\n.lk{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);margin-left:4px}\n.lock{border-style:dashed;display:flex;flex-direction:column;gap:8px;align-items:flex-start}\n.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}\n.lvl{display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--line)}\n.lvl.done{border-top-color:var(--pass)} .lvl.current{border-top-color:var(--accent)}\n.lvl .tag{font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}\n.task{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}\n.task .box{width:16px;height:16px;border:1.5px solid var(--line);border-radius:3px;flex:none;margin-top:3px;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff}\n.task.ok .box{background:var(--pass);border-color:var(--pass)}\n.task.ok span{color:var(--muted)}\n.unlocks{font-size:.82rem;color:var(--muted);margin:0;padding-left:18px}\nfieldset.q{border:1px solid var(--line);border-radius:4px;padding:8px 12px;margin:0 0 10px}\nfieldset.q legend{font-weight:600;font-size:.92rem;padding:0 4px}\nfieldset.q.right{border-color:var(--pass)} fieldset.q.wrong{border-color:var(--fail)}\n.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:.9rem;cursor:pointer}\n.opt input{margin-top:4px;accent-color:var(--accent)}\n.expl{font-size:.84rem;margin-top:4px}\n.sweepwrap canvas{width:100%;height:240px;display:block}\n.legendrow{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;font-family:var(--font-mono)}\n.legendrow i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}\n.fitout td{font-family:var(--font-mono);font-size:.82rem}\n@media (max-width: 900px){\n  .ladder{grid-template-columns:1fr}\n  .bench,.career-grid,.data-grid{grid-template-columns:1fr}\n  .vp-slot{position:static}\n  .viewport{height:46vh;min-height:280px}\n  .titleblock{grid-template-columns:1fr auto}\n  .tb-cells{grid-column:1/-1;grid-row:2;border-top:1px solid var(--line);grid-template-columns:repeat(2,minmax(0,1fr))}\n  .tb-name{border-right:0}\n}\n@media (max-width: 420px){\n  main{padding:12px}\n  .fields{grid-template-columns:1fr}\n  .tb-cells{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .tb-cell:nth-child(n+3){display:none}\n}\n@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important;transition:none!important} }\n\n/* ===== F1 tone: shared with the Daily Coach app ===== */\n:root{\n  --paper:#F1F2F4; --panel:rgba(255,255,255,.78); --ink:#15151E; --muted:#5E616C; --line:rgba(21,21,30,.12); --accent:#E1061B;\n  --accent-soft:rgba(225,6,27,.08); --pass:#0E7C3A; --pass-bg:rgba(14,124,58,.10); --fail:#B00515; --fail-bg:rgba(225,6,27,.10); --warn:#8A6400; --warn-bg:rgba(255,199,0,.18);\n  --vp-top:#E6E8EC; --vp-bottom:#FAFAFB;\n  --font-display:-apple-system,BlinkMacSystemFont,\"SF Pro Display\",\"Segoe UI Variable Display\",\"Segoe UI\",system-ui,Roboto,sans-serif;\n  --font-body:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Segoe UI Variable Text\",\"Segoe UI\",system-ui,Roboto,sans-serif;\n  --font-mono:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Segoe UI\",system-ui,Roboto,sans-serif;\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n  --paper:#0A0A0D; --panel:rgba(255,255,255,.055); --ink:#F5F5F7; --muted:#9A9DA8; --line:rgba(255,255,255,.12); --accent:#FF2A3A;\n  --accent-soft:rgba(255,42,58,.14); --pass:#3DDC84; --pass-bg:rgba(61,220,132,.12); --fail:#FF6B6B; --fail-bg:rgba(255,107,107,.14); --warn:#FFC700; --warn-bg:rgba(255,199,0,.12);\n  --vp-top:#1A1A22; --vp-bottom:#0A0A0D; color-scheme:dark; } }\n:root[data-theme=\"dark\"]{\n  --paper:#0A0A0D; --panel:rgba(255,255,255,.055); --ink:#F5F5F7; --muted:#9A9DA8; --line:rgba(255,255,255,.12); --accent:#FF2A3A;\n  --accent-soft:rgba(255,42,58,.14); --pass:#3DDC84; --pass-bg:rgba(61,220,132,.12); --fail:#FF6B6B; --fail-bg:rgba(255,107,107,.14); --warn:#FFC700; --warn-bg:rgba(255,199,0,.12);\n  --vp-top:#1A1A22; --vp-bottom:#0A0A0D; color-scheme:dark; }\nbody{background:radial-gradient(60vw 50vh at 0% 0%,rgba(225,6,27,.10),transparent 70%),radial-gradient(50vw 40vh at 100% 30%,rgba(138,148,166,.18),transparent 70%),var(--paper);background-attachment:fixed;-webkit-font-smoothing:antialiased}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]) body{background:radial-gradient(60vw 50vh at 0% 0%,rgba(225,6,27,.28),transparent 70%),repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 1px,transparent 1px 22px),repeating-linear-gradient(45deg,#0d0d11 0 3px,#09090c 3px 6px);background-attachment:fixed} }\n:root[data-theme=\"dark\"] body{background:radial-gradient(60vw 50vh at 0% 0%,rgba(225,6,27,.28),transparent 70%),repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 1px,transparent 1px 22px),repeating-linear-gradient(45deg,#0d0d11 0 3px,#09090c 3px 6px);background-attachment:fixed}\n.mono,.num{font-variant-numeric:tabular-nums}\n.tb-cell b,th,.trend .meta,.lvl .tag{text-transform:none;letter-spacing:0;font-size:.74rem}\n.demobar .lbl{letter-spacing:0}\n.panel,.titleblock,nav.tabs,.viewport{-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}\n.panel{border-radius:20px;border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 2px rgba(10,10,14,.05),0 12px 30px -16px rgba(10,10,14,.28)}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]) .panel{border-color:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 34px -18px rgba(0,0,0,.8)} }\n:root[data-theme=\"dark\"] .panel{border-color:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 34px -18px rgba(0,0,0,.8)}\n.titleblock{background:var(--panel);border-bottom:0;box-shadow:inset 0 -3px 0 var(--accent)}\n.tb-name h1{font-style:italic;font-weight:800;letter-spacing:-.02em;font-size:1.25rem}\n.tb-name h1::after{content:\"\";display:block;width:64px;height:5px;margin-top:6px;border-radius:2px;background:repeating-linear-gradient(90deg,#E1061B 0 10px,#fff 10px 20px);box-shadow:0 0 0 1px rgba(21,21,30,.14)}\nnav.tabs{background:var(--panel)}\nnav.tabs a{font-weight:600}\nnav.tabs a[aria-current=\"page\"]{border-bottom-color:var(--accent);color:var(--accent)}\nh2{font-weight:750;letter-spacing:-.02em}\n.viewport{border-radius:18px}\n.btn,.levelchip,.statusbtn{border-radius:999px}\n.btn.primary{background:linear-gradient(165deg,#FF2A3A,#E1061B 60%,#A80314);border-color:transparent;box-shadow:0 8px 18px -8px rgba(225,6,27,.6)}\n.seg{border-radius:14px}\n@media (max-width:900px){.tb-actions{grid-column:1/-1;grid-row:3;flex-wrap:wrap;justify-content:flex-start;padding:4px 16px 12px}}\n.field .inp{border-radius:12px}\n.chip{border-radius:999px;font-family:var(--font-body)}\n.trend{border-top:0;box-shadow:inset 0 3px 0 var(--accent),inset 0 1px 0 rgba(255,255,255,.6),0 12px 30px -16px rgba(10,10,14,.28)}\n.trend.user{box-shadow:inset 0 3px 0 #A855F7,0 12px 30px -16px rgba(10,10,14,.28)}\n.coachlink{border-color:var(--accent);color:var(--accent);font-weight:600}\n.toast{border-radius:999px}\nhtml,body{background:transparent!important}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"titleblock\">\n  \u003cdiv class=\"tb-name\">\u003ch1>Mechanical Engineering Lab\u003c/h1>\u003cspan>Drawing MEL-2026 · sheet 1 of 6\u003c/span>\u003c/div>\n  \u003cdiv class=\"tb-cells\">\n    \u003cdiv class=\"tb-cell\">\u003cb>Units\u003c/b>\u003cspan>mm · N · MPa · °C\u003c/span>\u003c/div>\n    \u003cdiv class=\"tb-cell\">\u003cb>Data\u003c/b>\u003cspan id=\"tbData\">Checking…\u003c/span>\u003c/div>\n    \u003cdiv class=\"tb-cell\">\u003cb>Part\u003c/b>\u003cspan>MB-01 bracket\u003c/span>\u003c/div>\n    \u003cdiv class=\"tb-cell\">\u003cb>Revised\u003c/b>\u003cspan>29 Oct 2026\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"tb-actions\">\u003ca class=\"levelchip\" href=\"#path\" id=\"levelChip\">Level \u003cb>Beginner\u003c/b>\u003c/a>\u003cbutton class=\"btn primary\" id=\"demoBtn\" type=\"button\">Run demo\u003c/button>\u003c/div>\n\u003c/header>\n\u003cnav class=\"tabs\" aria-label=\"Sections\">\n  \u003ca href=\"#trends\" data-tab=\"trends\">Trends\u003c/a>\n  \u003ca href=\"#path\" data-tab=\"path\">Path\u003c/a>\n  \u003ca href=\"#cad\" data-tab=\"cad\">CAD theory\u003c/a>\n  \u003ca href=\"#tests\" data-tab=\"tests\">Test bench\u003c/a>\n  \u003ca href=\"#career\" data-tab=\"career\">Career\u003c/a>\n  \u003ca href=\"#data\" data-tab=\"data\">Data\u003c/a>\n\u003c/nav>\n\n\u003cmain>\n\u003c!-- TRENDS -->\n\u003csection class=\"view\" id=\"view-trends\">\n  \u003cdiv class=\"view-head\">\n    \u003cdiv>\u003ch2>What's moving in mechanical engineering, late 2026\u003c/h2>\n    \u003cp class=\"lede\">Six trends from current industry and research sources. Each one links to the part of this lab where you practise the skill behind it.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"trend-grid\" id=\"trendGrid\">\u003c/div>\n\u003c/section>\n\n\u003c!-- PATH -->\n\u003csection class=\"view\" id=\"view-path\">\n  \u003cdiv class=\"view-head\">\n    \u003cdiv>\u003ch2>Your path: Beginner → Intermediate → Advanced\u003c/h2>\n    \u003cp class=\"lede\">Each level unlocks harder cases and tools. Tasks tick themselves when you do them in the lab. Pass the checkpoint quiz (4 out of 5) to finish a level.\u003c/p>\u003c/div>\n    \u003clabel class=\"check\" style=\"border:0;padding:0\">\u003cinput type=\"checkbox\" id=\"freeMode\">\u003cspan>Unlock everything (skip the path)\u003c/span>\u003c/label>\n  \u003c/div>\n  \u003cdiv class=\"ladder\" id=\"pathLadder\">\u003c/div>\n  \u003cdiv class=\"stack\" id=\"pathQuizzes\" style=\"margin-top:14px\">\u003c/div>\n\u003c/section>\n\n\u003c!-- CAD -->\n\u003csection class=\"view\" id=\"view-cad\">\n  \u003cdiv class=\"view-head\">\n    \u003cdiv>\u003ch2>CAD theory: building bracket MB-01 feature by feature\u003c/h2>\n    \u003cp class=\"lede\">Works the way SOLIDWORKS does: a plane, a sketch, then features stacked in a tree. Tap any feature in the tree to roll back to it.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"bench\">\n    \u003cdiv class=\"vp-slot\" id=\"slot-cad\">\u003c/div>\n    \u003cdiv class=\"stack\">\n      \u003cdiv class=\"panel stack\">\n        \u003cdiv class=\"stepper\">\n          \u003cbutton class=\"btn\" id=\"cadPrev\" type=\"button\">Previous\u003c/button>\n          \u003cbutton class=\"btn primary\" id=\"cadNext\" type=\"button\">Next feature\u003c/button>\n          \u003cspan class=\"count\" id=\"cadCount\">\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"theory\" id=\"cadTheory\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"panel\">\n        \u003ch3 style=\"margin-bottom:8px\">FeatureManager design tree\u003c/h3>\n        \u003cul class=\"tree\" id=\"cadTree\">\u003c/ul>\n      \u003c/div>\n      \u003cdiv class=\"panel\" id=\"cadMassPanel\">\u003c/div>\n      \u003cdiv id=\"fitsPanel\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- TESTS -->\n\u003csection class=\"view\" id=\"view-tests\">\n  \u003cdiv class=\"view-head\">\n    \u003cdiv>\u003ch2>Test bench: real-life load cases\u003c/h2>\n    \u003cp class=\"lede\">Each case starts as a design that fails. Change the inputs yourself, or press Improve to fix it one revision at a time and read why each change was made.\u003c/p>\u003c/div>\n    \u003cdiv class=\"seg\" id=\"scenarioSeg\" role=\"group\" aria-label=\"Scenario\">\n      \u003cbutton type=\"button\" data-sc=\"beam\" aria-pressed=\"true\">Shelf bracket\u003c/button>\n      \u003cbutton type=\"button\" data-sc=\"gear\" aria-pressed=\"false\">Gear drive\u003c/button>\n      \u003cbutton type=\"button\" data-sc=\"rail\" aria-pressed=\"false\">Rail in summer\u003c/button>\n      \u003cbutton type=\"button\" data-sc=\"arm\" aria-pressed=\"false\">Robot arm\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"bench\">\n    \u003cdiv class=\"vp-slot\" id=\"slot-tests\">\u003c/div>\n    \u003cdiv class=\"stack\" id=\"testPanel\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- CAREER -->\n\u003csection class=\"view\" id=\"view-career\">\n  \u003cdiv class=\"view-head\">\n    \u003cdiv>\u003ch2>Licences, certificates and hiring must-haves\u003c/h2>\n    \u003cp class=\"lede\">Built for the Thermo Machine Operator role at Huhtamaki, Gosport, and for the step up to setter, technician and engineer. Tap a status to cycle To do → Booked → Done. Prices are typical UK figures from October 2026; check before booking.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"career-grid\">\n    \u003cdiv class=\"panel\" id=\"certList\">\u003c/div>\n    \u003cdiv class=\"stack\">\n      \u003cdiv class=\"panel stack\">\n        \u003ch3>Your progress\u003c/h3>\n        \u003cdiv class=\"progress\">\u003cdiv id=\"careerBar\" style=\"width:0%\">\u003c/div>\u003c/div>\n        \u003cp class=\"mono\" id=\"careerPct\" style=\"font-size:.82rem\">\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"panel\">\n        \u003ch3 style=\"margin-bottom:6px\">Hiring process must-haves\u003c/h3>\n        \u003cdiv id=\"hireList\">\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"interviewBox\">\u003c/div>\n      \u003cdiv class=\"panel stack\">\n        \u003ch3>Add a licence or certificate\u003c/h3>\n        \u003cform id=\"certForm\" class=\"fields\">\n          \u003cdiv class=\"field wide\">\u003clabel for=\"cfName\">Name\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"cfName\" required placeholder=\"e.g. Abrasive wheels\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel for=\"cfCost\">Typical cost\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"cfCost\" placeholder=\"£\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel for=\"cfTime\">Time\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"cfTime\" placeholder=\"1 day\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"field wide\">\u003clabel for=\"cfWhy\">Why it helps\u003c/label>\u003cdiv class=\"inp\">\u003ctextarea id=\"cfWhy\">\u003c/textarea>\u003c/div>\u003c/div>\n          \u003cdiv class=\"field wide\">\u003cbutton class=\"btn primary\" type=\"submit\">Add to list\u003c/button>\u003c/div>\n        \u003c/form>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- DATA -->\n\u003csection class=\"view\" id=\"view-data\">\n  \u003cdiv class=\"view-head\">\n    \u003cdiv>\u003ch2>Data: add now, use later\u003c/h2>\n    \u003cp class=\"lede\">Everything you add here feeds the lab: new materials appear in the CAD and test bench pickers, trends join the Trends page, and saved test revisions build a log. Export a backup at any time.\u003c/p>\u003c/div>\n    \u003cdiv class=\"store\">\u003cspan class=\"dot\" id=\"storeDot\">\u003c/span>\u003cspan id=\"storeText\">Checking storage…\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"data-grid\">\n    \u003cdiv class=\"panel stack\">\n      \u003ch3>Materials\u003c/h3>\n      \u003cdiv class=\"tablewrap\">\u003ctable id=\"matTable\">\u003c/table>\u003c/div>\n      \u003cform id=\"matForm\" class=\"fields\">\n        \u003cdiv class=\"field wide\">\u003clabel for=\"mfName\">Material name\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"mfName\" required placeholder=\"e.g. EN8 carbon steel\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"mfE\">Young's modulus E\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"mfE\" type=\"number\" step=\"any\" min=\"0.01\" required>\u003cspan class=\"unit\">GPa\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"mfSy\">Yield strength σy\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"mfSy\" type=\"number\" step=\"any\" min=\"1\" required>\u003cspan class=\"unit\">MPa\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"mfRho\">Density ρ\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"mfRho\" type=\"number\" step=\"any\" min=\"0.01\" required>\u003cspan class=\"unit\">g/cm³\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"mfA\">Expansion α\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"mfA\" type=\"number\" step=\"any\" min=\"0\" required>\u003cspan class=\"unit\">µm/m·°C\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"field wide\">\u003clabel for=\"mfNote\">Source or note\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"mfNote\" placeholder=\"datasheet, supplier, standard\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"field wide\">\u003cbutton class=\"btn primary\" type=\"submit\">Add material\u003c/button>\u003c/div>\n      \u003c/form>\n    \u003c/div>\n    \u003cdiv class=\"stack\">\n      \u003cdiv class=\"panel stack\">\n        \u003ch3>Add a trend\u003c/h3>\n        \u003cform id=\"trendForm\" class=\"fields\">\n          \u003cdiv class=\"field wide\">\u003clabel for=\"tfTitle\">Trend\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"tfTitle\" required placeholder=\"e.g. Hydrogen-ready boilers\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"field wide\">\u003clabel for=\"tfNote\">What it means\u003c/label>\u003cdiv class=\"inp\">\u003ctextarea id=\"tfNote\">\u003c/textarea>\u003c/div>\u003c/div>\n          \u003cdiv class=\"field wide\">\u003clabel for=\"tfSrc\">Source link\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"tfSrc\" type=\"url\" placeholder=\"https://\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"field wide\">\u003cbutton class=\"btn primary\" type=\"submit\">Add trend\u003c/button>\u003c/div>\n        \u003c/form>\n      \u003c/div>\n      \u003cdiv class=\"panel stack\">\n        \u003ch3>Saved test revisions\u003c/h3>\n        \u003cdiv class=\"tablewrap\">\u003ctable id=\"runTable\">\u003c/table>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"panel stack\">\n        \u003ch3>Backup and restore\u003c/h3>\n        \u003cp style=\"font-size:.88rem;color:var(--muted)\">The backup is one JSON file holding your materials, trends, test revisions, certificates and career progress. Keep a copy in Google Drive or email it to yourself.\u003c/p>\n        \u003cdiv class=\"stepper\">\n          \u003cbutton class=\"btn\" id=\"copyJson\" type=\"button\">Copy backup\u003c/button>\n          \u003cbutton class=\"btn\" id=\"dlJson\" type=\"button\" hidden>Download backup (.json)\u003c/button>\n          \u003cbutton class=\"btn\" id=\"dlCsv\" type=\"button\" hidden>Download test log (.csv)\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"importBox\">Restore: paste a backup here or choose a file\u003c/label>\u003cdiv class=\"inp\">\u003ctextarea id=\"importBox\" placeholder='{\"version\":1, ...}'>\u003c/textarea>\u003c/div>\u003c/div>\n        \u003cdiv class=\"stepper\">\n          \u003cinput type=\"file\" id=\"importFile\" accept=\".json,application/json\">\n          \u003cbutton class=\"btn primary\" id=\"importBtn\" type=\"button\">Import\u003c/button>\n        \u003c/div>\n        \u003cdetails class=\"working\">\u003csummary>Data format for adding records later\u003c/summary>\n\u003cpre>{\n \"version\": 1,\n \"materials\": [{\"name\":\"EN8 steel\",\"E\":210,\"sy\":465,\"rho\":7.85,\"alpha\":11.5,\"note\":\"BS 970 080M40\"}],\n \"trends\":    [{\"title\":\"...\",\"note\":\"...\",\"source\":\"https://...\"}],\n \"certs\":     [{\"name\":\"...\",\"cost\":\"£..\",\"time\":\"1 day\",\"why\":\"...\"}],\n \"runs\":      [ saved automatically from the Test bench ],\n \"careerStatus\": {\"food-l2\":\"done\"}\n}\u003c/pre>\u003c/details>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cdiv id=\"vpHome\" hidden>\n  \u003cdiv class=\"viewport\" id=\"viewport\">\n    \u003cdiv class=\"vp-hud\" id=\"vpHud\">\u003c/div>\n    \u003cdiv class=\"vp-legend\" id=\"vpLegend\">\u003cdiv class=\"row\">\u003cdiv class=\"ramp\">\u003c/div>\u003cdiv class=\"ticks\">\u003cspan id=\"lg1\">σy\u003c/span>\u003cspan id=\"lg2\">\u003c/span>\u003cspan id=\"lg3\">\u003c/span>\u003cspan id=\"lg4\">0\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"vp-fallback\" id=\"vpFallback\">\u003cp>The 3D view needs WebGL and the three.js library. Calculations, revisions and data still work below.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"vp-toolbar\" id=\"vpToolbar\">\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"View orientation\">\n      \u003cbutton type=\"button\" data-view=\"iso\" aria-pressed=\"true\">Iso\u003c/button>\n      \u003cbutton type=\"button\" data-view=\"front\" aria-pressed=\"false\">Front\u003c/button>\n      \u003cbutton type=\"button\" data-view=\"top\" aria-pressed=\"false\">Top\u003c/button>\n      \u003cbutton type=\"button\" data-view=\"right\" aria-pressed=\"false\">Right\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Display style\" id=\"displaySeg\">\n      \u003cbutton type=\"button\" data-disp=\"edges\" aria-pressed=\"true\">Shaded + edges\u003c/button>\n      \u003cbutton type=\"button\" data-disp=\"wire\" aria-pressed=\"false\">Wireframe\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"btn small\" type=\"button\" id=\"planesBtn\" aria-pressed=\"true\">Planes\u003c/button>\n    \u003cbutton class=\"btn small\" type=\"button\" id=\"sectionBtn\" aria-pressed=\"false\">Section view\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"demobar\" id=\"demobar\" role=\"status\">\u003cspan class=\"lbl\">Demo\u003c/span>\u003cspan class=\"cap\" id=\"demoCap\">\u003c/span>\u003cbutton class=\"btn small\" type=\"button\" id=\"demoStop\">Stop\u003c/button>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\">\u003c/script>\n\u003cscript>\n\"use strict\";\n/* ============================== DATA ============================== */\nconst BUILTIN_MATERIALS = [\n  {id:\"s275\", name:\"S275 structural steel\", E:210, sy:275, rho:7.85, alpha:12, note:\"EN 10025-2, typical\"},\n  {id:\"aisi1020\", name:\"AISI 1020 steel, cold drawn\", E:205, sy:350, rho:7.87, alpha:11.7, note:\"typical\"},\n  {id:\"rail\", name:\"R260 rail steel\", E:210, sy:480, rho:7.85, alpha:11.5, note:\"EN 13674-1, typical\"},\n  {id:\"al6061\", name:\"6061-T6 aluminium\", E:69, sy:276, rho:2.70, alpha:23.6, note:\"typical\"},\n  {id:\"ss304\", name:\"304 stainless steel\", E:193, sy:215, rho:8.00, alpha:17.3, note:\"annealed, typical\"},\n  {id:\"ti64\", name:\"Ti-6Al-4V titanium\", E:114, sy:880, rho:4.43, alpha:8.6, note:\"typical\"},\n  {id:\"pla\", name:\"PLA (3D printed)\", E:3.5, sy:50, rho:1.24, alpha:68, note:\"varies with print settings\"},\n  {id:\"apet\", name:\"APET sheet (thermoformed trays)\", E:2.7, sy:55, rho:1.34, alpha:65, note:\"typical\"}\n];\nconst BUILTIN_TRENDS = [\n  {id:\"t-ai-cad\", tag:\"Design software\", title:\"AI inside CAD\",\n   body:\"SOLIDWORKS 2026 brought AI features into everyday modelling. The 2026x FD01 release added prompt-guided drawing generation, root-cause analysis for part failures and an assembly structure generator. Student licences of SOLIDWORKS Design Standard have been free since 1 July 2026.\",\n   why:\"AI can write features for you, but it can only follow design intent you understand. Clean sketches, sensible references and a readable feature tree matter more now.\",\n   link:\"cad\", linkText:\"Practise design intent\", src:\"https://www.3ds.com/newsroom/media-alerts/dassault-systemes-announces-solidworks-2026-ai-powered-design-and-collaboration-generative-economy\", srcName:\"Dassault Systèmes\"},\n  {id:\"t-twin\", tag:\"Simulation\", title:\"Digital twins go mainstream\",\n   body:\"Early 2026 is widely described as the point where digital twins moved from pilot projects into production use. Siemens showed a Digital Twin Composer built with NVIDIA Omniverse at CES 2026.\",\n   why:\"A twin is a model driven by live inputs. The test bench works the same way on a small scale: change an input and the model and the checks update at once.\",\n   link:\"tests\", linkText:\"Open the test bench\", src:\"https://inzonex.co.uk/ai/reports/state-of-digital-twins-in-manufacturing-2026\", srcName:\"Inzonex report\"},\n  {id:\"t-gen-am\", tag:\"Manufacturing\", title:\"Generative design for 3D printing\",\n   body:\"Algorithms explore many candidate shapes from loads, supports and manufacturing limits. Research in 2026 focuses on stress-driven lattices and process simulation, and the best generative tools are closing the gap between optimised shapes and parts that actually print.\",\n   why:\"The idea behind it is removing material that carries no load. The shelf bracket's last revision does this by hand: it keeps the strength and stiffness and cuts the mass.\",\n   link:\"tests\", linkText:\"See the mass cut\", src:\"https://www.epj-conferences.org/10.1051/epjconf/202635502013\", srcName:\"EPJ Web of Conferences\"},\n  {id:\"t-hybrid\", tag:\"Manufacturing\", title:\"Hybrid print-and-machine cells\",\n   body:\"Additive manufacturing is now treated as a production tool. 2026 shops increasingly print a near-net shape and finish the critical faces by CNC in the same workflow.\",\n   why:\"Printed parts still need machined holes and faces where fits matter. Know your clearance holes and fits, and know which faces a machinist has to reach.\",\n   link:\"cad\", linkText:\"Hole sizes and fits\", src:\"https://facfox.com/news/beyond-the-hype-10-industrial-trends-redefining-3d-printing-in-2026/\", srcName:\"FacFox\"},\n  {id:\"t-mechatronics\", tag:\"Skills\", title:\"Mechatronics and automation\",\n   body:\"More mechanical roles now ask for sensors, actuators, controllers and some programming. Employers describe the target as a T-shaped engineer: deep mechanical fundamentals with broad digital skills.\",\n   why:\"Most automated lines still turn on gears, belts and motors sized by hand. The gear drive case is motor-to-load sizing, which is daily work in automation.\",\n   link:\"tests\", linkText:\"Size a gear drive\", src:\"https://www.shework.in/mechanical-engineer-hiring-india-trends-tips/\", srcName:\"SheWork\"},\n  {id:\"t-sustain\", tag:\"Careers\", title:\"Sustainability and renewables\",\n   body:\"Renewable energy is the clearest growth sector for mechanical graduates in 2026. Lighter parts, longer life and recyclable packaging all come back to material choice and load paths.\",\n   why:\"Thermal movement, fatigue and material efficiency are core in energy and infrastructure work. The rail case is a classic thermal design problem.\",\n   link:\"tests\", linkText:\"Run the thermal case\", src:\"https://www.myengineeringbuddy.com/blog/mechanical-engineering-job-market/\", srcName:\"MyEngineeringBuddy\"},\n  {id:\"t-robotics\", tag:\"Robotics\", title:\"Low-cost open robotics (LeRobot)\",\n   body:\"Hugging Face's LeRobot is an open-source Python library for real robots. It supports low-cost arms such as the SO-100 and SO-101, has a web interface (LeLab) for calibrating, recording and training without the command line, and is licensed under Apache 2.0.\",\n   why:\"A robot arm combines statics, servo sizing, materials and code in one build, which makes it strong evidence of practical skill on a CV. Size the arm on paper before buying parts.\",\n   link:\"tests\", linkText:\"Size a robot arm (Advanced)\", src:\"https://github.com/huggingface/lerobot\", srcName:\"GitHub: huggingface/lerobot\"}\n];\nconst BUILTIN_CERTS = [\n  {tier:\"role\", id:\"food-l2\", name:\"Level 2 Food Safety & Hygiene for Manufacturing\", cost:\"£15–25 online\", time:\"2–3 hours\",\n   why:\"The Gosport thermo operator advert asks you to keep hygiene and BRC standards. This is the cheapest, fastest certificate that matches it word for word. Do it before the final interview.\"},\n  {id:\"iosh-ws\", tier:\"role\", name:\"IOSH Working Safely\", cost:\"£65–150 online\", time:\"About 1 day\",\n   why:\"A recognised safety certificate that is valid for life. It covers hazards, risk and safety performance, and it gives you the safety vocabulary interviewers listen for.\"},\n  {id:\"brcgs\", tier:\"role\", name:\"BRCGS Packaging Materials standard (awareness)\", cost:\"Free to read\", time:\"2 evenings\",\n   why:\"Huhtamaki sites work to this food-packaging standard. Learn its six areas: senior management commitment, hazard and risk management, product safety and quality management, site standards, product and process control, and personnel. Then name it in your interview.\"},\n  {id:\"flt\", tier:\"role\", name:\"Counterbalance forklift, novice (RTITB / AITT / ITSSAR)\", cost:\"£400–800\", time:\"3–5 days\",\n   why:\"Thermoforming operator adverts often ask for a forklift licence or the ability to get one. There is no DVSA forklift licence; employers accept accredited certificates, and RTITB cards are typically valid for 3 years. Ask Huhtamaki first, because many employers pay for it at induction.\"},\n  {id:\"manual-coshh\", tier:\"role\", name:\"Manual handling + COSHH awareness\", cost:\"Low-cost online\", time:\"1–2 hours each\",\n   why:\"Short courses usually covered at induction. Holding them already shows you are ready to start on day one.\"},\n  {id:\"lss-yb\", tier:\"step\", name:\"Lean Six Sigma Yellow Belt (accredited)\", cost:\"About £95 for an ILSSI-accredited one\", time:\"1–2 days\",\n   why:\"Continuous improvement is part of the operator job description. Choose an accredited provider (ILSSI, or ISO 18404 aligned). A £12 'CPD' certificate carries little weight with employers.\"},\n  {id:\"efaw\", tier:\"step\", name:\"Emergency First Aid at Work\", cost:\"Varies by provider\", time:\"1 day\",\n   why:\"Shift teams need trained first aiders, so this makes you useful straight away. It is valid for 3 years.\"},\n  {id:\"cswa\", tier:\"eng\", name:\"SOLIDWORKS CSWA (Certified Associate)\", cost:\"$99 exam\", time:\"3 hour exam\",\n   why:\"Recognised proof of CAD skill for design, tooling and setter roles. Practise in the CAD theory tab first.\"},\n  {id:\"imeche\", tier:\"eng\", name:\"IMechE Associate Member (AMIMechE)\", cost:\"Application fee + yearly subscription\", time:\"Online form\",\n   why:\"Graduates with a STEM degree can join. It starts your route to IEng/CEng, and a 2:2 does not block it. An accredited BEng fully meets the academic requirement for IEng.\"},\n  {id:\"rb-python\", tier:\"robot\", name:\"Python basics\", cost:\"Free (python.org tutorial)\", time:\"2–3 weeks of evenings\",\n   why:\"LeRobot is driven from Python. You need variables, loops, functions, installing packages with pip, and reading error messages.\"},\n  {id:\"rb-install\", tier:\"robot\", name:\"Install LeRobot and run lerobot-info\", cost:\"Free\", time:\"1 evening\",\n   why:\"`pip install lerobot`, then `lerobot-info` to confirm it works. For an SO-101 arm, add the extras for its Feetech servos: `pip install 'lerobot[core_scripts,feetech]'`.\"},\n  {id:\"rb-size\", tier:\"robot\", name:\"Size the arm in the Robot arm case\", cost:\"Free\", time:\"1 hour\",\n   why:\"Check shoulder torque, elbow torque and tip accuracy for your payload before you buy servos. This is the engineering judgement employers look for.\"},\n  {id:\"rb-build\", tier:\"robot\", name:\"Build an SO-101 arm\", cost:\"Check the official build guide for current parts and prices\", time:\"A weekend or two\",\n   why:\"Most parts are printed, and the arm uses serial-bus servos. Record what went wrong during assembly; those notes become interview stories.\"},\n  {id:\"rb-lelab\", tier:\"robot\", name:\"Calibrate and teleoperate with LeLab\", cost:\"Free\", time:\"1 evening\",\n   why:\"LeLab is LeRobot's web interface for calibrating, teleoperating, recording and training an SO arm without the command line.\"},\n  {id:\"rb-train\", tier:\"robot\", name:\"Record a dataset and train a policy\", cost:\"Free (GPU time optional)\", time:\"1–2 weeks\",\n   why:\"Teach the arm a pick-and-place by demonstration. That gives you a complete project: design, build, calibrate, train, test.\"},\n  {id:\"rb-licence\", tier:\"robot\", name:\"Licence check before sharing your project\", cost:\"Free\", time:\"10 minutes\",\n   why:\"LeRobot is Apache 2.0, with some parts under MIT. If you share code that includes theirs, keep their licence and copyright notices and mark files you changed. You can say 'built with LeRobot', but don't use the Hugging Face name or logo as if they endorse your project. This is not legal advice.\"}\n];\nconst TIERS = {role:[\"For the Thermo Operator role\",\"Get now\"], step:[\"Step up to setter / lead operator\",\"Next 6 months\"], eng:[\"Engineering career path\",\"Longer term\"], robot:[\"Robotics build: SO-101 + LeRobot\",\"Portfolio project\"]};\nconst HIRING = [\n  {id:\"h-rtw\", text:\"Right-to-work documents and two references ready to hand over\"},\n  {id:\"h-cv\", text:\"CV uses the advert's own words: hygiene and BRC standards, fault finding, shift handovers, minimum waste, machine adjustments\"},\n  {id:\"h-degree\", text:\"CV line that turns the degree into shop-floor value: reading drawings, measuring, root-cause problem solving\"},\n  {id:\"h-process\", text:\"Can explain the thermoforming cycle: heat sheet → form (vacuum or pressure, plug assist) → cool → trim → stack\"},\n  {id:\"h-defects\", text:\"Know common defects and first checks: webbing, thin corners, blisters, poor detail, warping\"},\n  {id:\"h-assess\", text:\"Practised for the technical assessment: vernier and micrometer reading, unit conversions, basic gears and levers, temperature and pressure settings\"},\n  {id:\"h-star\", text:\"Three STAR stories ready: a fault you found, a time you worked safely under pressure, something you improved\"},\n  {id:\"h-shift\", text:\"Clear answer on shift availability and reliable transport (a driving licence helps but is not legally needed for forklifts)\"},\n  {id:\"h-ask\", text:\"Questions ready to ask: training plan, route to setter, which machines and tools you would run\"}\n];\n\n/* ============================== LEVELS + QUIZZES ============================== */\nconst LEVELS = [\"Beginner\",\"Intermediate\",\"Advanced\"];\nconst PATH_TASKS = {\n  1:[{id:\"cad-done\", text:\"Build bracket MB-01 to the last feature in CAD theory\", go:\"cad\"},\n     {id:\"beam-pass\", text:\"Get the shelf bracket to PASS\", go:\"tests\"},\n     {id:\"rail-pass\", text:\"Get the rail case to PASS\", go:\"tests\"},\n     {id:\"cp1\", text:\"Score 4 or 5 out of 5 on Checkpoint 1\", go:\"path\"}],\n  2:[{id:\"gear-pass\", text:\"Get the gear drive to PASS\", go:\"tests\"},\n     {id:\"fits-used\", text:\"Check a fit in the Fits & tolerances panel (CAD theory)\", go:\"cad\"},\n     {id:\"runs3\", text:\"Save three test revisions to Data\", go:\"tests\"},\n     {id:\"cp2\", text:\"Score 4 or 5 out of 5 on Checkpoint 2\", go:\"path\"}],\n  3:[{id:\"arm-pass\", text:\"Get the robot arm to PASS\", go:\"tests\"},\n     {id:\"sweep-used\", text:\"Run a design sweep on any test case\", go:\"tests\"},\n     {id:\"cp3\", text:\"Score 4 or 5 out of 5 on Checkpoint 3\", go:\"path\"}]\n};\nconst UNLOCKS = {\n  1:[\"CAD theory: 10 feature steps\",\"Shelf bracket and rail cases\",\"Career tracker, data and backups\"],\n  2:[\"Gear drive case\",\"Fits & tolerances calculator (ISO 286)\",\"Section view in CAD\",\"Interview practice quiz\"],\n  3:[\"Robot arm case (LeRobot-style)\",\"Design sweep charts on every case\",\"Max payload and dynamic torque\"]\n};\nconst QUIZ = {\n cp1:[\n  {q:\"In a SOLIDWORKS sketch, blue lines mean the sketch is…\", o:[\"Fully defined\",\"Under defined\",\"Over defined\",\"Construction geometry\"], a:1, e:\"Blue means it can still move. Black is fully defined, and red means conflicting dimensions or relations.\"},\n  {q:\"For a cantilever with an end load, tip deflection grows with length as…\", o:[\"L\",\"L²\",\"L³\",\"L⁴\"], a:2, e:\"δ = FL³/(3EI). Double the length and the sag goes up 8 times.\"},\n  {q:\"You double the thickness h of a flat bar loaded in bending. Bending stress becomes…\", o:[\"Half\",\"A quarter\",\"An eighth\",\"Unchanged\"], a:1, e:\"σ = 6FL/(bh²), so σ ∝ 1/h². Doubling h divides stress by 4 (and deflection by 8, since I ∝ h³).\"},\n  {q:\"A 10 m steel rail (α = 11.5×10⁻⁶ /°C) heats up by 40 °C. Free expansion is about…\", o:[\"0.46 mm\",\"4.6 mm\",\"46 mm\",\"0.046 mm\"], a:1, e:\"ΔL = α·L·ΔT = 11.5e-6 × 10 000 mm × 40 = 4.6 mm.\"},\n  {q:\"Factor of safety against yield is…\", o:[\"Working stress ÷ yield strength\",\"Yield strength ÷ working stress\",\"Load × length\",\"Yield strength − working stress\"], a:1, e:\"FoS = σy/σ. A value of 2 means the part could take twice the stress before yielding.\"}\n ],\n cp2:[\n  {q:\"Why avoid very few teeth on a 20° pressure angle pinion?\", o:[\"It runs too quietly\",\"The cutter undercuts the tooth root and weakens it\",\"It increases the gear ratio\",\"It needs more lubrication\"], a:1, e:\"Below about 17 teeth the generating cutter removes material at the root (undercut), which thins the tooth exactly where bending stress peaks.\"},\n  {q:\"A 20-tooth pinion on a 1500 rpm motor drives a 60-tooth gear. Ignoring losses, the output is…\", o:[\"4500 rpm, torque ÷3\",\"500 rpm, torque ×3\",\"500 rpm, torque ÷3\",\"1500 rpm, torque ×3\"], a:1, e:\"Ratio 3:1. Speed falls by 3 and torque rises by 3, because power = torque × speed is conserved (minus losses).\"},\n  {q:\"An H7/g6 fit is a…\", o:[\"Clearance (sliding) fit\",\"Transition fit\",\"Interference fit\",\"Shrink fit\"], a:0, e:\"The g shaft is always below the H hole's lower limit, so there is always clearance. It's used for locating pins and parts that must slide.\"},\n  {q:\"Rails jammed end to end keep heating. The compressive stress…\", o:[\"Stays at zero\",\"Rises about 2.4 MPa per °C\",\"Falls as the steel softens\",\"Turns to tension\"], a:1, e:\"Blocked thermal strain gives σ = E·α·ΔT = 210 000 × 11.5e-6 ≈ 2.4 MPa for every extra degree.\"},\n  {q:\"In the Lewis equation, increasing the module (all else equal) makes tooth bending stress…\", o:[\"Rise\",\"Fall\",\"Stay the same\",\"Become negative\"], a:1, e:\"Module enters twice: a thicker tooth section (b·m·Y), and a bigger pitch diameter that lowers the tangential force Ft = 2T/d.\"}\n ],\n cp3:[\n  {q:\"A robot arm is held horizontal. Which joint needs the most torque?\", o:[\"Gripper\",\"Wrist\",\"Elbow\",\"Shoulder\"], a:3, e:\"The shoulder carries every mass downstream of it, at the longest lever arms.\"},\n  {q:\"Shoulder torque on a horizontal arm is dominated by the payload. Halving the reach changes it by about…\", o:[\"÷2\",\"÷4\",\"÷8\",\"No change\"], a:0, e:\"For a point load, torque = m·g·r, which is linear in r. Link self-weight adds a smaller term.\"},\n  {q:\"A 16 kg·cm servo drives through a 2:1 reduction that is 90% efficient. Available torque is…\", o:[\"8 kg·cm\",\"16 kg·cm\",\"28.8 kg·cm\",\"32 kg·cm\"], a:2, e:\"16 × 2 × 0.9 = 28.8 kg·cm, at half the speed.\"},\n  {q:\"0.5° of backlash at the shoulder of a 260 mm arm moves the tip by about…\", o:[\"0.23 mm\",\"2.3 mm\",\"23 mm\",\"0.5 mm\"], a:1, e:\"Arc length = r·θ = 260 × 0.5 × π/180 ≈ 2.27 mm. On small arms, backlash usually costs more accuracy than link bending.\"},\n  {q:\"A design sweep shows every check below 1.0 between h = 18 mm and h = 40 mm. Usually the best pick is…\", o:[\"40 mm, for maximum safety\",\"The smallest stock size inside the pass band\",\"Halfway, at 29 mm\",\"Anything outside the band\"], a:1, e:\"The lightest, cheapest option that passes every check, rounded up to a stock size. Extra margin costs mass and money.\"}\n ],\n interview:[\n  {q:\"Thermoformed cups come out with thin corners. What do you check first?\", o:[\"Pallet labels\",\"Sheet temperature in those zones and the plug assist depth and timing\",\"Trim press speed\",\"Stacker count\"], a:1, e:\"Thin corners mean the material stretched too far before touching the mould. Lower the heat in that zone and check that the plug assist pre-stretches material into the corners.\"},\n  {q:\"Webbing (folds of plastic between cavities) is usually caused by…\", o:[\"Sheet too hot or sagging too much, or too much material in that area\",\"Not enough cooling water\",\"Trim tool too sharp\",\"Low line speed\"], a:0, e:\"Overheated sheet sags and folds over itself. Reduce heat in that zone, improve vacuum timing, or add web catchers to the tool.\"},\n  {q:\"Vernier calliper, 0.02 mm resolution: the main scale shows 12 mm and vernier line 7 aligns. The reading is…\", o:[\"12.07 mm\",\"12.14 mm\",\"12.70 mm\",\"19.00 mm\"], a:1, e:\"12 + 7 × 0.02 = 12.14 mm.\"},\n  {q:\"Metric micrometer: the sleeve shows 5.5 mm and the thimble reads 28. The reading is…\", o:[\"5.28 mm\",\"5.78 mm\",\"8.30 mm\",\"5.528 mm\"], a:1, e:\"Sleeve 5.50 + thimble 28 × 0.01 = 5.78 mm.\"},\n  {q:\"A part is jammed inside the guarding. Before you reach in, you must…\", o:[\"Press the stop button\",\"Isolate, lock off and tag (LOTO), then prove zero energy, including air and stored heat\",\"Slow the machine down\",\"Ask a colleague to watch\"], a:1, e:\"A stop button is not isolation. Lock out every energy source (electric, pneumatic, hydraulic, gravity, heat) and test it is dead before entry.\"},\n  {q:\"Bubbles or blisters appear in formed parts. The likely cause is…\", o:[\"Moisture in the sheet or overheating\",\"Wrong carton size\",\"Trim misalignment\",\"Too much stacking pressure\"], a:0, e:\"Moisture-sensitive sheet traps steam when heated, and overheating degrades the surface. Dry or store the sheet properly and reduce the heat.\"}\n ]\n};\nconst P = {done:{}, quiz:{}, free:false};\nfunction taskDone(id){ if(id===\"runs3\") return S.runs.length>=3; if(/^cp\\d$/.test(id)) return (P.quiz[id]||0)>=4; return !!P.done[id]; }\nfunction level(){ if(P.free) return 3; const l1=PATH_TASKS[1].every(t=>taskDone(t.id)); const l2=l1 && PATH_TASKS[2].every(t=>taskDone(t.id)); return l2?3:(l1?2:1); }\nfunction mastered(){ return level()===3 && PATH_TASKS[3].every(t=>taskDone(t.id)); }\nfunction unlocked(n){ return DEMO.on || P.free || level()>=n; }\nfunction markTask(id){\n  if(DEMO.on || P.done[id]) return;\n  const before=level(); P.done[id]=true; saveProgress(); afterProgress(before);\n}\nfunction afterProgress(before){\n  renderLevelChip();\n  if(S.tab===\"path\") renderPathLadder();\n  const now=level();\n  if(now>before){ toast(`Level up: ${LEVELS[now-1]} unlocked`); if(S.tab===\"path\") renderPathQuizzes(); if(S.tab===\"career\") renderInterview(); if(S.tab===\"cad\"){ renderFits(); } }\n}\nfunction lockCard(n, what){\n  return `\u003cd  CAD_STEPS = [\n  {code:\"PL\", name:\"Top Plane\", cmd:\"Select plane → Sketch\", title:\"Choose the sketch plane\",\n   text:\"Every part starts from the origin and three default planes: Front, Top and Right. Pick the plane that matches how the part sits in real life. This bracket bolts flat onto a bench, so its base goes on the \u003cb>Top Plane\u003c/b>. Your drawing views will then line up with how a fitter sees the part.\",\n   tip:\"Wrong plane choice is the classic beginner error. The model looks fine, but every standard view comes out sideways on the drawing.\"},\n  {code:\"SK\", name:\"Sketch1 (under defined)\", cmd:\"Sketch → Center Rectangle\", title:\"Sketch the profile\",\n   text:\"A centre rectangle snapped to the origin. The lines are \u003cb>blue\u003c/b> because the sketch is \u003cb>under defined\u003c/b>: you could still drag them. SOLIDWORKS colours tell you the state: blue is under defined, black is fully defined, red is over defined (conflicting dimensions).\",\n   tip:\"Centring on the origin is design intent. The part stays symmetric about its datum when sizes change.\"},\n  {code:\"SD\", name:\"Sketch1 (fully defined)\", cmd:\"Smart Dimension\", title:\"Dimension to fully define\",\n   text:\"Add 120 and 60. The lines turn \u003cb>black\u003c/b>, which means fully defined. Dimension what the inspector will measure, the overall sizes, rather than chaining small dimensions together. Each chained dimension adds its own tolerance to the stack.\",\n   tip:\"If the status bar says 'Over Defined', delete the last dimension or relation. Never keep red geometry.\"},\n  {code:\"BE\", name:\"Boss-Extrude1\", cmd:\"Features → Extruded Boss/Base\", title:\"Extrude the base: 8 mm blind\",\n   text:\"Extrude the sketch 8 mm up. 8 mm is a standard plate and flat-bar thickness, so the base can be cut from stock with no machining of the faces. Other end conditions: \u003cb>Mid Plane\u003c/b> grows both ways from the sketch plane, and \u003cb>Up To Surface\u egments:24});\n    g.rotateX(-Math.PI/2);\n    const mesh = new THREE.Mesh(g, steelMat((k>=3&&k\u003c=6&&k!==9)?hl:baseColor));\n    CAD.part.add(withEdges(mesh));\n    if(k===5 || k===4){\n      const lab = textSprite(k===4?\"Ø10 THRU ALL\":\"2 × Ø10 · 70 c/c\",{scale:0.14}); lab.position.set(0,26,-8+0); CAD.aux.add(lab);\n    }\n    if(k===6){ const lab=textSprite(\"R10 (2)\",{scale:0.14}); lab.position.set(62,18,32); CAD.aux.add(lab); }\n  }\n  if(k>=7){\n    const s = new THREE.Shape(); s.moveTo(-60,8); s.lineTo(60,8); s.lineTo(60,58); s.lineTo(-60,58); s.lineTo(-60,8);\n    const h = new THREE.Path(); h.absarc(0,38,6,0,Math.PI*2,true); s.holes.push(h);\n    const g = new THREE.ExtrudeGeometry(s,{depth:8, bevelEnabled:false, curveSegments:24});\n    const mesh = new THREE.Mesh(g, steelMat(k===7?hl:baseColor)); mesh.position.z=-30;\n    CAD.part.add(withEdges(mesh));\n    if(k===7){ const lab=textSprite(\"Ø12 THRU\",{scale:0.14}); lab.position.set(0,64,-26); CAD.aux.add(lab); }\n  }\n  if(k>=8){\n    [-45,45].forEach(x=>{\n      const s=new THREE.Shape(); s.moveTo(22,8); s.lineTo(-8,8); s.lineTo(22,48); s.lineTo(22,8);\n      const g=new THREE.ExtrudeGeometry(s,{depth:6,bevelEnabled:false}); g.rotateY(Math.PI/2);\n      const mesh=new THREE.Mesh(g, steelMat(k===8?hl:baseColor)); mesh.position.x = x-3;\n      CAD.part.add(withEdges(mesh));\n    });\n  }\n  applyDisplay(CAD.part);\n}\nfunction renderCadPanel(){\n  const k = CAD.step, st = CAD_STEPS[k];\n  $(\"#cadCount\").textContent = `Step ${k+1} of ${CAD_STEPS.length}`;\n  $(\"#cadPrev\").disabled = k===0; $(\"#cadNext\").disabled = k===CAD_STEPS.length-1;\n  $(\"#cadTheory\").innerHTML = `\u003cp class=\"cmd\">${esc(st.cmd)}\u003c/p>\u003ch3>${esc(st.title)}\u003c/h3>\u003cp>${st.text}\u003c/p>\u003cp class=\"tip${k===2?\" warn\":\"\"}\">${esc(st.tip)}\u003c/p>`;\n  const tree = $(\"#cadTree\"); tree.innerHTML=\"\";\n  const head = el(\"li\",{class:\"\",tabindex:\"-1\"},`\u003cspan class=\"ico\">P\u003c/span>\u003cspan>Part MB-01 · ${esc(matById(CAD.mat).name)}\u003c/span>`);\n  head.style.cursor=\"default\"; tree.appendChild(head);\n  CAD_STEPS.forEach((s,i)=>{\n    if(i===2) return; // sketch fully-defined shares the Sketch1 row\n    const li = el(\"li\",{tabindex:\"0\", role:\"button\"},`\u003cspan class=\"ico\">${s.code}\u003c/span>\u003cspan>${esc(i===1&&k>=2?\"Sketch1\":s.name)}\u003c/span>`);\n    const effective = (i===1 && k===2) ? 2 : i;\n    if(effective>k) li.classList.add(\"future\");\n    if(effective===k || (i===1&&k===2)) li.classList.add(\"current\");\n    if(i===k || (i===1&&k===2)) li.classList.add(\"rollback\");\n    const go = ()=>{ cadSet(i===1 && k>=2 ? 2 : i); };\n    li.addEventListener(\"click\", go); li.addEventListener(\"keydown\", e=>{ if(e.key===\"Enter\"||e.key===\" \"){ e.preventDefault(); go(); }});\n    tree.appendChild(li);\n  });\n  const vol = cadVolume(k), m = matById(CAD.mat);\n  const opts = allMaterials().map(x=>`\u003coption value=\"${esc(x.id)}\"${x.id===CAD.mat?\" selected\":\"\"}>${esc(x.name)}\u003c/option>`).join(\"\");\n  $(\"#cadMassPanel\").innerHTML = `\u003ch3 style=\"margin-bottom:8px\">Mass properties\u003c/h3>\n   \u003cdiv class=\"fields\">\u003cdiv class=\"field wide\">\u003clabel for=\"cadMat\">Material\u003c/label>\u003cdiv class=\"inp\">\u003cselect id=\"cadMat\">${opts}\u003c/select>\u003c/div>\u003c/div>\u003c/div>\n   \u003ctable style=\"margin-top:8px\">\u003ctr>\u003cth>Quantity\u003c/th>\u003cth class=\"num\">Value\u003c/th>\u003c/tr>\n   \u003ctr>\u003ctd>Volume\u003c/td>\u003ctd class=\"num\">${fmt(vol,0)} mm³\u003c/td>\u003c/tr>\n   \u003ctr>\u003ctd>Density\u003c/td>\u003ctd class=\"num\">${fmt(m.rho,2)} g/cm³\u003c/td>\u003c/tr>\n   \u003ctr>\u003ctd>\u003cb>Mass\u003c/b>\u003c/td>\u003ctd class=\"num\">\u003cb>${fmt(vol*m.rho/1000,1)} g\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\n   ${k\u003c3?'\u003cp class=\"src\" style=\"margin-top:6px\">No solid body yet: a sketch has no volume.\u003c/p>':''}`;\n  $(\"#cadMat\").addEventListener(\"change\", e=>{ CAD.mat=e.target.value; buildCad(); renderCadPanel(); });\n  setHud(`${esc(st.name)}\u003cbr>${k>=3?`V = ${fmt(vol,0)} mm³`:\"Sketch mode\"}`);\n}\nfunction cadSet(i){ CAD.step = Math.max(0,Math.min(CAD_STEPS.length-1,i)); buildCad(); renderCadPanel(); if(V.ok) frameObject(CAD.root, CAD.view); if(CAD.step===CAD_STEPS.length-1) markTask(\"cad-done\"); }\n\n/* ---- ISO 286 fits (sizes over 3 up to 50 mm) ---- */\nconst FIT_RANGES=[3,6,10,18,30,50];\nconst IT6=[8,9,11,13,16], IT7=[12,15,18,21,25];\nconst SHAFT_DEV={ g:{es:[-4,-5,-6,-7,-9]}, h:{es:[0,0,0,0,0]}, k:{ei:[1,1,1,2,2]}, n:{ei:[8,10,12,15,17]}, p:{ei:[12,15,18,22,26]}, s:{ei:[19,23,28,35,43]} };\nconst FITS={ \"H7/g6\":\"Sliding clearance fit: locating pins, parts that must slide or turn freely and accurately.\",\n  \"H7/h6\":\"Location clearance: assembles by hand, locates accurately, e.g. a spigot in a bore.\",\n  \"H7/k6\":\"Transition: pulleys and couplings on keyed shafts. Light tap to assemble.\",\n  \"H7/n6\":\"Transition, tighter: gears and bushes that must not shift. Press to assemble.\",\n  \"H7/p6\":\"Location interference: bushes pressed in, can still be dismantled.\",\n  \"H7/s6\":\"Press or shrink fit: permanent bushes and seats under heavy load.\" };\nfunction fitCalc(d, fit){\n  const idx=FIT_RANGES.findIndex((v,i)=>i\u003c5 && d>FIT_RANGES[i] && d\u003c=FIT_RANGES[i+1]);\n  if(idx\u003c0) return null;\n  const letter=fit.split(\"/\")[1][0], it6=IT6[idx], it7=IT7[idx], dev=SHAFT_DEV[letter];\n  let es, ei; if(dev.es){ es=dev.es[idx]; ei=es-it6; } else { ei=dev.ei[idx]; es=ei+it6; }\n  const ES=it7, EI=0, cmax=ES-ei, cmin=EI-es;\n  const type = cmin>=0 ? \"Clearance\" : (cmax\u003c=0 ? \"Interference\" : \"Transition\");\n  return {range:`over ${FIT_RANGES[idx]} to ${FIT_RANGES[idx+1]} mm`, it6, it7, ES, EI, es, ei, cmax, cmin, type};\n}\nconst FITSTATE={d:12, fit:\"H7/g6\"};\nfunction renderFits(){\n  const box=$(\"#fitsPanel\"); if(!box) return;\n  if(!unlocked(2)){ box.innerHTML=lockCard(2,\"Fits & tolerances (ISO 286) and section view\"); return; }\n  const f=fitCalc(FITSTATE.d, FITSTATE.fit), d=FITSTATE.d, mm=v=>(d+v/1000).toFixed(3);\n  box.innerHTML=`\u003cdiv class=\"panel stack\">\u003ch3>Fits & tolerances (ISO 286)\u003c/h3>\n   \u003cp style=\"font-size:.86rem;color:var(--muted)\">The flange's Ø12 hole takes a pin. Choose how tight it should be. The values are the ISO 286 tolerance grades and shaft deviations, in micrometres (µm).\u003c/p>\n   \u003cdiv class=\"fields\">\u003cdiv class=\"field\">\u003clabel for=\"fitD\">Nominal size\u003c/label>\u003cdiv class=\"inp\">\u003cinput id=\"fitD\" type=\"number\" min=\"3.01\" max=\"50\" step=\"any\" value=\"${d}\">\u003cspan class=\"unit\">mm\u003c/span>\u003c/div>\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"fitSel\">Fit\u003c/label>\u003cdiv class=\"inp\">\u003cselect id=\"fitSel\">${Object.keys(FITS).map(k=>`\u003coption${k===FITSTATE.fit?\" selected\":\"\"}>${k}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>\u003c/div>\u003c/div>\n   ${f?`\u003ctable class=\"fitout\">\u003ctr>\u003cth>Part\u003c/th>\u003cth class=\"num\">Max\u003c/th>\u003cth class=\"num\">Min\u003c/th>\u003cth class=\"num\">Tol.\u003c/th>\u003c/tr>\n   \u003ctr>\u003ctd>Hole ${FITSTATE.fit.split(\"/\")[0]}\u003c/td>\u003ctd class=\"num\">${mm(f.ES)}\u003c/td>\u003ctd class=\"num\">${mm(f.EI)}\u003c/td>\u003ctd class=\"num\">${f.it7} µm\u003c/td>\u003c/tr>\n   \u003ctr>\u003ctd>Shaft ${FITSTATE.fit.split(\"/\")[1]}\u003c/td>\u003ctd class=\"num\">${mm(f.es)}\u003c/td>\u003ctd class=\"num\">${mm(f.ei)}\u003c/td>\u003ctd class=\"num\">${f.it6} µm\u003c/td>\u003c/tr>\n   \u003ctr>\u003ctd>Max clearance\u003c/td>\u003ctd class=\"num\" colspan=\"3\">${f.cmax>0?\"+\":\"\"}${f.cmax} µm\u003c/td>\u003c/tr>\n   \u003ctr>\u003ctd>Min clearance\u003c/td>\u003ctd class=\"num\" colspan=\"3\">${f.cmin>0?\"+\":\"\"}${f.cmin} µm ${f.cmin\u003c0?\"(interference)\":\"\"}\u003c/td>\u003c/tr>\u003c/table>\n   \u003cdiv>\u003cspan class=\"chip ${f.type===\"Clearance\"?\"pass\":f.type===\"Transition\"?\"warn\":\"fail\"}\">${f.type.toUpperCase()}\u003c/span> \u003cspan style=\"font-size:.86rem\">${esc(FITS[FITSTATE.fit])}\u003c/span>\u003c/div>\n   \u003cp class=\"src\">Size range ${f.range}. Negative clearance means interference: the shaft is bigger than the hole and must be pressed or shrunk in.\u003c/p>`\n   :`\u003cp class=\"tip warn\">This table covers sizes over 3 mm up to 50 mm.\u003c/p>`}\u003c/div>`;\n  const upd=()=>{ const v=parseFloat($(\"#fitD\").value); if(isFinite(v)) FITSTATE.d=v; FITSTATE.fit=$(\"#fitSel\").value; markTask(\"fits-used\"); renderFits(); };\n  $(\"#fitD\").addEventListener(\"change\",upd); $(\"#fitSel\").addEventListener(\"change\",upd);\n}\n\n/* ============================== TEST BENCH ============================== */\nconst STD_T = [3,4,5,6,8,10,12,15,16,20,25,30,35,40,50];\nconst STD_W = [10,12,15,16,20,25,30,35,40,50,60,75,80,100];\nconst STD_M = [1,1.25,1.5,2,2.5,3,4,5,6,8,10];\nconst LEWIS = [[12,.245],[13,.261],[14,.277],[15,.290],[16,.296],[17,.303],[18,.309],[19,.314],[20,.322],[21,.328],[22,.331],[24,.337],[26,.346],[28,.353],[30,.359],[34,.371],[38,.384],[43,.397],[50,.409],[60,.422],[75,.435],[100,.447],[150,.460],[300,.472],[400,.480]];\nfunction lewisY(z){ if(z\u003c=12) return .245; for(let i=1;i\u003cLEWIS.length;i++){ if(z\u003c=LEWIS[i][0]){ const [z0,y0]=LEWIS[i-1],[z1,y1]=LEWIS[i]; return y0+(y1-y0)*(z-z0)/(z1-z0);} } return .48; }\nconst nextStd = (list, v) => list.find(x=>x>=v-1e-9);\n\nconst SC = {\n beam:{\n  name:\"Shelf bracket\", story:\"A steel flat-bar arm holds a workshop shelf. The worst case is a 40 kg vice placed at the very end, 300 mm from the wall. The arm must not yield (FoS ≥ 2) and must not sag more than L/200, or the shelf visibly tilts.\",\n  defaults:{F:392, L:300, b:25, h:6, mat:\"s275\", fos:2, defl:200},\n  sweep:{key:\"h\", label:\"Bar thickness h (mm)\", min:4, max:40, step:1},\n  fields:[[\"F\",\"Load at tip\",\"N\"],[\"L\",\"Arm length\",\"mm\"],[\"b\",\"Bar width b\",\"mm\"],[\"h\",\"Bar thickness h\",\"mm\"],[\"fos\",\"Required FoS\",\"–\"],[\"defl\",\"Sag limit L /\",\"–\"]],\n  calc(p,m){\n    const E=m.E*1000, I=p.b*Math.pow(p.h,3)/12, M=p.F*p.L, sig=6*p.F*p.L/(p.b*p.h*p.h), d=p.F*Math.pow(p.L,3)/(3*E*I), fos=m.sy/sig, dAllow=p.L/p.defl, mass=p.b*p.h*p.L*m.rho/1000;\n    const checks=[\n      {name:\"Bending stress σ\", val:`${fmt(sig,1)} MPa`, lim:`≤ ${fmt(m.sy/p.fos,1)} MPa`, ok: fos>=p.fos-1e-9, u:p.fos/fos},\n      {name:\"Factor of safety\", val:fmt(fos,2), lim:`≥ ${fmt(p.fos,1)}`, ok: fos>=p.fos-1e-9},\n      {name:\"Tip deflection δ\", val:`${fmt(d,2)} mm`, lim:`≤ ${fmt(dAllow,2)} mm`, ok: d\u003c=dAllow+1e-9, u:d/dAllow},\n      {name:\"Mass of arm\", val:`${fmt(mass,0)} g`, lim:\"lower is better\", ok:null}\n    ];\n    const work = `I  = b·h³/12 = ${p.b}·${p.h}³/12 = ${fmt(I,1)} mm⁴\nM  = F·L = ${p.F}·${p.L} = ${fmt(M,0)} N·mm\nσ  = M·c/I = 6FL/(b·h²) = ${fmt(sig,1)} MPa   (c = h/2)\nFoS = σy/σ = ${m.sy}/${fmt(sig,1)} = ${fmt(fos,2)}\nδ  = F·L³/(3·E·I) = ${p.F}·${p.L}³/(3·${fmt(E,0)}·${fmt(I,1)}) = ${fmt(d,2)} mm\nδallow = L/${p.defl} = ${fmt(dAllow,2)} mm`;\n    return {checks, work, sig, fos, d, I, E, mass, pass: checks.filter(c=>c.ok!==null).every(c=>c.ok), key:`h ${p.h} × b ${p.b} · FoS ${fmt(fos,2)} · δ ${fmt(d,2)} mm · ${fmt(mass,0)} g`};\n  },\n  improve(p,m){\n    const r=this.calc(p,m), q={...p};\n    if(r.fos \u003c p.fos){\n      let hReq=Math.sqrt(6*p.F*p.L*p.fos/(p.b*m.sy)); let h=nextStd(STD_T,hReq);\n      if(!h){ q.b=nextStd(STD_W,p.b+1)||p.b*1.5; return {q, why:`Thickness would pass 50 mm, so widen the bar to ${q.b} mm first.`}; }\n      q.h=h; return {q, why:`\u003cb>Strength fails.\u003c/b> Bending stress goes with 1/h², so thickness is the strongest lever. Needed h ≥ √(6·F·L·FoS / (b·σy)) = ${fmt(hReq,2)} mm, so use the next stock size: \u003cb>${h} mm\u003c/b> flat bar.`};\n    }\n    if(r.d > p.L/p.defl){\n      const Ireq=p.F*Math.pow(p.L,3)/(3*r.E*(p.L/p.defl)); const hReq=Math.cbrt(12*Ireq/p.b); const h=nextStd(STD_T,hReq);\n      if(!h){ q.b=nextStd(STD_W,p.b+1)||p.b*1.5; return {q, why:`Needs more than 50 mm thickness, so widen the bar to ${q.b} mm.`}; }\n      q.h=h; return {q, why:`\u003cb>Strong enough, but too floppy.\u003c/b> Stiffness depends on E·I, and I grows with h³. Required I = F·L³/(3·E·δallow) = ${fmt(Ireq,0)} mm⁴, so h ≥ ${fmt(hReq,2)} mm. Next stock size: \u003cb>${h} mm\u003c/b>.`};\n    }\n    for(const b of STD_W){ if(b>=p.b) break; const t=this.calc({...p,b},m); if(t.pass){ q.b=b; return {q, why:`\u003cb>Passes, now cut weight.\u003c/b> Width enters stress and stiffness only linearly, so it is the cheapest dimension to trim. The narrowest stock width that still passes both checks is \u003cb>${b} mm\u003c/b>. Same idea as generative design: remove material that carries no load.`}; } }\n    return {q:null, why:\"No further improvement: the design passes both checks with the lightest stock section.\"};\n  }\n },\n gear:{\n  name:\"Gear drive\", story:\"A 4 kW, 1450 rpm motor drives a mixer paddle through one spur-gear pair. The paddle must turn at 290 rpm ± 3%. Steel gears are checked with the Lewis bending equation and the Barth velocity factor for cut teeth.\",\n  defaults:{P:4, n1:1450, z1:12, z2:54, m:1.5, b:12, eta:0.98, target:290, tol:3, fos:2, mat:\"aisi1020\"},\n  sweep:{key:\"m\", label:\"Module m (mm)\", min:1, max:5, step:0.125},\n  fields:[[\"P\",\"Motor power\",\"kW\"],[\"n1\",\"Motor speed\",\"rpm\"],[\"z1\",\"Pinion teeth z₁\",\"–\"],[\"z2\",\"Gear teeth z₂\",\"–\"],[\"m\",\"Module m\",\"mm\"],[\"b\",\"Face width b\",\"mm\"],[\"target\",\"Target output\",\"rpm\"],[\"fos\",\"Required FoS\",\"–\"]],\n  calc(p,m){\n    const i=p.z2/p.z1, n2=p.n1/i, T1=9550*p.P/p.n1, T2=T1*i*p.eta, d1=p.m*p.z1, d2=p.m*p.z2, a=(d1+d2)/2, v=Math.PI*d1*p.n1/60000, Ft=2000*T1/d1, Y=lewisY(p.z1), Kv=(6.1+v)/6.1, sig=Kv*Ft/(p.b*p.m*Y), fos=m.sy/sig, err=(n2-p.target)/p.target*100, bm=p.b/p.m;\n    const checks=[\n      {name:\"Output speed\", val:`${fmt(n2,1)} rpm`, lim:`${p.target} ± ${p.tol}%`, ok: Math.abs(err)\u003c=p.tol, u:Math.abs(err)/p.tol},\n      {name:\"Pinion teeth (no undercut)\", val:`${p.z1}`, lim:\"≥ 17 at 20° PA\", ok: p.z1>=17, u:17/p.z1},\n      {name:\"Tooth bending FoS\", val:fmt(fos,2), lim:`≥ ${fmt(p.fos,1)}`, ok: fos>=p.fos-1e-9, u:p.fos/fos},\n      {name:\"Face width ratio b/m\", val:fmt(bm,1), lim:\"8 – 12\", ok: bm>=8-1e-9 && bm\u003c=12+1e-9, u:Math.max(8/bm, bm/12)},\n      {name:\"Ratio per stage\", val:fmt(i,2), lim:\"≤ 6\", ok: i\u003c=6+1e-9, u:i/6},\n      {name:\"Centre distance\", val:`${fmt(a,1)} mm`, lim:\"info\", ok:null},\n      {name:\"Output torque\", val:`${fmt(T2,1)} N·m`, lim:\"info\", ok:null}\n    ];\n    const work = `i   = z₂/z₁ = ${p.z2}/${p.z1} = ${fmt(i,3)}\nn₂  = n₁/i = ${p.n1}/${fmt(i,3)} = ${fmt(n2,1)} rpm  (error ${fmt(err,1)}%)\nT₁  = 9550·P/n₁ = 9550·${p.P}/${p.n1} = ${fmt(T1,2)} N·m\nd₁  = m·z₁ = ${fmt(d1,1)} mm,  d₂ = ${fmt(d2,1)} mm,  a = (d₁+d₂)/2 = ${fmt(a,1)} mm\nFt  = 2·T₁/d₁ = ${fmt(Ft,0)} N\nv   = π·d₁·n₁/60000 = ${fmt(v,2)} m/s,  Kv = (6.1+v)/6.1 = ${fmt(Kv,3)}\nY(z₁=${p.z1}) = ${fmt(Y,3)}  (Lewis form factor, 20° full depth)\nσ   = Kv·Ft/(b·m·Y) = ${fmt(sig,1)} MPa,  FoS = ${m.sy}/${fmt(sig,1)} = ${fmt(fos,2)}\nT₂  = T₁·i·η = ${fmt(T2,1)} N·m  (η = ${p.eta})`;\n    return {checks, work, i, n2, d1, d2, a, sig, fos, util: p.fos/fos, pass: checks.filter(c=>c.ok!==null).every(c=>c.ok), key:`${p.z1}/${p.z2}T · m${p.m} · b${p.b} · ${fmt(n2,0)} rpm · FoS ${fmt(fos,2)}`};\n  },\n  improve(p,m){\n    const r=this.calc(p,m), q={...p}, iT=p.n1/p.target;\n    if(p.z1\u003c17){ q.z1=17; q.z2=Math.round(17*iT); return {q, why:`\u003cb>Pinion undercut and wrong speed.\u003c/b> With a 20° pressure angle, fewer than 17 teeth makes the cutter undercut the tooth root, which weakens it. Use z₁ = 17, then set z₂ = 17 × ${fmt(iT,2)} ≈ \u003cb>${q.z2}\u003c/b> to hit ${p.target} rpm.`}; }\n    if(Math.abs((r.n2-p.target)/p.target*100)>p.tol){ q.z2=Math.round(p.z1*iT); return {q, why:`\u003cb>Speed off target.\u003c/b> Required ratio n₁/n₂ = ${fmt(iT,2)}, so z₂ = ${p.z1} × ${fmt(iT,2)} ≈ \u003cb>${q.z2}\u003c/b>.`}; }\n    if(r.fos\u003cp.fos){\n      for(const mm of STD_M){ if(mm\u003cp.m) continue; const bb=Math.round(Math.min(Math.max(p.b,8*mm),12*mm)); const t=this.calc({...p,m:mm,b:bb},m); if(t.fos>=p.fos){ q.m=mm; q.b=bb; return {q, why:`\u003cb>Teeth too weak.\u003c/b> Lewis stress falls with module twice: a bigger tooth section, and a bigger pitch diameter that lowers the tangential force. Smallest standard module that passes: \u003cb>m = ${mm}\u003c/b>, with face width set inside the 8–12·m rule: \u003cb>b = ${bb} mm\u003c/b>.`}; } }\n      return {q:null, why:\"Even module 10 fails. Use a stronger material or two stages.\"};\n    }\n    const bm=p.b/p.m; if(bm\u003c8||bm>12){ q.b=Math.round(10*p.m); return {q, why:`\u003cb>Face width out of proportion.\u003c/b> Below 8·m the load is carried on a narrow strip; above 12·m small misalignment loads one edge. Set b = 10·m = \u003cb>${q.b} mm\u003c/b>.`}; }\n    return {q:null, why:\"No further improvement: speed, tooth strength and proportions all pass.\"};\n  }\n },\n rail:{\n  name:\"Rail in summer\", story:\"Jointed track built from 120 ft (36.576 m) 60E1 rails, laid at 10 °C with a 4 mm gap at each joint. Rail temperature reaches 50 °C in a heatwave (well above air temperature) and −15 °C in winter. The gap must not close in summer, or the rails go into compression and can buckle. In winter the joint must not open beyond the 20 mm the fishplates allow.\",\n  defaults:{L:36.576, Ti:10, Tmax:50, Tmin:-15, g:4, gmax:20, mat:\"rail\"},\n  sweep:{key:\"g\", label:\"Gap when laid g (mm)\", min:1, max:30, step:0.5},\n  fields:[[\"L\",\"Rail length\",\"m\"],[\"Ti\",\"Laying temperature\",\"°C\"],[\"Tmax\",\"Max rail temp\",\"°C\"],[\"Tmin\",\"Min rail temp\",\"°C\"],[\"g\",\"Gap when laid\",\"mm\"],[\"gmax\",\"Max joint opening\",\"mm\"]],\n  calc(p,m){\n    const a=m.alpha*1e-6, Lmm=p.L*1000, dHot=a*Lmm*(p.Tmax-p.Ti), gHot=p.g-dHot, gCold=p.g+a*Lmm*(p.Ti-p.Tmin), Tclose=p.Ti+p.g/(a*Lmm), sig = gHot\u003c0 ? m.E*1000*(-gHot)/Lmm : 0;\n    const checks=[\n      {name:\"Gap at max temperature\", val:`${fmt(gHot,2)} mm`, lim:\"≥ 0\", ok: gHot>=-1e-9, u: p.g>0 ? dHot/p.g : 9},\n      {name:\"Compressive stress if closed\", val:`${fmt(sig,1)} MPa`, lim:\"0 for jointed track\", ok: sig\u003c=1e-9},\n      {name:\"Joint opening at min temp\", val:`${fmt(gCold,2)} mm`, lim:`≤ ${p.gmax} mm`, ok: gCold\u003c=p.gmax+1e-9, u:gCold/p.gmax},\n      {name:\"Gap closes at\", val:`${fmt(Tclose,1)} °C`, lim:\"info\", ok:null}\n    ];\n    const work = `α  = ${m.alpha}×10⁻⁶ /°C,  L = ${fmt(Lmm,0)} mm\nΔL(hot) = α·L·(Tmax − Ti) = ${m.alpha}e-6·${fmt(Lmm,0)}·${p.Tmax-p.Ti} = ${fmt(dHot,2)} mm\ngap(hot) = g − ΔL = ${p.g} − ${fmt(dHot,2)} = ${fmt(gHot,2)} mm\nIf gap \u003c 0, the blocked strain is ε = |gap|/L, so σ = E·ε = ${fmt(sig,1)} MPa (compression)\ngap(cold) = g + α·L·(Ti − Tmin) = ${fmt(gCold,2)} mm\nGap closes at T = Ti + g/(α·L) = ${fmt(Tclose,1)} °C`;\n    return {checks, work, a, Lmm, gHot, gCold, sig, pass: checks.filter(c=>c.ok!==null).every(c=>c.ok), key:`L ${fmt(p.L,3)} m · gap ${p.g} mm · hot ${fmt(gHot,1)} · cold ${fmt(gCold,1)} mm`};\n  },\n  improve(p,m){\n    const r=this.calc(p,m), q={...p}, a=m.alpha*1e-6;\n    if(r.gHot\u003c0){ q.g=Math.ceil(a*p.L*1000*(p.Tmax-p.Ti)+1); return {q, why:`\u003cb>Gap closes at ${fmt(p.Ti+p.g/(a*p.L*1000),1)} °C.\u003c/b> Above that the rail is jammed, and steel's high E turns tiny blocked strains into large stresses. The gap must at least equal the expansion α·L·ΔT = ${fmt(a*p.L*1000*(p.Tmax-p.Ti),2)} mm, plus 1 mm margin: \u003cb>${q.g} mm\u003c/b>.`}; }\n    if(r.gCold>p.gmax){\n      const range=p.Tmax-p.Tmin; const lens=[36.576,18.288,12.192,9.144];\n      const L=lens.find(x=>a*x*1000*range+2\u003c=p.gmax);\n      if(!L) return {q:null, why:\"No standard length fits that temperature range. Use continuous welded rail, which is stressed to a set neutral temperature instead of using gaps.\"};\n      q.L=L; q.g=Math.ceil(a*L*1000*(p.Tmax-p.Ti)+1);\n      return {q, why:`\u003cb>Joint opens too far in winter.\u003c/b> The total movement α·L·(Tmax − Tmin) = ${fmt(a*p.L*1000*range,1)} mm cannot be absorbed by one joint, and changing the laying temperature only shifts it between seasons. Shorten the rail to the classic \u003cb>60 ft (18.288 m)\u003c/b> length and reset the gap to \u003cb>${q.g} mm\u003c/b>.`};\n    }\n    return {q:null, why:\"No further improvement: the joint stays open in summer and within the fishplate limit in winter.\"};\n  }\n },\n arm:{\n  name:\"Robot arm\", story:\"A desktop arm in the style of the SO-101 that LeRobot drives (dimensions are illustrative, not the official design). It must lift a 200 g part at 260 mm from the shoulder axis, with printed PLA links and hobby servos. A servo's stall torque is the most it can give for a moment; to hold a load all day, keep demand at or below half of stall (FoS 2). The gripper must place parts within 2 mm.\",\n  defaults:{L1:150, L2:150, reach:260, mp:200, mg:80, me:60, w:24, hgt:30, t:3, stall:16, rs:1, re:1, bl:0.5, acc:3, prec:2, fos:2, mat:\"pla\"},\n  sweep:{key:\"mp\", label:\"Payload (g)\", min:0, max:800, step:20},\n  fields:[[\"L1\",\"Upper arm L₁\",\"mm\"],[\"L2\",\"Forearm L₂\",\"mm\"],[\"reach\",\"Required reach\",\"mm\"],[\"mp\",\"Payload\",\"g\"],[\"mg\",\"Gripper + wrist\",\"g\"],[\"me\",\"Elbow servo mass\",\"g\"],[\"hgt\",\"Link section height\",\"mm\"],[\"w\",\"Link section width\",\"mm\"],[\"t\",\"Link wall thickness\",\"mm\"],[\"stall\",\"Servo stall torque\",\"kg·cm\"],[\"rs\",\"Shoulder reduction\",\"×\"],[\"re\",\"Elbow reduction\",\"×\"],[\"bl\",\"Servo backlash\",\"°\"],[\"acc\",\"Shoulder accel α\",\"rad/s²\"],[\"prec\",\"Tip accuracy target\",\"mm\"],[\"fos\",\
