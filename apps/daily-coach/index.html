<!-- real edge refraction: SVG displacement map fed to backdrop-filter on Chromium -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:fixed;pointer-events:none">
  <defs>
    <filter id="liquidRefract" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="3" seed="11" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="7" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
